l_spanish:
 game_concept_prowess_skill_desc:3 "$game_concept_prowess$ es secundario [skill|E] que refleja la aptitud del personaje en el combate personal.\n\nUna habilidad de destreza alta significa que tienen más probabilidades de sobrevivir y desempeñarse bien tanto como [knights|E] en [battles|E] y en [single_combat_duel_plural|E].\n\nCada punto de Destreza le da a un Caballero:\n$BULLET_WITH_TAB$[damage|E]: #V [GetDefine('NCombat', 'KNIGHT_DAMAGE_PER_PROWESS')]#!\n$BULLET_WITH_TAB$[toughness|E]: #V [GetDefine('NCombat', 'KNIGHT_TOUGHNESS_PER_PROWESS')]#!\n\n$PROWESS_MUSCLE_INFO$ $cc_prowess_all_desc$"
 game_concept_knight_desc:4 "A $game_concept_knight$ es un [vassal|E] o [courtier|E] que pelea directamente en tu [army|E].\n\nDurante [battles|E], $game_concept_knights$ usa su [prowess_skill|E] para luchar más eficazmente. un alto $game_concept_prowess$ significa que podrán infligir más daño al enemigo y tendrán más probabilidades de sobrevivir o incluso salir de allí. $game_concept_battle$ indemne.\n$cc_prowess_knight_desc$ \n\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_knight_desc_TOTO_DLC', 'game_concept_knight_desc_NO_TOTO_DLC' )][SelectLocalization( HasDlcFeature( 'accolades' ), 'game_concept_knight_desc_ACCOLADE_DLC', '' )]#weak Los caballeros pueden ser conocidos por diferentes nombres dependiendo de [culture] o [faith]. Por ejemplo, $knight_champion_no_tooltip_plural$, $knight_faris_no_tooltip_plural$ o $knight_baghatur_no_tooltip_plural$.\n\nLos caballeros representan tanto al personaje como a su séquito de tropas.#!"
 game_concept_martial_skill_desc:2 "$game_concept_martial$ [skill|E] Indica lo bueno que es un personaje en la lucha. [war|E] y liderando [armies|E] en [battle|E].\n\nUna alta habilidad marcial es importante para [army_commanders|E], ya que mejora su [advantage|E] en [battle|E].\n\nEl correspondiente [lifestyle|E] es el [martial_lifestyle|E]. $cc_martial_all_desc$"
 martial_effect_desc:0 "Aumenta [advantage|E] al comandar ejércitos en combate $cc_martial_commander_desc$"
 game_concept_unlanded_desc:0 "$game_concept_unlanded$ Los personajes no tienen [holdings|E] en su [domain|E], pero en teoría todavía puede ser [rulers|E] de una especie. Por ejemplo, este puede ser el caso de [heads_of_faith|E] y los Grandes Maestros de [holy_orders|E]. $cc_mechanic_unlanded_desc_1$"
 game_concept_barony_desc:0 "$game_concept_baronies$ son los peor clasificados [titles|E] y tener la huella más pequeña en el mapa, organizado en más grandes [counties|E].\n\nLos Títulos de Baronía siempre deben tener una [holder|E] si contienen un [holding|E]. $cc_mechanic_unlanded_desc_2$"
 game_concept_county_desc:0 "A $game_concept_county$ es un [title|E] ranking por debajo de un [duchy|E] y encima un [barony|E].\n\nEl título incluye el [county_capital|E] en el condado, así como [de_jure|E] derechos a todas las Baronías del Condado.\n\nLos condados siempre tienen [holders|E] porque las capitales de condado no pueden ser destruidas. $cc_mechanic_unlanded_desc_3$"
 game_concept_duchy_desc:0 "A $game_concept_duchy$ es un [title|E] ranking por debajo de un [kingdom|E] y encima un [county|E].\n\nEl [holder|E] de un ducado tiene [de_jure|E] derechos a sus condados constituyentes y puede tener condes como [vassals|E].\n\nLos ducados pueden estar inactivos y no tener un titular actual. Dichos títulos pueden ser creados por un [ruler|E] que controla al menos la mitad de sus condados. $cc_mechanic_unlanded_desc_4$"
 game_concept_kingdom_desc:0 "A $game_concept_kingdom$ es un [title|E] ubicándose por debajo de un [empire|E] y encima un [duchy|E].\n\nEl [holder|E] de un reino tiene [de_jure|E] derechos sobre su territorio constituyente y puede tener duques como [vassals|E].\n\nLos reinos pueden estar inactivos y no tener ningún poseedor actual. Dichos títulos pueden ser creados por un [ruler|E] que controla al menos la mitad de los condados del interior.$cc_mechanic_unlanded_desc_5$"
 game_concept_empire_desc:1 "$game_concept_empires$ son los mejor clasificados [titles|E].\n\nEl [holder|E] de un imperio tiene [de_jure|E] derechos sobre su territorio constituyente y puede tener Reyes como [vassals|E].\n\nLos imperios pueden estar inactivos y no tener ningún poseedor actual. Dichos títulos pueden ser creados por un [ruler|E] ¿Quién controla más de 80% de los condados dentro. $cc_mechanic_unlanded_desc_6$"
 game_concept_title_tier_desc:2 "El equivalente terrestre del título [rank|E], el $game_concept_title_tier$ determina la posición de un [title|E] dentro de la jerarquía del juego.\n\nTodos los títulos tienen un Nivel, que determina el Nivel más alto posible de [vassals|E] que el [holder|E] puede tener.\n\n[empire|E] > [kingdom|E] > [duchy|E] > [county|E] > [barony|E]. $cc_unlanded_all_desc$"
 bodyguard_employer_custom_effect_description:2 "Tiene la posibilidad de prevenir el asesinato. [GetScheme('murder').GetTypeName] [schemes|E]#!\nReduce el riesgo de morir o ser capturado en [battles|E] ambos estáis peleando#! $cc_court_position_bodyguard_desc$"
 champion_employer_custom_effect_description:2 "Puedes tomar tu lugar en algunos [single_combat_duel_plural|E]\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'champion_employer_custom_effect_description_TOTO_DLC', 'champion_employer_custom_effect_description_NO_TOTO_DLC' )] $cc_court_position_champion_desc$"
 trait_wounded_1_desc:0 "Este personaje ha sido herido, pero probablemente sanará bien con el tiempo. $cc_trait_h_wounded$"
 trait_wounded_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] Ha sido herido, pero probablemente sanará bien con el tiempo. $cc_trait_h_wounded$"
 trait_one_eyed_desc:0 "Este personaje sólo tiene un ojo. $cc_trait_h_one_eyed$"
 trait_one_eyed_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] solo tiene un ojo. $cc_trait_h_one_eyed$"
 trait_disfigured_desc:0 "Este personaje está horriblemente desfigurado. $cc_trait_h_disfigured$"
 trait_disfigured_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] está horriblemente desfigurado. $cc_trait_h_disfigured$"
 trait_one_legged_desc:0 "Este personaje sólo tiene una pierna. $cc_trait_h_one_legged$"
 trait_one_legged_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] solo tiene una pierna. $cc_trait_h_one_legged$"
 trait_wounded_2_desc:0 "Este personaje ha resultado gravemente herido y el camino hacia la recuperación podría ser largo. $cc_trait_h_wounded_2$"
 trait_wounded_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ha resultado gravemente herido y el camino hacia la recuperación podría ser largo. $cc_trait_h_wounded_2$"
 trait_wounded_3_desc:0 "Este personaje ha quedado destrozado y se aferra a la vida. $cc_trait_h_wounded_3$"
 trait_wounded_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] se ha roto y se aferra a la vida. $cc_trait_h_wounded_3$"
 trait_maimed_desc:1 "Este personaje ha quedado gravemente mutilado. $cc_trait_h_maimed$"
 trait_maimed_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ha quedado gravemente mutilado. $cc_trait_h_maimed$"


