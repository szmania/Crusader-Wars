 trait_aggressive_attacker_character_desc:0 "$cc_trait_aggressive_attacker$ Nada saciará [ROOT.GetCharacter.GetFirstNameNoTooltip] pero la sangre de [ROOT.GetCharacter.GetHerHis] enemigos."
 trait_flexible_leader_character_desc:0 "$cc_trait_flexible_leader$[ROOT.GetCharacter.GetFirstNameNoTooltip] sabe cómo reducir la ventaja que obtienen los ejércitos defensores de las fortificaciones, el terreno, los ríos y los cruces de estrechos."
 trait_forder_character_desc:1 "$cc_trait_forder$[ROOT.GetCharacter.GetFirstNameNoTooltip] se siente cómodo cerca del agua y no sufrirá ninguna penalización de Ventaja en las batallas cuando ataque a través de rectas o ríos."
 trait_holy_warrior_character_desc:0 "$cc_trait_holy_warrior$Ardiendo con justo fervor, [ROOT.GetCharacter.GetFirstNameNoTooltip] No descansará hasta que todos los paganos sean derrotados."
 trait_unyielding_defender_character_desc:0 "$cc_trait_unyielding_defender$[ROOT.GetCharacter.GetFirstNameNoTooltip] Una cosa sabe por encima de todo: hasta aquí llega el enemigo."
 trait_forest_fighter_character_desc:0 "$cc_trait_forest_fighter$Mientras que algunos ven los bosques como obstáculos, [ROOT.GetCharacter.GetFirstNameNoTooltip] ve oportunidad."
 trait_open_terrain_expert_character_desc:0 "$cc_trait_open_terrain_expert$Campos abiertos y vastos espacios son donde [ROOT.GetCharacter.GetFirstNameNoTooltip] se siente como en casa y no tarda en aprovechar esto en la batalla."
 trait_rough_terrain_expert_character_desc:0 "$cc_trait_rough_terrain_expert$El terreno difícil puede ser una herramienta poderosa para aquellos capaces de utilizarlo y ganar ventaja en la batalla."
 trait_desert_warrior_character_desc:0 "$cc_trait_desert_warrior$El sol castigador y el calor abrasador del desierto no son enemigos [ROOT.GetCharacter.GetFirstNameNoTooltip]."
 trait_jungle_stalker_character_desc:0 "$cc_trait_jungle_stalker$El frondoso bosque de cualquier selva es un aliado para [ROOT.GetCharacter.GetFirstNameNoTooltip]."
 trait_winter_soldier_character_desc:0 "$cc_trait_winter_soldier$[ROOT.GetCharacter.GetFirstNameNoTooltip] se moldea por el frío glacial, y sabe convertirlo en [ROOT.GetCharacter.GetHerHis] ventaja."
 trait_logistician_character_desc:0 "$cc_trait_logistician$Si hay una cosa [ROOT.GetCharacter.GetFirstNameNoTooltip] sabe, es cómo hacer que los suministros duren... y duren bien."
 trait_aggressive_attacker_desc:0 "$cc_trait_aggressive_attacker$Nada saciará a un atacante agresivo excepto la sangre de sus enemigos."
 trait_flexible_leader_desc:0 "$cc_trait_flexible_leader$Este personaje sabe cómo reducir la ventaja que obtienen los ejércitos defensores de las fortificaciones, el terreno, los ríos y los cruces de estrechos."
 trait_forder_desc:1 "$cc_trait_forder$Este personaje se siente cómodo cerca del agua y no sufrirá ninguna penalización de Ventaja en las batallas cuando ataque a través de rectas o ríos."
 trait_holy_warrior_desc:0 "$cc_trait_holy_warrior$Ardiendo con justo fervor, el Guerrero Santo no descansará hasta que todos los paganos sean derrotados."
 trait_unyielding_defender_desc:0 "$cc_trait_unyielding_defender$Un defensor inquebrantable sabe una cosa por encima de todo: hasta aquí llega el enemigo."
 trait_forest_fighter_desc:0 "$cc_trait_forest_fighter$Donde algunos ven los bosques como obstáculos, este personaje ve una oportunidad."
 trait_open_terrain_expert_desc:1 "$cc_trait_open_terrain_expert$Los campos abiertos y los vastos espacios son donde este personaje se siente como en casa, y no tarda en aprovecharlos en la batalla."
 trait_rough_terrain_expert_desc:0 "$cc_trait_rough_terrain_expert$El terreno difícil puede ser una herramienta poderosa para aquellos capaces de utilizarlo y ganar ventaja en la batalla."
 trait_desert_warrior_desc:0 "$cc_trait_desert_warrior$El sol castigador y el calor abrasador del desierto no son enemigos de este personaje."
 trait_jungle_stalker_desc:0 "$cc_trait_jungle_stalker$El frondoso bosque de cualquier jungla es un aliado para este personaje."
 trait_winter_soldier_desc:0 "$cc_trait_winter_soldier$Este carácter se deja moldear por el frío glacial y sabe aprovecharlo."
 trait_logistician_desc:0 "$cc_trait_logistician$Si hay algo que sabe el logístico es cómo hacer que los suministros duren... y duren bien."
