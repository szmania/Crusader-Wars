	#
	### Event/Alert Window button texts ###
	ccalert.1.title: "Notificación de conflictos de cruzados|Pre-Beta de "Calidad de vida"|Marzo 2024"
ccalert.1.desc: "#high El mod se actualizó a v0.9.11 "¡Calidad de vida!", actualiza tu Crusader Conflicts Launcher ahora si aún no lo has hecho, para evitar errores.\n\nEl lanzador de Crusader Conflicts es #high separado #! del mod de CK3 de Steam Workshop. Steam actualizará automáticamente el archivo del mod de CK3, pero Steam #high NO #! actualiza automáticamente el lanzador CrusaderConflicts.exe. Debes abrir CK3 al menos una vez y luego ir al CC Launcher y actualizar; si no lo abres, el lanzador no detectará ninguna actualización.\n\n#X Si no descargas el lanzador actualizado, tus batallas de Attila fallarán. Has sido advertido."
 	ccalert.1.a: "¡Actualizaré Crusader Conflicts Launcher ahora!"
