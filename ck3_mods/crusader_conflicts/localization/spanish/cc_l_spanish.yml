	cc_op_about_hsub_um: "Cómo funciona:\n\n\n\n#i Requerido:#!\n\n\n\n#i #high Opcional:#! #!\n\n#X No compatible:#!"
	cc_op_about_desc_um: "#high Conflictos cruzados#! lee en detalle sobre la batalla que #high Reyes cruzados 3#! El personaje está involucrado y lo convierte en un #high Total War: Batalla de Atila#! que puedes controlar directamente. Los levas, hombres de armas y caballeros se convierten en unidades equivalentes en Total War: Attila. Para obtener información detallada sobre cómo se convierten las unidades, consulte la #clickable Tropa por cultura#! cortina a la italiana.\n\n#i Versiones Steam de Crusader Kings 3, Total War: Attila, Atila DLC - Era de Carlomagno\nSuscrito al mod Crusader Conflicts para AMBOS Crusader Kings 3 Y Guerra Total: Atila\nAplicación independiente mod Crusader Conflicts #!\n\n#i #high Total War: Atila mod - 1212 AD (paquetes de modelos 1-8)#! #!- para unidades culturales adicionales#!\n\n#X 1212 Módulo AD Scripts: no se suscriba a esta parte particular del 1212 mod AD#!"
	cc_op_help_hsub_um: "Preguntas frecuentes sobre ayuda:\n\n\n\n\n\n\n¿Tiene preguntas? ¿Necesitar ayuda?"
	cc_op_help_desc_um: "#high ¡Las batallas de Atila funcionan mal/se retrasan!#! - Baja tus opciones de gráficos en Atila, baja el #clickable Escala de batalla#! opciones. También asegúrese de que Crusader Kings 3 está completamente suspendido en el fondo.\n#high Los números de unidades de batalla de Atila no coinciden #clickable Tamaño de la unidad #!opciones!#! - Revise que la opción de gráficos de Attila para TAMAÑO DE UNIDAD esté configurada en ULTRA. Un valor inferior a ULTRA dará como resultado unidades más pequeñas.\n#high ¡Atila se bloquea al intentar cargar!#! - Revisa que NO estés utilizando el 1212 Mod de secuencias de comandos AD.\n#high ¡Hacer clic en el botón Jugar batalla no hace nada!#! - Revisa que estás lanzando CK3 a través de CrusaderConflicts.exe haciendo clic en el ícono de la bandera central, no inicie CK manualmente3 de vapor.\n#high ¿Por qué no puedo controlar algunas batallas?#! - Las batallas manuales solo están disponibles cuando el personaje del jugador comanda personalmente el ejército.\n\n#high discordia - #! https://discord.gg/eFZTprHh3j"
