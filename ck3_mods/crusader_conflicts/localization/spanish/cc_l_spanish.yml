	### About Mod tab texts ###
	cc_op_tab1_desc: "Las opciones de modificación de Crusader Conflicts actualmente solo están disponibles en #high Inglés#! localización."
	cc_op_page1_desc: "#clickable Detalles de la modificación"
	cc_op_about_head: "Acerca de Mod"
	cc_op_about_hsub: "Cómo funciona:\n\n\n\n#i Requerido:#!\n\n\n\n#i #high Mapeadores de unidades:#! #!\n\n\n#X No compatible:#!"
	cc_op_about_desc: "#high Conflictos cruzados#! lee en detalle sobre la batalla que #high Reyes cruzados 3#! El personaje está involucrado y lo convierte en un #high Total War: Batalla de Atila#! que puedes controlar directamente. Los levas, hombres de armas y caballeros se convierten en unidades equivalentes en Total War: Attila. Para obtener información detallada sobre cómo se convierten las unidades, consulte la #clickable Tropa por cultura#! cortina a la italiana.\n\n#i Aplicación independiente mod Crusader Conflicts\nVersiones Steam de Crusader Kings 3, Total War: Attila, Atila DLC - Era de Carlomagno#!\n\n#i #high Así es como el mod sabe qué unidades usar en Atila. Cada uno tiene modificaciones/DLC requeridos, que debes habilitar cuando se carga el asignador de unidades. La estructura de los mismos es básicamente asignar nombres de culturas y herencias a un grupo de unidades de los mods/dlc.#!\n\n#X 1212 Módulo AD Scripts: no se suscriba a esta parte particular del 1212 mod AD\nPaquete de ejércitos culturales - CK3 modo#!"
	cc_op_help_head: "Ayuda y comunidad"
	cc_op_help_hsub: "Preguntas frecuentes sobre ayuda:\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n¿Tiene preguntas? ¿Necesitar ayuda?"
	cc_op_help_desc: "#high ¡Las batallas de Atila funcionan mal/se retrasan!#! - Baja tus opciones de gráficos en Atila, baja el #clickable Escala de batalla#! opciones. Batallas arriba 20k/40k tartamudeará.\n#high Los números de unidades de batalla de Atila no coinciden #clickable Tamaño de la unidad #!opciones!#! - Revise que la opción de gráficos de Attila para TAMAÑO DE UNIDAD esté configurada en ULTRA. Un valor inferior a ULTRA dará como resultado unidades más pequeñas.\n#high ¡Atila se bloquea al intentar cargar!#! - O no habilitaste las modificaciones correctas para el mapeador de unidades cargado, o el mapeador de unidades cargado tiene una clave de unidad incorrecta que está presente en la batalla.\n#high ¡Hacer clic en el botón Jugar batalla no hace nada!#! - Comprueba que Crusader Conflicts Launcher esté en funcionamiento haciendo clic en el icono de la bandera central.\n#high ¿Por qué no puedo controlar algunas batallas?#! - Tienes que ir a #clickable Preferencias#! y elige los personajes deseados que puedan luchar. Esta es la única opción que debes configurar después de cada batalla y cuando ck3 comienza.\n#high ¡Resultados de batalla inexactos!#! - Después de ganar una batalla, no tiene sentido agotar tropas, sus bajas no contarán.\n#high ¡No puedo encontrar CrusaderConflicts.pack!#! - CrusaderConflicts.pack se rehace en cada batalla, no necesitas suscribirte a nada, debe estar al final de tu lista de mods.\n#high ¡Después de la batalla la carga es demasiado lenta!#! - Para ello recomendamos eliminar el guardado de CrusaderWars_Battle de vez en cuando.\n#high ¡Las unidades de Atila no son de mi cultura!#! - La cultura de las unidades se basa en la cultura del comandante, por lo que si tienes un comandante que no es de tu cultura, las unidades serán de su cultura.\n\n#high discordia - https://discord.gg/eFZTprHh3j"
	cc_op_thank_head: "Expresiones de gratitud"
	cc_op_thank_hsub: "De los desarrolladores de Crusader Conflicts."
	cc_op_thank_desc: "Felicitamos a todos los ck.3 y total war modder, por darnos la oportunidad de usar sus mods con los nuestros y tener unidades históricamente precisas. ¡Estamos mejorando la industria del modding! También queremos agradecer a la comunidad y a nuestros seguidores de patreon, gracias por creer en nuestro proyecto, ¡os queremos mucho!."
	#
	### Troops by Culture conversions for both default attila and with 1212 AD HEADERS ### 
	cc_op_page2_desc: "#clickable Tropas por cultura (predeterminado)"
	cc_op_page3_desc: "#clickable Tropas por cultura con 1212 Anuncio (opcional)"
	#
	### Battle Scale tab texts ###
	cc_op_tab2_desc: "Ajustes para el general [battle|E] tamaño, utilizado para gestionar el rendimiento frente al alcance de las batallas manuales.\n\n#high Sólo afecta a las batallas manuales controladas en Total War: Attila. Sin impacto para los Reyes Cruzados normales. 3 batallas.#!"
	cc_op_scale_head: "Escala de tamaño general de la batalla"
	cc_op_scale_desc: "Escalado general de Crusader Kings 3 [army|E] totales de batallas de Total War: Attila. Se utiliza para ayudar a aumentar el rendimiento en máquinas de gama baja para las batallas manuales.\n\nCuando se establece en 50% esta opción convertirá a Crusader Kings 3 batalla con un total de 40,000 [soldiers|E] en una Guerra Total: Atila batalla de 20,000. Todos los tipos de unidades se escalarán por igual.\n\n#high El valor predeterminado es 100% #!\n#i Disminuir para mejorar el rendimiento en batalla.#!"
	cc_op_automax_head: "Escala automática más allá del límite máximo de batalla"
	cc_op_automax_desc: "Cuando está habilitado, un [battle|E] que excede el #high Límite máximo de batalla#! de [soldiers|E] se reducirá automáticamente hasta el límite establecido en #high Límite máximo de batalla#!. Se utiliza para ayudar a gestionar batallas masivas y grandes al final del juego que colapsarían Total War: Attila.\n\n#high El valor predeterminado está habilitado #!\n#X Deshabilitar esta opción puede causar fallas"
	cc_op_max_head: "Límite máximo de batalla"
	cc_op_max_desc: "Cuando la escala automática está habilitada: [battle|E] que excedan esta cantidad de [soldiers|E] se reducirá hasta este límite. Se utiliza para ayudar a gestionar grandes batallas finales.\n\nCuando se establece en 20,000 esta opción convertirá a Crusader Kings 3 batalla con 40,000 [soldiers|E] hasta una batalla de Total War: Atila de 20,000 soldados. Todos los tipos de unidades se escalarán por igual.\n\N#high Total War: Attila debe configurarse en tamaño de unidad ULTRA para que las batallas utilicen este valor exacto.#! Si el tamaño de la unidad se establece por debajo de ULTRA, tu número de hombres por unidad puede reducirse en la batalla.\n\n#high El valor predeterminado es 40,000#!\n#i Disminuir para mejorar el rendimiento en batalla.#!"
	#
	### Unit Size tab texts ###
	cc_op_tab3_desc: "En Crusader Conflicts, todas las batallas [soldiers|E] Los ejércitos participantes están representados por unidades individuales que pueden ser controladas. La siguiente [regiments|E] Los tipos pueden ajustar el tamaño de su unidad.\n\n#high Las opciones no predeterminadas afectarán el equilibrio de la batalla, lo que puede hacer que las batallas sean más fáciles o más difíciles."
	cc_op_unit1_head: "Tamaño de la unidad de impuestos"
	cc_op_unit1_desc: "[levies|E] están representados en batalla por una mezcla de unidades. En las batallas de los Conflictos Cruzados, la mayoría de las culturas desplegarán sus levas como 65% unidades de lanza ligera, 10% de unidades de alcance ligero, y 25% unidades de infantería media. Ciertas culturas tienen diferencias.\n\N#high Total War: Attila debe configurarse en tamaño de unidad ULTRA para que las batallas utilicen este valor exacto.#! Si el tamaño de la unidad se establece por debajo de ULTRA, tu número de hombres por unidad puede reducirse en la batalla.\n\n#high El valor predeterminado es 200 #!"
	cc_op_unit2_head: "Tamaño de la unidad de hombres de armas cuerpo a cuerpo"
	cc_op_unit2_desc: "Pelea confusa [men_at_arms|E] Los regimientos son soldados con armaduras, armas y entrenamiento mejorados en comparación con los reclutas. Estas tropas están representadas por unidades que luchan utilizando armas cuerpo a cuerpo como espadas, hachas, lanzas o picas.\n\n[regiment|E] tipos de [spearmen|E], [skirmishers|E], y [heavy_infantry|E] Usa este tamaño de unidad en la batalla.\n\N#high Total War: Attila debe configurarse en tamaño de unidad ULTRA para que las batallas utilicen este valor exacto.#! Si el tamaño de la unidad se establece por debajo de ULTRA, tu número de hombres por unidad puede reducirse en la batalla.\n\n#high El valor predeterminado es 200 #!"
	cc_op_unit3_head: "Tamaño de la unidad de hombres de armas a distancia"
	cc_op_unit3_desc: "a distancia [men_at_arms|E] Los regimientos son soldados con armaduras, armas y entrenamiento mejorados en comparación con los reclutas. Estas tropas están representadas por unidades que luchan utilizando armas a distancia como arcos, ballestas, hondas o jabalinas.\n\n[regiment|E] tipos de [archers|E] Usa este tamaño de unidad en la batalla.\n\N#high Total War: Attila debe configurarse en tamaño de unidad ULTRA para que las batallas utilicen este valor exacto.#! Si el tamaño de la unidad se establece por debajo de ULTRA, tu número de hombres por unidad puede reducirse en la batalla.\n\n#high El valor predeterminado es 200 #!"
	cc_op_unit4_head: "Tamaño de la unidad de hombres de armas de caballería"
	cc_op_unit4_desc: "Caballería [men_at_arms|E] Los regimientos son soldados con monturas como caballos o camellos, armaduras, armas y entrenamiento mejorados en comparación con las levas. Estas tropas están representadas por unidades que luchan desde monturas usando armas a distancia y cuerpo a cuerpo.\n\n[regiment|E] tipos de [light_cavalry|E] y [heavy_cavalry|E] Usa este tamaño de unidad en la batalla.\n\n#high El valor predeterminado es 100 #!"
	cc_op_unit5_head: "loc_Siege Tamaño de unidad de hombres de armas"
	cc_op_unit5_desc: "loc_Descripción sobre cómo se dividen las armas de asedio. Puede que nunca necesites esto\n\n#high El valor predeterminado es 100 #!"
	#
	### Prefs & Battle Rules tab texts ###
	cc_op_tab4_desc: "Opciones específicas para permitir que diferentes tipos de comandantes del ejército asuman el control directo en Atila\n\n#high Los valores predeterminados son muy recomendables para los usuarios primerizos del mod. #!"
	cc_op_control1_head: "Control de batalla directo"
	cc_op_control1_desc: "El [commander|E] determina qué batallas pueden controlarse directamente en Atila.\n\nSolo el personaje del jugador ofrece un equilibrio entre riesgo y recompensa y encaja con el CK básico.3 experiencia de juego de roles.\nPlayer & Marshal también permitirá que tu [marshal|E] asumir el control directo de la batalla.\nAll Dynasty permitirá que cualquier miembro de tu [dynasty|E] asumir el control directo de la batalla.\nTodos los personajes permitirá que cualquier personaje que nombre como [commander|E] asumir el control directo de la batalla.\n\n#high El valor predeterminado es solo personaje del jugador. #!\n\n#X Las opciones no predeterminadas reducirán en gran medida la dificultad de tus Crusader Kings. 3 campaña"
	cc_op_unitnames_head: "Nombres de unidades de batalla directa"
	cc_op_unitnames_desc: "¿Quieres que los nombres de las unidades sean locos o estandarizados como el CK?3 ¿Generalizar los nombres de Hombres de armas?\n\n#high El valor predeterminado es Nombres de unidades sabrosos #!\n\n#X Utilice nombres de unidades sabrosos si está utilizando un CK3 revisión como AGOT, o un mod que ajusta los nombres de Men At Arms en Crusader Kings 3"
	
	#
