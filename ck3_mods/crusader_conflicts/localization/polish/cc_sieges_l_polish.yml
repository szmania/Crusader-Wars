cc_siege_assault_insufficient_troops_tooltip: "Nie masz wystarczającej liczby żołnierzy, aby szturmować tę twierdzę. Twoja armia musi przewyższać liczebnością garnizon."
cc_siege_fight_button: "#S Szturmuj tę twierdzę sam!#!\nZbudowane machiny oblężnicze — Taran: $cc_ram_count$ (następna: $cc_engine_build_pct$% zbudowana), Wieże: $cc_tower_count$ (następna: $cc_engine_build_pct$% zbudowana), Drabiny: $cc_ladder_count$ (następna: $cc_engine_build_pct$% zbudowana)\nPostęp oblężenia: $cc_engines_total_pct$% — $cc_next_engine_info$"
cc_siege_engines_built_tooltip: "Zbudowane machiny oblężnicze: tarany, wieże i drabiny są budowane w miarę postępu oblężenia (1 przy 25% postępu, 2 przy 50%, 3 przy 75%)."
cc_siege_fight_button_disabled: "#S Szturmuj tę twierdzę sam!#!\n#N Mury muszą być wyważone, musisz posiadać machiny oblężnicze lub oblężenie musi wystarczająco się posunąć, aby zbudować machiny oblężnicze i szturmować twierdzę samemu. Postęp oblężenia: $cc_engines_total_pct$% — pierwsza machina oblężnicza zbudowana w $cc_engine_build_pct$% (ukończona przy 25% postępu oblężenia).#!"
cc_engines_total_pct: "[Siege.GetProgress|0]"
cc_ram_count: "[Select_CString( GreaterThan_float( Siege.GetProgress, '(float)75' ), '3', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)50' ), '2', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)25' ), '1', '0' ) ) )]"
cc_tower_count: "[Select_CString( GreaterThan_float( Siege.GetProgress, '(float)75' ), '3', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)50' ), '2', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)25' ), '1', '0' ) ) )]"
cc_ladder_count: "[Select_CString( GreaterThan_float( Siege.GetProgress, '(float)75' ), '3', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)50' ), '2', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)25' ), '1', '0' ) ) )]"
cc_next_engine_info: "[Select_CString( GreaterThan_float( Siege.GetProgress, '(float)75' ), 'wszystkie machiny oblężnicze są zbudowane', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)50' ), 'następna machina przy 75% postępu oblężenia', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)25' ), 'następna machina przy 50% postępu oblężenia', 'pierwsza machina przy 25% postępu oblężenia' ) ) )]"
cc_engine_build_pct: "[Select_float( GreaterThan_float( Siege.GetProgress, '(float)75' ), '(float)100', Select_float( GreaterThan_float( Siege.GetProgress, '(float)50' ), Multiply_float( Subtract_float( Siege.GetProgress, '(float)50' ), '(float)4' ), Select_float( GreaterThan_float( Siege.GetProgress, '(float)25' ), Multiply_float( Subtract_float( Siege.GetProgress, '(float)25' ), '(float)4' ), Multiply_float( Siege.GetProgress, '(float)4' ) ) ) )|0]"
