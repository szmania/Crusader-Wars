	ccalert.1.title: "Powiadomienie o konfliktach krzyżowców|„Jakość życia” przed wersją beta|marzec 2024"
	ccalert.1.desc: "#high Mod zaktualizowany do wersji v0.9.11 „Jakość życia!”, zaktualizuj teraz program uruchamiający konflikty krzyżowców, jeśli jeszcze tego nie zrobiłeś, aby uniknąć błędów.\n\nProgram uruchamiający Crusader Conflikty jest #high oddzielny #! z Warsztatu Steam CK3 mod. Steam automatycznie zaktualizuje CK3 mod, ale Steam tak #high NIE #! automatycznie zaktualizuj program uruchamiający CrusaderConfused.exe. Musisz otworzyć CK3 przynajmniej raz, a następnie przejdź do programu uruchamiającego CC i zaktualizuj. Jeśli go nie otworzysz, program uruchamiający nie wykryje żadnej aktualizacji!.\n\n#X Jeśli nie pobierzesz zaktualizowanego programu uruchamiającego, Twoje bitwy Attila ulegną awarii. Zostałeś ostrzeżony."
 	ccalert.1.a: "Zaktualizuję teraz program uruchamiający konflikty krzyżowców!"
	cc_bw_fight_button: "Stocz bitwę sam!"
	cc_bw_fight_button_disabled: "Postać ta nie może kontrolować bitew.\nZobacz Opcje modów: Preferencje"
	cc_bw_options_button: "Opcje modyfikacji Crusader Conflikty"
	cc_bw_wait_button: "Poczekaj jeszcze kilka dni i stocz bitwę..."
	cc_op_window_title: "#high Opcje modyfikacji Crusader Conflikty"
	cc_op_tab1_title: "#clickable O modzie"
	cc_op_tab2_title: "#clickable Skala bitwy"
	cc_op_tab3_title: "#clickable Rozmiar jednostki"
	cc_op_tab4_title: "#clickable Preferencje"
	cc_op_tab5_title: "#clickable CK3 do jednostek Attyli"
	cc_op_tab1_desc: "Opcje modów Crusader Conflikty są obecnie dostępne tylko w #high angielski#! lokalizacja."
	cc_op_page1_desc: "#clickable Szczegóły moda"
	cc_op_about_head: "O modzie"
	cc_op_about_hsub: "Jak to działa:\n\n\n\n#i Wymagany:#!\n\n\n\n#i #high Maperzy jednostek:#! #!\n\n\n#X Nieobsługiwane:#!"
	cc_op_about_desc: "#high Konflikty krzyżowców#! czyta szczegółowo o bitwie z tobą #high Królowie Krzyżowcy 3#! postać jest w to zaangażowana i przekształca to w a #high Total War: Bitwa Attyli#! którymi możesz bezpośrednio sterować. W Total War: Attila żołnierze, zbrojni i rycerze są konwertowani na równoważne jednostki. Aby uzyskać szczegółowe informacje na temat sposobu przeliczania jednostek, zobacz #clickable Oddział według kultury#! zakładki.\n\n#i Samodzielna aplikacja mod Crusader Confused\nWersje Steam gry Crusader Kings 3, Total War: Attila, Attila DLC - Age of Charlemagne#!\n\n#i #high W ten sposób mod wie, jakich jednostek użyć na Attili. Każdy z nich ma wymagane mody/DLC, które należy włączyć po załadowaniu modułu mapowania jednostek. Ich struktura polega zasadniczo na przypisywaniu nazw kultur i dziedzictwa do grupy jednostek modów/dlc.#!\n\n#X 1212 Moduł AD Scripts - nie subskrybuj tej konkretnej części 1212 mod reklamowy\nPakiet Armii Kulturalnych - CK3 mod#!"
	cc_op_help_head: "Pomoc i społeczność"
	cc_op_help_hsub: "Często zadawane pytania dotyczące pomocy:\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nMasz pytania? Potrzebujesz pomocy?"
	cc_op_help_desc: "#high Bitwy Attyli przebiegają słabo/z opóźnieniami!#! - Obniż opcje graficzne w Attila, obniż #clickable Skala bitwy#! opcje. Bitwy powyżej 20k/40k będzie się jąkać.\n#high Numery jednostek bitewnych Attyli nie zgadzają się #clickable Rozmiar jednostki #!opcje!#! - Sprawdź opcję grafiki Attila dla ROZMIARU JEDNOSTKI ustawionego na ULTRA. Niższa niż ULTRA spowoduje mniejsze jednostki.\n#high Attila ulega awarii podczas próby załadowania!#! - Albo nie włączyłeś odpowiednich modów dla załadowanego mapera jednostek, albo załadowany maper jednostek ma nieprawidłowy klucz jednostki, który jest obecny w bitwie.\n#high Kliknięcie przycisku Rozpocznij bitwę nic nie daje!#! - Sprawdź, czy program uruchamiający Crusader Conflikty działa, klikając środkową ikonę flagi.\n#high Dlaczego nie mogę kontrolować niektórych bitew!#! - Musisz iść #clickable Preferencje#! i wybierz żądane postacie, które mogą walczyć. Jest to jedyna opcja, którą musisz ustawić po każdej bitwie i po zatwierdzeniu3 zaczyna.\n#high Niedokładne wyniki bitwy!#! - Po wygranej bitwie nie ma sensu zabijać żołnierzy, ich straty nie będą się liczyć.\n#high Nie mogę znaleźć pliku CrusaderConfuseds.pack!#! - Pakiet CrusaderConfuseds.pack jest przerabiany w każdej bitwie, nie musisz się do niczego subskrybować, powinien znajdować się na dole twojej listy modów.\n#high Po bitwie ładowanie jest zbyt wolne!#! - W tym celu zalecamy od czasu do czasu usunąć zapis CrusaderWars_Battle.\n#high Jednostki Attyli nie pochodzą z mojej kultury!#! - Kultura jednostek opiera się na kulturze dowódcy, więc jeśli masz dowódcę spoza twojej kultury, jednostki będą należeć do jego kultury.\n\n#high Niezgoda - https://discord.gg/eFZTprHh3j"
	cc_op_thank_head: "Podziękowanie"
	cc_op_thank_hsub: "Od twórców Crusader Confused.."
	cc_op_thank_desc: "Gratulujemy każdemu ck3 i modderowi Total War, za umożliwienie nam używania ich modów z naszymi i posiadanie jednostek absolutnie zgodnych z historią! Zmieniamy branżę moddingową na lepsze! Chcemy także podziękować społeczności i naszym zwolennikom na Patreonie, dziękujemy za wiarę w nasz projekt, bardzo Was kochamy!."
	cc_op_page2_desc: "#clickable Żołnierze według kultury (domyślnie)"
	cc_op_page3_desc: "#clickable Żołnierze według kultury z 1212 Reklama (opcjonalnie)"
	cc_op_tab2_desc: "Korekty w sumie [battle|E] rozmiar, używany do zarządzania wydajnością i zakresem bitew ręcznych.\n\n#high Wpływa tylko na bitwy ręczne kontrolowane w Total War: Attila. Brak wpływu na normalne Crusader Kings 3 bitwy.#!"
	cc_op_scale_head: "Ogólna skala wielkości bitwy"
	cc_op_scale_desc: "Ogólne skalowanie Crusader Kings 3 [army|E] łącznie w bitwach Total War: Attila. Służy do zwiększania wydajności na słabszych maszynach w bitwach ręcznych.\n\nKiedy ustawione na 50% ta opcja konwertuje Crusader Kings 3 walcz w sumie 40,000 [soldiers|E] w bitwę Total War: Attila 20,000. Wszystkie typy jednostek będą skalowane jednakowo.\n\n#high Wartość domyślna to 100% #!\n#i Zmniejsz, aby poprawić wydajność w bitwie#!"
	cc_op_automax_head: "Automatyczne skalowanie poza maksymalny limit bitwy"
	cc_op_automax_desc: "Po włączeniu, a [battle|E] która przekracza #high Maksymalny limit bitwy#! z [soldiers|E] zostanie automatycznie zmniejszona do ustawionego limitu #high Maksymalny limit bitwy#!. Używane do zarządzania ogromnymi, dużymi bitwami końcowymi, które mogłyby spowodować awarię Total War: Attila.\n\n#high Wartość domyślna to Włączone #!\n#X Wyłączenie tej opcji może spowodować awarie"
	cc_op_max_head: "Maksymalny limit bitwy"
	cc_op_max_desc: "Gdy włączone jest automatyczne skalowanie - a [battle|E] które przekraczają tę kwotę [soldiers|E] zostanie zmniejszona do tego limitu. Używane do zarządzania dużymi bitwami końcowymi.\n\nKiedy ustawione na 20,000 ta opcja spowoduje konwersję Crusader Kings 3 walcz z 40,000 [soldiers|E] aż do bitwy Total War: Attila 20,000 żołnierski. Wszystkie typy jednostek będą skalowane jednakowo.\n\N#high Total War: Attila musi być ustawiony na ULTRA, aby bitwy używały dokładnie tej wartości.#! Jeśli wielkość jednostki jest ustawiona poniżej ULTRA, liczba ludzi w jednostce może zostać zmniejszona w bitwie.\n\n#high Wartość domyślna to 40,000#!\n#i Zmniejsz, aby poprawić wydajność w bitwie#!"
	cc_op_tab3_desc: "W Crusader Conflikty walczy się ze wszystkimi [soldiers|E] uczestniczące armie są reprezentowane przez indywidualne jednostki, którymi można sterować. Następujące [regiments|E] typy mogą mieć dostosowany rozmiar jednostki.\n\n#high Opcje inne niż domyślne wpłyną na równowagę bitwy, co może sprawić, że bitwy będą łatwiejsze lub trudniejsze."
	cc_op_unit1_head: "Rozmiar jednostki opłat"
	cc_op_unit1_desc: "[levies|E] są reprezentowani w bitwie przez mieszankę jednostek. W bitwach Crusader Conflikty większość kultur wystawi swoje wojska jako 65% jednostek lekkich włóczni, 10% lekkich jednostek dystansowych i 25% średnich jednostek piechoty. W niektórych kulturach istnieją różnice.\n\N#high Total War: Attila musi być ustawiony na ULTRA, aby bitwy używały dokładnie tej wartości.#! Jeśli wielkość jednostki jest ustawiona poniżej ULTRA, liczba ludzi w jednostce może zostać zmniejszona w bitwie.\n\n#high Wartość domyślna to 200 #!"
	cc_op_unit2_head: "Rozmiar jednostki walczącej w zwarciu"
	cc_op_unit2_desc: "Bijatyka [men_at_arms|E] pułki to żołnierze z ulepszonym pancerzem, bronią i wyszkoleniem w porównaniu z opłatami. Oddziały te reprezentowane są przez jednostki walczące przy użyciu broni białej, takiej jak miecze, topory, włócznie czy piki.\n\n[regiment|E] typy [spearmen|E], [skirmishers|E], I [heavy_infantry|E] użyj tej wielkości jednostki w bitwie.\n\N#high Total War: Attila musi być ustawiony na ULTRA, aby bitwy używały dokładnie tej wartości.#! Jeśli wielkość jednostki jest ustawiona poniżej ULTRA, liczba ludzi w jednostce może zostać zmniejszona w bitwie.\n\n#high Wartość domyślna to 200 #!"
	cc_op_unit3_head: "Rozmiar jednostki zbrojnej na dystans"
	cc_op_unit3_desc: "dystansowe [men_at_arms|E] pułki to żołnierze z ulepszonym pancerzem, bronią i wyszkoleniem w porównaniu z opłatami. Oddziały te są reprezentowane przez jednostki walczące przy użyciu broni dystansowej, takiej jak łuki, kusze, proce czy oszczepy.\n\n[regiment|E] typy [archers|E] użyj tej wielkości jednostki w bitwie.\n\N#high Total War: Attila musi być ustawiony na ULTRA, aby bitwy używały dokładnie tej wartości.#! Jeśli wielkość jednostki jest ustawiona poniżej ULTRA, liczba ludzi w jednostce może zostać zmniejszona w bitwie.\n\n#high Wartość domyślna to 200 #!"
	cc_op_unit4_head: "Wielkość jednostki kawalerii zbrojnej"
	cc_op_unit4_desc: "Kawaleria [men_at_arms|E] pułki to żołnierze z wierzchowcami, takimi jak konie lub wielbłądy, o ulepszonej zbroi, broni i wyszkoleniu w porównaniu do opłat. Oddziały te są reprezentowane przez jednostki walczące na wierzchowcach, używając zarówno broni dystansowej, jak i białej.\n\n[regiment|E] typy [light_cavalry|E] I [heavy_cavalry|E] użyj tej wielkości jednostki w bitwie.\n\n#high Wartość domyślna to 100 #!"
	cc_op_unit5_head: "Rozmiar jednostki zbrojnej loc_Siege"
	cc_op_unit5_desc: "loc_Description na temat podziału machin oblężniczych. może nigdy tego nie potrzebować\n\n#high Wartość domyślna to 100 #!"
	cc_op_tab4_desc: "Specyficzne opcje umożliwiające różnym typom dowódców armii przejęcie bezpośredniej kontroli w Atilli\n\n#high Wartości domyślne są wysoce zalecane dla użytkowników modów po raz pierwszy. #!"
	cc_op_control1_head: "Bezpośrednia kontrola bitwy"
cc_op_control1_desc: "[commander|E] określa, które bitwy mogą być bezpośrednio kontrolowane w Attyli.\n\nTylko postać gracza oferuje równowagę ryzyka i nagrody i pasuje do podstawowego doświadczenia w odgrywaniu ról CK3.\nGracz i Marszałek pozwolą również Twojemu [marshal|E] przejąć bezpośrednią kontrolę nad bitwą.\nCała dynastia pozwoli każdemu członkowi twojej [dynasty|E] przejąć bezpośrednią kontrolę nad bitwą.\nWszystkie postacie pozwolą na dowolną postać, którą nazwiesz [commander|E], przejąć bezpośrednią kontrolę nad bitwą.\n\n#high Wartość domyślna to Tylko postać gracza #!\n\n#X Opcje inne niż domyślne znacznie zmniejszą trudność kampanii Crusader Kings 3"
	cc_op_unitnames_head: "Nazwy jednostek bezpośrednich"
	cc_op_unitnames_desc: "Czy chcesz, aby nazwy jednostek były szalone czy ustandaryzowane jak CK3 uogólnić nazwiska Men at Arms?\n\n#high Wartość domyślna to Aromatyczne nazwy jednostek #!\n\n#X Użyj Aromatycznych Nazw Jednostek, jeśli używasz CK3 zmiany takie jak AGOT lub mod dostosowujący nazwy Men At Arms w Crusader Kings 3"
	cc_op_def1: "#Details tutaj dla jednostek domyślnych"
	cc_op_def2: "Szczegóły tutaj dla 1212 Jednostki AD"
