	cc_op_about_hsub_um: "Jak to działa:\n\n\n\n#i Wymagany:#!\n\n\n\n#i #high Fakultatywny:#! #!\n\n#X Nieobsługiwane:#!"
	cc_op_about_desc_um: "#high Konflikty krzyżowców#! czyta szczegółowo o bitwie z tobą #high Królowie Krzyżowcy 3#! postać jest w to zaangażowana i przekształca to w a #high Total War: Bitwa Attyli#! którymi możesz bezpośrednio sterować. W Total War: Attila żołnierze, zbrojni i rycerze są konwertowani na równoważne jednostki. Aby uzyskać szczegółowe informacje na temat sposobu przeliczania jednostek, zobacz #clickable Oddział według kultury#! zakładki.\n\n#i Wersje Steam gry Crusader Kings 3, Total War: Attila, Attila DLC - Age of Charlemagne\nSubskrybujesz mod Crusader Conflikty dla OBU Crusader Kings 3 ORAZ Total War: Attila\nSamodzielna aplikacja mod Crusader Confused #!\n\n#i #high Modyfikacja Total War: Attila - 1212 AD (pakiety modeli 1-8)#! #!- dla dodatkowych jednostek kulturalnych#!\n\n#X 1212 Moduł AD Scripts - nie subskrybuj tej konkretnej części 1212 mod reklamowy#!"
	cc_op_help_hsub_um: "Często zadawane pytania dotyczące pomocy:\n\n\n\n\n\n\nMasz pytania? Potrzebujesz pomocy?"
	cc_op_help_desc_um: "#high Bitwy Attyli przebiegają słabo/z opóźnieniami!#! - Obniż opcje graficzne w Attila, obniż #clickable Skala bitwy#! opcje. Upewnij się także, że Crusader Kings 3 jest całkowicie zawieszony w tle.\n#high Numery jednostek bitewnych Attyli nie zgadzają się #clickable Rozmiar jednostki #!opcje!#! - Sprawdź opcję grafiki Attila dla ROZMIARU JEDNOSTKI ustawionego na ULTRA. Niższa niż ULTRA spowoduje mniejsze jednostki.\n#high Attila ulega awarii podczas próby załadowania!#! - Sprawdź, czy NIE używasz 1212 Mod skryptów AD.\n#high Kliknięcie przycisku Rozpocznij bitwę nic nie daje!#! - Sprawdź, czy uruchamiasz CK3 poprzez kliknięcie pliku CrusaderConfuseds.exe na środkową ikonę flagi, nie uruchamiaj ręcznie CK3 ze Steama.\n#high Dlaczego nie mogę kontrolować niektórych bitew!#! - Bitwy ręczne są dostępne tylko wtedy, gdy postać gracza osobiście dowodzi armią.\n\n#high Niezgoda - #! https://discord.gg/eFZTprHh3j"
	cc_op_thank_hsub_um: "1212 Zespół modów AD"
	cc_op_thank_desc_um: "Za stworzenie niesamowicie rozbudowanego średniowiecznego moda dla Attili, abyśmy mogli używać bardziej odpowiednich jednostek!"
