# ===========================================================================
# Crusader Conflicts sync: missing keys copied verbatim from localization\english
# (English fallback values; translators may replace the values in place later).
# ===========================================================================
 game_concept_prowess_skill_desc:3 "$game_concept_prowess$ jest sprawą drugorzędną [skill|E] odzwierciedla to zdolność Postaci do walki osobistej.\n\nWysoka Umiejętność Biegłości oznacza, że ​​mają większe szanse na przetrwanie i dobre wyniki w obu przypadkach [knights|E] W [battles|E] i w [single_combat_duel_plural|E].\n\nKażdy punkt Biegłości daje Rycerzowi:\n$BULLET_WITH_TAB$[damage|E]: #V [GetDefine('NCombat', 'KNIGHT_DAMAGE_PER_PROWESS')]#!\n$BULLET_WITH_TAB$[toughness|E]: #V [GetDefine('NCombat', 'KNIGHT_TOUGHNESS_PER_PROWESS')]#!\n\n$PROWESS_MUSCLE_INFO$ $cc_prowess_all_desc$"
 game_concept_knight_desc:4 "A $game_concept_knight$ jest [vassal|E] Lub [courtier|E] która walczy bezpośrednio w twoim [army|E].\n\nPodczas [battles|E], $game_concept_knights$ użyj ich [prowess_skill|E] walczyć skuteczniej. Wysoki $game_concept_prowess$ oznacza, że ​​będą w stanie zadać wrogowi więcej obrażeń i mają większe szanse na przetrwanie lub nawet wydostanie się z niego $game_concept_battle$ bez szwanku.\n$cc_prowess_knight_desc$ \n\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_knight_desc_TOTO_DLC', 'game_concept_knight_desc_NO_TOTO_DLC' )][SelectLocalization( HasDlcFeature( 'accolades' ), 'game_concept_knight_desc_ACCOLADE_DLC', '' )]#weak Rycerze mogą być znani pod różnymi imionami, w zależności od [culture] Lub [faith]. Na przykład, $knight_champion_no_tooltip_plural$, $knight_faris_no_tooltip_plural$ Lub $knight_baghatur_no_tooltip_plural$.\n\nRycerze reprezentują zarówno charakter, jak i swój orszak żołnierzy.#!"
 game_concept_martial_skill_desc:2 "$game_concept_martial$ [skill|E] wskazuje, jak dobra jest postać w prowadzeniu [war|E] i wiodący [armies|E] W [battle|E].\n\nWysokie umiejętności walki są ważne [army_commanders|E], ponieważ poprawia ich [advantage|E] W [battle|E].\n\nOdpowiednie [lifestyle|E] jest [martial_lifestyle|E]. $cc_martial_all_desc$"
 martial_effect_desc:0 "Zwiększa się [advantage|E] podczas dowodzenia armią w walce $cc_martial_commander_desc$"
 game_concept_unlanded_desc:0 "$game_concept_unlanded$ Postacie nie mają [holdings|E] w ich [domain|E], ale teoretycznie nadal może tak być [rulers|E] swego rodzaju. Może tak być na przykład [heads_of_faith|E] i Wielkich Mistrzów [holy_orders|E]. $cc_mechanic_unlanded_desc_1$"
 game_concept_barony_desc:0 "$game_concept_baronies$ są najniżej sklasyfikowani [titles|E] i mają najmniejszy ślad na mapie, zorganizowany w większe [counties|E].\n\nTytuły barońskie muszą zawsze mieć [holder|E] jeśli zawierają A [holding|E]. $cc_mechanic_unlanded_desc_2$"
 game_concept_county_desc:0 "A $game_concept_county$ jest [title|E] ranking poniżej a [duchy|E] i powyżej A [barony|E].\n\nTytuł zawiera [county_capital|E] w powiecie, a także [de_jure|E] prawa wszystkich baronów w hrabstwie.\n\nPowiaty zawsze tak mają [holders|E] ponieważ stolic powiatów nie można zniszczyć. $cc_mechanic_unlanded_desc_3$"
 game_concept_duchy_desc:0 "A $game_concept_duchy$ jest [title|E] ranking poniżej a [kingdom|E] i powyżej A [county|E].\n\nThe [holder|E] Księstwa ma [de_jure|E] prawa do swoich hrabstw składowych i może mieć hrabiów jako [vassals|E].\n\nKsięstwa mogą być uśpione i nie mieć aktualnego Posiadacza. Takie tytuły mogą być tworzone przez a [ruler|E] który kontroluje co najmniej połowę jego hrabstw. $cc_mechanic_unlanded_desc_4$"
 game_concept_kingdom_desc:0 "A $game_concept_kingdom$ jest [title|E] ranking poniżej A [empire|E] i powyżej A [duchy|E].\n\nThe [holder|E] Królestwa ma [de_jure|E] prawa do swojego terytorium składowego i może mieć książąt jako [vassals|E].\n\nKrólestwa mogą być uśpione i nie mieć aktualnego Posiadacza. Takie tytuły mogą być tworzone przez a [ruler|E] który kontroluje co najmniej połowę hrabstw w swoim obrębie.$cc_mechanic_unlanded_desc_5$"
 game_concept_empire_desc:1 "$game_concept_empires$ są najwyżej sklasyfikowani [titles|E].\n\nThe [holder|E] Imperium ma [de_jure|E] prawa do swojego terytorium składowego i może mieć królów jako [vassals|E].\n\nImperia mogą być w stanie uśpienia i nie mają aktualnego Posiadacza. Takie tytuły mogą być tworzone przez a [ruler|E] kto kontroluje więcej niż 80% hrabstw w obrębie. $cc_mechanic_unlanded_desc_6$"
 game_concept_title_tier_desc:2 "Równowartość gruntu tytułu [rank|E], $game_concept_title_tier$ określa położenie a [title|E] w hierarchii gry.\n\nWszystkie tytuły mają poziom, który określa najwyższy możliwy poziom [vassals|E] że [holder|E] może mieć.\n\n[empire|E] > [kingdom|E] > [duchy|E] > [county|E] > [barony|E]. $cc_unlanded_all_desc$"
 bodyguard_employer_custom_effect_description:2 "Ma szansę zapobiec Zabójstwu [GetScheme('murder').GetTypeName] [schemes|E]#!\nZmniejsza ryzyko śmierci lub bycia schwytanym [battles|E] oboje walczycie#! $cc_court_position_bodyguard_desc$"
 champion_employer_custom_effect_description:2 "Może zająć twoje miejsce w niektórych [single_combat_duel_plural|E]\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'champion_employer_custom_effect_description_TOTO_DLC', 'champion_employer_custom_effect_description_NO_TOTO_DLC' )] $cc_court_position_champion_desc$"
 trait_wounded_1_desc:0 "Postać ta została ranna, ale prawdopodobnie zagoi się z czasem. $cc_trait_h_wounded$"
 trait_wounded_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] został ranny, ale prawdopodobnie z czasem się zagoi. $cc_trait_h_wounded$"
 trait_one_eyed_desc:0 "Ta postać ma tylko jedno oko. $cc_trait_h_one_eyed$"
 trait_one_eyed_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ma tylko jedno oko. $cc_trait_h_one_eyed$"
 trait_disfigured_desc:0 "Ta postać jest okropnie zniekształcona. $cc_trait_h_disfigured$"
 trait_disfigured_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] jest okropnie zniekształcony. $cc_trait_h_disfigured$"
 trait_one_legged_desc:0 "Ta postać ma tylko jedną nogę. $cc_trait_h_one_legged$"
 trait_one_legged_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ma tylko jedną nogę. $cc_trait_h_one_legged$"
 trait_wounded_2_desc:0 "Postać ta została poważnie ranna, a droga do powrotu do zdrowia może być długa. $cc_trait_h_wounded_2$"
 trait_wounded_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] doznał poważnych obrażeń, a droga do powrotu do zdrowia może być długa. $cc_trait_h_wounded_2$"
 trait_wounded_3_desc:0 "Ta postać została złamana i kurczowo trzyma się życia. $cc_trait_h_wounded_3$"
 trait_wounded_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] został złamany i kurczowo trzyma się życia. $cc_trait_h_wounded_3$"
 trait_maimed_desc:1 "Postać ta została poważnie okaleczona. $cc_trait_h_maimed$"
 trait_maimed_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] został poważnie okaleczony. $cc_trait_h_maimed$"
 leading_own_troops_modifier:0 "[cc_advantage_leading|E]"
 defender_river:0 "[cc_advantage_river|E] Obrona przeprawy przez rzekę"
 defender_river_large:0 "[cc_advantage_big_river|E] Obrona głównej przeprawy przez rzekę"
 defender_strait:0 "[cc_advantage_strait|E] Obrona przejścia przez cieśninę"
 supply_state_supplied_advantage:2 "Armia jest zaopatrzona"
 supply_state_running_low_advantage:2 "[cc_advantage_lowsupplies|E]"
 supply_state_starving_advantage:2 "[cc_advantage_nosupplies|E]"
 recently_disembarked_advantage:1 "Przeciwnik jest [recently_disembarked|E]"
 gathering_army_advantage:0 "[cc_advantage_gathering|E]"
 trait_aggressive_attacker_character_desc:0 "$cc_trait_aggressive_attacker$ Nic nie zaspokoi [ROOT.GetCharacter.GetFirstNameNoTooltip] ale krew [ROOT.GetCharacter.GetHerHis] wrogowie."
 trait_flexible_leader_character_desc:0 "$cc_trait_flexible_leader$[ROOT.GetCharacter.GetFirstNameNoTooltip] wie, jak zmniejszyć przewagę, jaką broniące się armie uzyskują z fortyfikacji, terenu, rzek i przepraw przez cieśniny."
 trait_forder_character_desc:1 "$cc_trait_forder$[ROOT.GetCharacter.GetFirstNameNoTooltip] jest u siebie blisko wody i nie ponosi żadnej kary za Przewagę w bitwach, gdy atakuje przez proste lub rzeki."
 trait_holy_warrior_character_desc:0 "$cc_trait_holy_warrior$Płonąc prawym zapałem, [ROOT.GetCharacter.GetFirstNameNoTooltip] nie spocznie, dopóki wszyscy poganie nie zostaną pokonani."
 trait_unyielding_defender_character_desc:0 "$cc_trait_unyielding_defender$[ROOT.GetCharacter.GetFirstNameNoTooltip] wie przede wszystkim jedno: to jest tak daleko, jak sięga wróg."
 trait_forest_fighter_character_desc:0 "$cc_trait_forest_fighter$Tam, gdzie niektórzy postrzegają lasy jako przeszkodę, [ROOT.GetCharacter.GetFirstNameNoTooltip] widzi szansę."
 trait_open_terrain_expert_character_desc:0 "$cc_trait_open_terrain_expert$Otwarte pola i rozległe przestrzenie są tam, gdzie [ROOT.GetCharacter.GetFirstNameNoTooltip] czują się jak w domu i szybko wykorzystują to w bitwie."
 trait_rough_terrain_expert_character_desc:0 "$cc_trait_rough_terrain_expert$Trudny teren może być potężnym narzędziem dla tych, którzy potrafią go wykorzystać i zyskać przewagę w bitwie."
 trait_desert_warrior_character_desc:0 "$cc_trait_desert_warrior$Karzące słońce i palący upał pustyni nie są dla ciebie wrogiem [ROOT.GetCharacter.GetFirstNameNoTooltip]."
 trait_jungle_stalker_character_desc:0 "$cc_trait_jungle_stalker$Bujny las każdej dżungli jest sprzymierzeńcem [ROOT.GetCharacter.GetFirstNameNoTooltip]."
 trait_winter_soldier_character_desc:0 "$cc_trait_winter_soldier$[ROOT.GetCharacter.GetFirstNameNoTooltip] jest ukształtowany przez przenikliwe zimno i wie, jak go zamienić [ROOT.GetCharacter.GetHerHis] korzyść."
 trait_logistician_character_desc:0 "$cc_trait_logistician$Jeśli jest jedna rzecz [ROOT.GetCharacter.GetFirstNameNoTooltip] wie, jak sprawić, by zapasy trwały i dobrze służyły."
 trait_aggressive_attacker_desc:0 "$cc_trait_aggressive_attacker$Nic nie nasyci Agresywnego atakującego, jak tylko krew jego wrogów."
 trait_flexible_leader_desc:0 "$cc_trait_flexible_leader$Postać ta wie, jak zmniejszyć Przewagę, jaką broniące się armie uzyskują z fortyfikacji, terenu, rzek i przepraw przez cieśniny."
 trait_forder_desc:1 "$cc_trait_forder$Postać ta czuje się dobrze blisko wody i nie otrzyma żadnej kary do Przewagi w bitwach, gdy atakuje przez proste lub rzeki."
 trait_holy_warrior_desc:0 "$cc_trait_holy_warrior$Płonąc prawym zapałem, Święty Wojownik nie spocznie, dopóki wszyscy poganie nie zostaną pokonani."
 trait_unyielding_defender_desc:0 "$cc_trait_unyielding_defender$Nieustępliwy obrońca wie przede wszystkim jedno: wróg nie sięga już tak daleko."
 trait_forest_fighter_desc:0 "$cc_trait_forest_fighter$Tam, gdzie niektórzy postrzegają lasy jako przeszkodę, ta postać widzi szansę."
 trait_open_terrain_expert_desc:1 "$cc_trait_open_terrain_expert$Otwarte pola i rozległe przestrzenie to miejsce, w którym ta postać czuje się jak w domu i szybko wykorzystuje to w walce."
 trait_rough_terrain_expert_desc:0 "$cc_trait_rough_terrain_expert$Trudny teren może być potężnym narzędziem dla tych, którzy potrafią go wykorzystać i zyskać przewagę w bitwie."
 trait_desert_warrior_desc:0 "$cc_trait_desert_warrior$Karzące słońce i palący upał pustyni nie są wrogiem tej postaci."
 trait_jungle_stalker_desc:0 "$cc_trait_jungle_stalker$Bujny las każdej dżungli jest sprzymierzeńcem tej postaci."
 trait_winter_soldier_desc:0 "$cc_trait_winter_soldier$Postać ta jest ukształtowana przez przenikliwe zimno i wie, jak obrócić je na swoją korzyść."
 trait_logistician_desc:0 "$cc_trait_logistician$Jeśli jest jedna rzecz, którą logistyk wie, to to, jak zapewnić trwałość zapasów – i to dobrą."
