	#
	### About Mod tab texts ###
	cc_op_tab1_desc: "크루세이더 컨플릭트 모드 옵션은 현재 다음에서만 사용할 수 있습니다. #high 영어#! 현지화."
	cc_op_page1_desc: "#clickable 모드 세부정보"
	cc_op_about_head: "모드 소개"
	cc_op_about_hsub: "작동 방식:\n\n\n\n#i 필수의:#!\n\n\n\n#i #high 유닛 매퍼:#! #!\n\n\n#X 지원되지 않음:#!"
	cc_op_about_desc: "#high 십자군 분쟁#! 당신이 전투에 대해 자세히 읽어 #high 크루세이더 킹스 3#! 캐릭터가 참여하고 이를 #high 토탈 워: 아틸라 전투#! 직접 제어할 수 있다는 것입니다. 징수병, Men-at-Arms 및 Knights는 Total War: Attila에서 동등한 유닛으로 변환됩니다. 단위 변환 방법에 대한 자세한 내용은 다음을 참조하세요. #clickable 문화별 부대#! 탭.\n\n#i Crusader Contributes 모드 독립 실행형 응용 프로그램\nCrusader Kings의 Steam 버전 3, Total War: Attila, 아틸라 DLC - 샤를마뉴 시대#!\n\n#i #high 이것이 모드가 Attila에서 사용할 유닛을 아는 방법입니다. 각각에는 유닛 매퍼가 로드될 때 활성화해야 하는 필수 모드/DLC가 있습니다. 그 구조는 기본적으로 모드/dlc의 유닛 그룹에 문화 및 유산 이름을 할당하는 것입니다.#!\n\n#X 1212 AD 스크립트 모듈 - 이 특정 부분을 구독하지 마십시오. 1212 광고 모드\n문화군 팩 - CK3 모드#!"
	cc_op_help_head: "도움말 및 커뮤니티"
	cc_op_help_hsub: "도움말 FAQ:\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n질문이 있으신가요? 도움이 필요하신가요?"
	cc_op_help_desc: "#high Attila 전투가 제대로 진행되지 않거나 지연됩니다!#! - Attila의 그래픽 옵션을 낮추고 #clickable 전투 규모#! 옵션. 위의 전투 20케이/40k는 말을 더듬을 것이다.\n#high 아틸라 전투 유닛 번호가 일치하지 않습니다 #clickable 단위 크기 #!옵션!#! - UNIT SIZE에 대한 Attila 그래픽 옵션이 ULTRA로 설정되어 있는지 검토하세요. ULTRA보다 낮으면 단위가 더 작아집니다.\n#high Attila가 로드하려고 하면 충돌이 발생합니다!#! - 로드된 유닛 매퍼에 대해 올바른 모드를 활성화하지 않았거나, 로드된 유닛 매퍼에 전투에 존재하는 잘못된 유닛 키가 있습니다.\n#high 배틀 플레이 버튼을 클릭해도 아무 일도 일어나지 않습니다!#! - 중앙 깃발 아이콘을 클릭하여 Crusader Contributes Launcher가 실행 중인지 확인하세요.\n#high 왜 일부 전투를 제어할 수 없나요?#! - 꼭 가봐야 해 #clickable 환경설정#! , 그리고 원하는 전투 가능한 캐릭터를 선택하세요. 이것은 매 전투 후와 ck가 발생했을 때 설정해야 하는 유일한 옵션입니다.3 시작합니다.\n#high 부정확한 전투 결과!#! - 전투에서 승리한 후에는 병력을 쓰러뜨릴 필요가 없으며 사상자도 계산되지 않습니다.\n#high CrusaderContributes.pack을 찾을 수 없습니다!#! - 크루세이더콘플릭트팩은 매 전투마다 리메이크되므로 아무것도 구독할 필요가 없으며 모드 목록의 맨 아래에 있어야 합니다.\n#high 전투 후 로딩이 너무 느립니다!#! - 이를 위해 때때로 CrusaderWars_Battle 저장 파일을 삭제하는 것이 좋습니다.\n#high Attila 유닛은 내 문화에 속하지 않습니다!#! - 유닛의 문화는 지휘관 문화를 기반으로 하므로, 자신의 문화에 속하지 않은 지휘관이 있는 경우 해당 유닛은 해당 문화에 속하게 됩니다.\n\n#high 불화 - https://discord.gg/eFZTprHh3j"
	cc_op_thank_head: "감사의 말"
	cc_op_thank_hsub: "십자군 충돌 개발자에서.."
	cc_op_thank_desc: "우리는 모든 ck를 축하합니다3 그리고 Total War Modder는 그들의 모드를 우리의 모드와 함께 사용할 수 있는 기회를 제공하고 역사적으로 정확한 유닛을 보유할 수 있게 해주었습니다! 우리는 모딩 산업을 더 나은 방향으로 바꾸고 있습니다! 또한 커뮤니티와 Patreon 지지자들에게도 감사의 말씀을 전하고 싶습니다. 저희 프로젝트를 믿어주셔서 감사하고, 정말 사랑합니다!."
