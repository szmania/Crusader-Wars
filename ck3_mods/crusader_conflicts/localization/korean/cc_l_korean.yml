	### Battle Scale tab texts ###
	cc_op_tab2_desc: "전반적인 조정 [battle|E] 성능과 수동 전투 범위를 관리하는 데 사용되는 크기입니다.\n\n#high Total War: Attila에서 제어되는 수동 전투에만 영향을 미칩니다. 일반 Crusader Kings에는 영향을 미치지 않습니다. 3 전투.#!"
	cc_op_scale_head: "전반적인 전투 규모 규모"
	cc_op_scale_desc: "Crusader Kings의 전반적인 스케일링 3 [army|E] Total War: Attila 전투의 총계입니다. 수동 전투를 위해 저가형 장비의 성능을 높이는 데 사용됩니다.\n\n으로 설정하면 50% 이 옵션은 Crusader Kings를 변환합니다. 3 총 1명과 전투를 벌인다 40,000 [soldiers|E] 총력전에 돌입하다: 아틸라 전투 20,000. 모든 단위 유형은 동일하게 조정됩니다.\n\n#high 기본값은 100% #!\n#i 전투 성능 향상을 위해 감소#!"
	cc_op_automax_head: "최대 전투 한도를 초과하는 자동 확장"
	cc_op_automax_desc: "활성화되면 [battle|E] 을 초과하는 #high 최대 전투 제한#! ~의 [soldiers|E] 설정된 한도까지 자동으로 축소됩니다. #high 최대 전투 제한#!. Total War: Attila를 충돌시킬 수 있는 대규모 최종 게임 전투를 관리하는 데 사용됩니다.\n\n#high 기본값은 활성화입니다. #!\n#X 이 옵션을 비활성화하면 충돌이 발생할 수 있습니다"
	cc_op_max_head: "최대 전투 제한"
	cc_op_max_desc: "자동 크기 조정이 활성화된 경우 - a [battle|E] 이 금액을 초과하는 [soldiers|E] 이 한도로 축소됩니다. 대규모 최종 게임 전투를 관리하는 데 사용됩니다.\n\n으로 설정하면 20,000 이 옵션은 Crusader Kings를 변환합니다. 3 전투 40,000 [soldiers|E] 총력전: 아틸라 전투까지 20,000 군인. 모든 단위 유형은 동일하게 조정됩니다.\n\N#high Total War: Attila는 전투에서 이 정확한 값을 사용하려면 ULTRA 단위 크기로 설정되어야 합니다.#! 유닛 크기가 ULTRA 아래로 설정되면 전투에서 유닛당 병력 수가 줄어들 수 있습니다.\n\n#high 기본값은 40,000#!\n#i 전투 성능 향상을 위해 감소#!"
	#
	### Unit Size tab texts ###
	cc_op_tab3_desc: "십자군 충돌 전투에서는 모든 [soldiers|E] 참여하는 군대는 통제할 수 있는 개별 유닛으로 표시됩니다. 다음 [regiments|E] 유형은 단위 크기를 조정할 수 있습니다.\n\n#high 기본이 아닌 옵션은 전투 밸런스에 영향을 미쳐 전투를 더 쉽게 또는 더 어렵게 만들 수 있습니다."
	cc_op_unit1_head: "부과금 단위 규모"
	cc_op_unit1_desc: "[levies|E] 전투에서는 유닛이 혼합되어 표시됩니다. 십자군 분쟁 전투에서 대부분의 문화는 다음과 같이 부과금을 부과합니다. 65% 가벼운 창 유닛, 10% 경거리 원거리 유닛, 및 25% 중보병 유닛. 특정 문화에는 차이가 있습니다.\n\N#high Total War: Attila는 전투에서 이 정확한 값을 사용하려면 ULTRA 단위 크기로 설정되어야 합니다.#! 유닛 크기가 ULTRA 아래로 설정되면 전투에서 유닛당 병력 수가 줄어들 수 있습니다.\n\n#high 기본값은 200 #!"
	cc_op_unit2_head: "Melee Men-at-Arms 유닛 크기"
	cc_op_unit2_desc: "난투 [men_at_arms|E] 연대는 부과금에 비해 향상된 갑옷, 무기 및 훈련을 갖춘 군인입니다. 이 부대는 검, 도끼, 창 또는 창과 같은 근접 무기를 사용하여 싸우는 유닛으로 대표됩니다.\n\n[regiment|E] 종류 [spearmen|E], [skirmishers|E], 그리고 [heavy_infantry|E] 전투에서 이 단위 크기를 사용합니다.\n\N#high Total War: Attila는 전투에서 이 정확한 값을 사용하려면 ULTRA 단위 크기로 설정되어야 합니다.#! 유닛 크기가 ULTRA 아래로 설정되면 전투에서 유닛당 병력 수가 줄어들 수 있습니다.\n\n#high 기본값은 200 #!"
	cc_op_unit3_head: "원거리 Men-at-Arms 유닛 크기"
	cc_op_unit3_desc: "원거리 [men_at_arms|E] 연대는 부과금에 비해 향상된 갑옷, 무기 및 훈련을 갖춘 군인입니다. 이 부대는 활, 석궁, 투석기, 창과 같은 원거리 무기를 사용하여 싸우는 유닛으로 대표됩니다.\n\n[regiment|E] 종류 [archers|E] 전투에서 이 단위 크기를 사용합니다.\n\N#high Total War: Attila는 전투에서 이 정확한 값을 사용하려면 ULTRA 단위 크기로 설정되어야 합니다.#! 유닛 크기가 ULTRA 아래로 설정되면 전투에서 유닛당 병력 수가 줄어들 수 있습니다.\n\n#high 기본값은 200 #!"
	cc_op_unit4_head: "기병대 병력 규모"
	cc_op_unit4_desc: "기병대 [men_at_arms|E] 연대는 징집병에 비해 말이나 낙타와 같은 탈것, 향상된 갑옷, 무기 및 훈련을 갖춘 군인입니다. 이 부대는 원거리 무기와 근접 무기를 모두 사용하여 탈것에서 싸우는 유닛으로 대표됩니다.\n\n[regiment|E] 종류 [light_cavalry|E] 그리고 [heavy_cavalry|E] 전투에서 이 단위 크기를 사용합니다.\n\n#high 기본값은 100 #!"
	cc_op_unit5_head: "loc_Siege Men-at-Arms 유닛 규모"
	cc_op_unit5_desc: "loc_공성무기 분할 방법에 대한 설명입니다. 이건 절대 필요 없을지도 몰라\n\n#high 기본값은 100 #!"
	#
	### Prefs & Battle Rules tab texts ###
	cc_op_tab4_desc: "다양한 유형의 육군 사령관이 Atilla에서 직접 통제를 맡을 수 있도록 하는 특정 옵션\n\n#high 모드를 처음 사용하는 사용자에게는 기본값을 적극 권장합니다. #!"
	cc_op_control1_head: "직접 전투 제어"
	cc_op_control1_desc: "그만큼 [commander|E] Attila에서 직접 제어할 수 있는 전투를 결정합니다.\n\n플레이어 캐릭터 전용은 위험과 보상의 균형을 제공하며 바닐라 CK에 적합합니다.3 역할극 경험.\nPlayer & Marshal은 또한 귀하의 [marshal|E] 직접적인 전투 통제를 맡는다.\n모든 왕조는 귀하의 모든 구성원을 허용합니다 [dynasty|E] 직접적인 전투 통제를 맡는다.\n모든 캐릭터는 귀하가 이름을 지정한 모든 캐릭터를 허용합니다. [commander|E] 직접적인 전투 통제를 맡는다.\n\n#high 기본값은 플레이어 캐릭터만입니다. #!\n\n#X 기본이 아닌 옵션은 Crusader Kings의 난이도를 크게 줄여줍니다. 3 운동"
	cc_op_unitnames_head: "직접 전투 유닛 이름"
	cc_op_unitnames_desc: "유닛 이름을 이상하게 만들고 싶나요 아니면 CK처럼 표준화하고 싶나요?3 Men at Arms 이름을 일반화합니까?\n\n#high 기본값은 맛있는 단위 이름입니다. #!\n\n#X CK를 사용하는 경우 맛있는 단위 이름을 사용하세요.3 AGOT과 같은 정밀 검사 또는 Crusader Kings의 Men At Arms 이름을 조정하는 모드 3"
	
