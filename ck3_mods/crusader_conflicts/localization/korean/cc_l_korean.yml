	cc_op_about_hsub_um: "작동 방식:\n\n\n\n#i 필수의:#!\n\n\n\n#i #high 선택 과목:#! #!\n\n#X 지원되지 않음:#!"
	cc_op_about_desc_um: "#high 십자군 분쟁#! 당신이 전투에 대해 자세히 읽어 #high 크루세이더 킹스 3#! 캐릭터가 참여하고 이를 #high 토탈 워: 아틸라 전투#! 직접 제어할 수 있다는 것입니다. 징수병, Men-at-Arms 및 Knights는 Total War: Attila에서 동등한 유닛으로 변환됩니다. 단위 변환 방법에 대한 자세한 내용은 다음을 참조하세요. #clickable 문화별 부대#! 탭.\n\n#i Crusader Kings의 Steam 버전 3, Total War: Attila, 아틸라 DLC - 샤를마뉴 시대\n두 Crusader Kings 모두에 대한 Crusader Contributes 모드를 구독했습니다. 3 AND 토탈 워: 아틸라\nCrusader Contributes 모드 독립 실행형 응용 프로그램 #!\n\n#i #high 토탈 워: 아틸라 모드 - 1212 AD(모델 팩 1-8)#! #!- 추가 문화 단위의 경우#!\n\n#X 1212 AD 스크립트 모듈 - 이 특정 부분을 구독하지 마십시오. 1212 광고 모드#!"
	cc_op_help_hsub_um: "도움말 FAQ:\n\n\n\n\n\n\n질문이 있으신가요? 도움이 필요하신가요?"
	cc_op_help_desc_um: "#high Attila 전투가 제대로 진행되지 않거나 지연됩니다!#! - Attila의 그래픽 옵션을 낮추고 #clickable 전투 규모#! 옵션. 또한 Crusader Kings도 확인하세요. 3 백그라운드에서 완전히 정지되고 있습니다.\n#high 아틸라 전투 유닛 번호가 일치하지 않습니다 #clickable 단위 크기 #!옵션!#! - UNIT SIZE에 대한 Attila 그래픽 옵션이 ULTRA로 설정되어 있는지 검토하세요. ULTRA보다 낮으면 단위가 더 작아집니다.\n#high Attila가 로드하려고 하면 충돌이 발생합니다!#! - 사용하고 있지 않은지 검토하세요. 1212 AD 스크립트 모드.\n#high 배틀 플레이 버튼을 클릭해도 아무 일도 일어나지 않습니다!#! - CK 출시를 검토하세요.3 중앙 플래그 아이콘을 클릭하여 CrusaderConstricts.exe를 통해 CK를 수동으로 시작하지 마세요.3 스팀에서.\n#high 왜 일부 전투를 제어할 수 없나요?#! - 수동 전투는 플레이어 캐릭터가 직접 군대를 지휘할 때만 가능합니다.\n\n#high 불화 - #! https://discord.gg/eFZTprHh3j"
	cc_op_thank_hsub_um: "1212 AD Mod 팀"
	cc_op_thank_desc_um: "더 관련성이 높은 유닛을 사용할 수 있도록 Attila를 위한 엄청나게 확장된 중세 모드를 만들어 주셔서 감사합니다!"
