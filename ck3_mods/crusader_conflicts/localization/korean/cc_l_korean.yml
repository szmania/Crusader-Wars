	### Event/Alert Window button texts ###
	ccalert.1.title: "Crusader 충돌 알림|"삶의 질" 사전 베타|3월 2024"
	ccalert.1.desc: "#high 모드가 v로 업데이트되었습니다.0.9.11 "Qaulity of Life!", 버그를 방지하려면 지금 Crusader Contributes Launcher를 업데이트하세요.\n\n크루세이더 컨플릭트 런처는 다음과 같습니다. #high 분리된 #! Steam 창작마당 CK에서3 모드. Steam이 자동으로 CK를 업데이트합니다.3 mod 파일이지만 Steam에서는 #high 아니다 #! CrusaderContributes.exe 실행 프로그램을 자동으로 업데이트합니다. CK를 열어야 해3 한 번 이상 CC 런처로 가서 업데이트하세요. 열지 않으면 런처가 업데이트를 감지하지 못합니다!.\n\n#X 업데이트된 런처를 다운로드하지 않으면 Attila 전투가 중단됩니다. 당신은 경고를 받았습니다."
 	ccalert.1.a: "지금 크루세이더 컨플릭트 런처를 업데이트하겠습니다!"
