l_korean:
 game_concept_prowess_skill_desc:3 "$game_concept_prowess$ 이차적이다 [skill|E] 이는 개인 전투에서 캐릭터의 적성을 반영합니다.\n\n기량 기술이 높다는 것은 그들이 생존하고 두 가지 모두에서 잘 수행할 가능성이 더 높다는 것을 의미합니다. [knights|E] ~에 [battles|E] 그리고 [single_combat_duel_plural|E].\n\n기량의 각 포인트는 기사에게 다음을 제공합니다.\n$BULLET_WITH_TAB$[damage|E]: #V [GetDefine('NCombat', 'KNIGHT_DAMAGE_PER_PROWESS')]#!\n$BULLET_WITH_TAB$[toughness|E]: #V [GetDefine('NCombat', 'KNIGHT_TOUGHNESS_PER_PROWESS')]#!\n\n$PROWESS_MUSCLE_INFO$ $cc_prowess_all_desc$"
 game_concept_knight_desc:4 "에이 $game_concept_knight$ 는 [vassal|E] 또는 [courtier|E] 당신에게 직접적으로 싸우는 것 [army|E].\n\n동안 [battles|E], $game_concept_knights$ 그들의 사용 [prowess_skill|E] 좀 더 효과적으로 싸우기 위해. 높은 $game_concept_prowess$ 이는 적에게 더 많은 피해를 입힐 수 있고 생존하거나 심지어 탈출할 가능성도 더 높다는 것을 의미합니다. $game_concept_battle$ 상처 없는.\n$cc_prowess_knight_desc$ \n\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_knight_desc_TOTO_DLC', 'game_concept_knight_desc_NO_TOTO_DLC' )][SelectLocalization( HasDlcFeature( 'accolades' ), 'game_concept_knight_desc_ACCOLADE_DLC', '' )]#weak 기사는 다음에 따라 다른 이름으로 알려질 수 있습니다. [culture] 또는 [faith]. 예를 들어, $knight_champion_no_tooltip_plural$, $knight_faris_no_tooltip_plural$ 또는 $knight_baghatur_no_tooltip_plural$.\n\n기사는 캐릭터와 부대의 후계자를 모두 나타냅니다.#!"
 game_concept_martial_skill_desc:2 "$game_concept_martial$ [skill|E] 캐릭터의 임금이 얼마나 좋은지를 나타냅니다. [war|E] 그리고 선도하는 [armies|E] ~에 [battle|E].\n\n높은 무술 실력이 중요합니다 [army_commanders|E], 그것이 그들의 [advantage|E] ~에 [battle|E].\n\n해당 [lifestyle|E] 은 [martial_lifestyle|E]. $cc_martial_all_desc$"
 martial_effect_desc:0 "증가 [advantage|E] 전투에서 군대를 지휘할 때 $cc_martial_commander_desc$"
 game_concept_unlanded_desc:0 "$game_concept_unlanded$ 캐릭터는 없다 [holdings|E] 그들의 [domain|E], 그러나 이론적으로는 여전히 [rulers|E] 일종의. 예를 들어 다음과 같은 경우가 있을 수 있습니다. [heads_of_faith|E] 그리고 그랜드 마스터들 [holy_orders|E]. $cc_mechanic_unlanded_desc_1$"
 game_concept_barony_desc:0 "$game_concept_baronies$ 순위가 가장 낮습니다 [titles|E] 지도에서 가장 작은 공간을 차지하며 더 큰 단위로 구성됩니다. [counties|E].\n\nBarony 타이틀에는 항상 [holder|E] 만약 그들이 [holding|E]. $cc_mechanic_unlanded_desc_2$"
 game_concept_county_desc:0 "에이 $game_concept_county$ 는 [title|E] a 이하의 순위 [duchy|E] 그리고 위에 [barony|E].\n\n제목에는 다음이 포함됩니다. [county_capital|E] 카운티에서도 그렇고 [de_jure|E] 카운티의 모든 Baronies에 대한 권리.\n\n카운티는 항상 [holders|E] 왜냐하면 카운티 수도는 파괴될 수 없기 때문입니다. $cc_mechanic_unlanded_desc_3$"
 game_concept_duchy_desc:0 "에이 $game_concept_duchy$ 는 [title|E] a 이하의 순위 [kingdom|E] 그리고 위에 [county|E].\n\n그만큼 [holder|E] 공국의 [de_jure|E] 구성 카운티에 대한 권리를 가지며 다음과 같이 간주될 수 있습니다. [vassals|E].\n\n공작령은 휴면 상태일 수 있으며 현재 보유자가 없을 수 있습니다. 이러한 제목은 다음에 의해 생성될 수 있습니다. [ruler|E] 카운티의 최소 절반을 통제하는 사람입니다. $cc_mechanic_unlanded_desc_4$"
 game_concept_kingdom_desc:0 "에이 $game_concept_kingdom$ 는 [title|E] 이하의 순위 [empire|E] 그리고 위에 [duchy|E].\n\n그만큼 [holder|E] 왕국의 [de_jure|E] 구성 영토에 대한 권리를 가지며 공작을 다음과 같이 가질 수 있습니다. [vassals|E].\n\n왕국은 휴면 상태일 수 있으며 현재 소유자가 없습니다. 이러한 제목은 다음에 의해 생성될 수 있습니다. [ruler|E] 해당 카운티의 최소 절반을 통제하는 사람입니다.$cc_mechanic_unlanded_desc_5$"
 game_concept_empire_desc:1 "$game_concept_empires$ 가장 높은 순위에 있습니다 [titles|E].\n\n그만큼 [holder|E] 제국의 [de_jure|E] 구성 영토에 대한 권리를 가지며 왕을 가질 수 있습니다. [vassals|E].\n\n제국은 휴면 상태일 수 있으며 현재 보유자가 없습니다. 이러한 제목은 다음에 의해 생성될 수 있습니다. [ruler|E] 그 이상을 통제하는 사람 80내 카운티의 %입니다. $cc_mechanic_unlanded_desc_6$"
 game_concept_title_tier_desc:2 "소유권에 해당하는 토지 [rank|E], $game_concept_title_tier$ 의 위치를 ​​결정한다 [title|E] 게임의 계층 구조 내에서.\n\n모든 타이틀에는 등급이 있으며, 등급에 따라 가능한 가장 높은 등급이 결정됩니다. [vassals|E] 그 [holder|E] 가질 수 있습니다.\n\n[empire|E] > [kingdom|E] > [duchy|E] > [county|E] > [barony|E]. $cc_unlanded_all_desc$"
 bodyguard_employer_custom_effect_description:2 "암살을 방지할 확률이 있습니다. [GetScheme('murder').GetTypeName] [schemes|E]#!\n사망하거나 체포될 위험이 줄어듭니다. [battles|E] 너네 둘 다 싸우고 있어#! $cc_court_position_bodyguard_desc$"
 champion_employer_custom_effect_description:2 "일부에서는 자리를 차지할 수 있습니다 [single_combat_duel_plural|E]\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'champion_employer_custom_effect_description_TOTO_DLC', 'champion_employer_custom_effect_description_NO_TOTO_DLC' )] $cc_court_position_champion_desc$"
 trait_wounded_1_desc:0 "이 캐릭터는 부상을 입었지만 시간이 지나면 괜찮을 것 같습니다. $cc_trait_h_wounded$"
 trait_wounded_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] 부상을 입었지만 시간이 지나면 아마 괜찮아질 것입니다. $cc_trait_h_wounded$"
 trait_one_eyed_desc:0 "이 캐릭터는 눈이 하나밖에 없습니다. $cc_trait_h_one_eyed$"
 trait_one_eyed_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] 눈은 하나뿐입니다. $cc_trait_h_one_eyed$"
 trait_disfigured_desc:0 "이 캐릭터는 끔찍하게 변형되었습니다. $cc_trait_h_disfigured$"
 trait_disfigured_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] 끔찍하게 훼손되어 있습니다. $cc_trait_h_disfigured$"
 trait_one_legged_desc:0 "이 캐릭터는 다리가 하나뿐입니다. $cc_trait_h_one_legged$"
 trait_one_legged_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] 다리가 하나뿐이에요. $cc_trait_h_one_legged$"
 trait_wounded_2_desc:0 "해당 캐릭터는 심각한 부상을 입었으며, 회복 과정이 길어질 수 있습니다. $cc_trait_h_wounded_2$"
 trait_wounded_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] 심각한 부상을 입었고 회복까지의 길이 멀었을 수도 있습니다. $cc_trait_h_wounded_2$"
 trait_wounded_3_desc:0 "이 캐릭터는 부서지고, 삶에 매달리고 있습니다. $cc_trait_h_wounded_3$"
 trait_wounded_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] 부서지고, 생명에 달라붙어 있다. $cc_trait_h_wounded_3$"
 trait_maimed_desc:1 "이 캐릭터는 심각한 손상을 입었습니다. $cc_trait_h_maimed$"
 trait_maimed_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] 심각하게 손상되었습니다. $cc_trait_h_maimed$"


 leading_own_troops_modifier:0 "[cc_advantage_leading|E]"
 cc_victorious_momentum_modifier:0 "[cc_victorious_momentum|E]"
 cc_humbling_defeat_modifier:0 "[cc_humbling_defeat|E]"
 cc_decisive_victory_modifier:0 "[cc_decisive_victory|E]"
 cc_mourning_battle_modifier:0 "[cc_mourning_battle|E]"
 defender_river:0 "[cc_advantage_river|E] 강 건너기 방어"
 defender_river_large:0 "[cc_advantage_big_river|E] 주요 강 건너기 방어"
 defender_strait:0 "[cc_advantage_strait|E] 해협 횡단 방어"
 supply_state_supplied_advantage:2 "군대가 공급됩니다"
 supply_state_running_low_advantage:2 "[cc_advantage_lowsupplies|E]"
 supply_state_starving_advantage:2 "[cc_advantage_nosupplies|E]"
 recently_disembarked_advantage:1 "상대는 [recently_disembarked|E]"
 gathering_army_advantage:0 "[cc_advantage_gathering|E]"
 
 trait_aggressive_attacker_character_desc:0 "$cc_trait_aggressive_attacker$ 아무것도 만족하지 못할 것이다 [ROOT.GetCharacter.GetFirstNameNoTooltip] 하지만 그 피 [ROOT.GetCharacter.GetHerHis] 적."
 trait_flexible_leader_character_desc:0 "$cc_trait_flexible_leader$[ROOT.GetCharacter.GetFirstNameNoTooltip] 방어하는 군대가 요새, 지형, 강, 해협 횡단에서 얻는 이점을 줄이는 방법을 알고 있습니다."
 trait_forder_character_desc:1 "$cc_trait_forder$[ROOT.GetCharacter.GetFirstNameNoTooltip] 물 가까이에 있으며 직선이나 강을 가로질러 공격할 때 전투에서 이점 페널티를 받지 않습니다."
 trait_holy_warrior_character_desc:0 "$cc_trait_holy_warrior$정의로운 열정으로 불타오르고, [ROOT.GetCharacter.GetFirstNameNoTooltip] 모든 이교도가 패배할 때까지 쉬지 않을 것입니다."
 trait_unyielding_defender_character_desc:0 "$cc_trait_unyielding_defender$[ROOT.GetCharacter.GetFirstNameNoTooltip] 무엇보다도 한 가지를 알고 있습니다. 적의 행방은 이것뿐이라는 것입니다."
 trait_forest_fighter_character_desc:0 "$cc_trait_forest_fighter$어떤 사람들은 숲을 장애물로 여기지만, [ROOT.GetCharacter.GetFirstNameNoTooltip] 기회를 봅니다."
 trait_open_terrain_expert_character_desc:0 "$cc_trait_open_terrain_expert$탁 트인 들판과 넓은 공간이 있는 곳 [ROOT.GetCharacter.GetFirstNameNoTooltip] 그들은 편안함을 느끼고 전투에서 이를 신속하게 활용합니다."
 trait_rough_terrain_expert_character_desc:0 "$cc_trait_rough_terrain_expert$어려운 지형은 이를 활용하고 전투에서 우위를 점할 수 있는 사람들에게는 강력한 도구가 될 수 있습니다."
 trait_desert_warrior_character_desc:0 "$cc_trait_desert_warrior$가혹한 태양과 사막의 뜨거운 열기는 우리에게 적이 아닙니다. [ROOT.GetCharacter.GetFirstNameNoTooltip]."
 trait_jungle_stalker_character_desc:0 "$cc_trait_jungle_stalker$정글의 무성한 숲은 [ROOT.GetCharacter.GetFirstNameNoTooltip]."
 trait_winter_soldier_character_desc:0 "$cc_trait_winter_soldier$[ROOT.GetCharacter.GetFirstNameNoTooltip] 혹독한 추위로 인해 몸이 굳어졌고, 그것을 추위로 바꾸는 방법을 알고 있습니다. [ROOT.GetCharacter.GetHerHis] 이점."
 trait_logistician_character_desc:0 "$cc_trait_logistician$한 가지가 있다면 [ROOT.GetCharacter.GetFirstNameNoTooltip] 공급품을 오래 지속되게 만드는 방법이 무엇인지 알고 있습니다."
 
 
 trait_aggressive_attacker_desc:0 "$cc_trait_aggressive_attacker$공격적인 공격자를 만족시킬 수 있는 것은 적의 피 외에는 없습니다."
 trait_flexible_leader_desc:0 "$cc_trait_flexible_leader$이 캐릭터는 요새, 지형, 강, 해협 횡단에서 방어하는 군대가 얻는 이점을 줄이는 방법을 알고 있습니다."
 trait_forder_desc:1 "$cc_trait_forder$이 캐릭터는 물 가까이에 있으며 직선이나 강을 건너 공격할 때 전투에서 이점 페널티를 받지 않습니다."
 trait_holy_warrior_desc:0 "$cc_trait_holy_warrior$정의로운 열정으로 불타오르는 신성한 전사는 모든 이교도가 패배할 때까지 쉬지 않을 것입니다."
 trait_unyielding_defender_desc:0 "$cc_trait_unyielding_defender$불굴의 방어자는 무엇보다도 한 가지를 알고 있습니다. 바로 이것이 적의 한계입니다."
 trait_forest_fighter_desc:0 "$cc_trait_forest_fighter$어떤 사람들은 숲을 장애물로 보는 반면, 이 캐릭터는 기회를 봅니다."
 trait_open_terrain_expert_desc:1 "$cc_trait_open_terrain_expert$탁 트인 들판과 광활한 공간은 이 캐릭터가 편안함을 느끼는 곳이며 전투에서 이를 신속하게 활용합니다."
 trait_rough_terrain_expert_desc:0 "$cc_trait_rough_terrain_expert$어려운 지형은 이를 활용하고 전투에서 우위를 점할 수 있는 사람들에게는 강력한 도구가 될 수 있습니다."
 trait_desert_warrior_desc:0 "$cc_trait_desert_warrior$혹독한 태양과 사막의 고동치는 이 캐릭터에게는 적이 아닙니다."
 trait_jungle_stalker_desc:0 "$cc_trait_jungle_stalker$정글의 울창한 숲은 이 캐릭터의 동맹입니다."
 trait_winter_soldier_desc:0 "$cc_trait_winter_soldier$이 캐릭터는 혹독한 추위로 인해 형성되었으며 이를 유리하게 활용하는 방법을 알고 있습니다."
 trait_logistician_desc:0 "$cc_trait_logistician$물류 담당자가 알고 있는 한 가지가 있다면 그것은 소모품을 오래 지속되게 만드는 방법입니다."
 
