l_simp_chinese:
 game_concept_prowess_skill_desc:3 "$game_concept_prowess$ 是次要的 [skill|E] 这反映了角色的个人战斗能力。\n\n高威力技能意味着他们更有可能生存并表现良好 [knights|E] 在 [battles|E] 并在 [single_combat_duel_plural|E].\n\n每点英勇都会赋予一名骑士：\n$BULLET_WITH_TAB$[damage|E]: #V [GetDefine('NCombat', 'KNIGHT_DAMAGE_PER_PROWESS')]#!\n$BULLET_WITH_TAB$[toughness|E]: #V [GetDefine('NCombat', 'KNIGHT_TOUGHNESS_PER_PROWESS')]#!\n\n$PROWESS_MUSCLE_INFO$ $cc_prowess_all_desc$"
 game_concept_knight_desc:4 "一个 $game_concept_knight$ 是一个 [vassal|E] 或者 [courtier|E] 直接在你的战斗中 [army|E].\n\n期间 [battles|E], $game_concept_knights$ 使用他们的 [prowess_skill|E] 以便更有效地战斗。一个高 $game_concept_prowess$ 意味着他们将能够对敌人造成更多伤害，并且更有可能生存甚至摆脱困境 $game_concept_battle$ 毫发无伤。\n$cc_prowess_knight_desc$ \n\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_knight_desc_TOTO_DLC', 'game_concept_knight_desc_NO_TOTO_DLC' )][SelectLocalization( HasDlcFeature( 'accolades' ), 'game_concept_knight_desc_ACCOLADE_DLC', '' )]#weak 骑士可以有不同的名称，具体取决于 [culture] 或者 [faith]。例如， $knight_champion_no_tooltip_plural$, $knight_faris_no_tooltip_plural$ 或者 $knight_baghatur_no_tooltip_plural$.\n\n骑士既代表人物，也代表他们的军队随从。#!"
 game_concept_martial_skill_desc:2 "$game_concept_martial$ [skill|E] 表明角色的战斗能力如何 [war|E] 并领先 [armies|E] 在 [battle|E].\n\n较高的武功对于 [army_commanders|E]，因为它提高了他们的 [advantage|E] 在 [battle|E].\n\n相应的 [lifestyle|E] 是 [martial_lifestyle|E]. $cc_martial_all_desc$"
 martial_effect_desc:0 "增加 [advantage|E] 在指挥军队作战时 $cc_martial_commander_desc$"
 game_concept_unlanded_desc:0 "$game_concept_unlanded$ 人物没有 [holdings|E] 在他们的 [domain|E]，但理论上仍然可以 [rulers|E] 某种意义上的。例如，情况可能是这样的 [heads_of_faith|E] 以及大师们 [holy_orders|E]. $cc_mechanic_unlanded_desc_1$"
 game_concept_barony_desc:0 "$game_concept_baronies$ 是排名最低的 [titles|E] 并在地图上具有最小的足迹，并组织成更大的 [counties|E].\n\n男爵头衔必须始终具有 [holder|E] 如果它们包含 [holding|E]. $cc_mechanic_unlanded_desc_2$"
 game_concept_county_desc:0 "一个 $game_concept_county$ 是一个 [title|E] 排名低于a [duchy|E] 以及以上a [barony|E].\n\n标题包括 [county_capital|E] 在县城，还有 [de_jure|E] 郡内所有男爵的权利。\n\n县城一直都有 [holders|E] 因为县城是不能被破坏的。 $cc_mechanic_unlanded_desc_3$"
 game_concept_duchy_desc:0 "一个 $game_concept_duchy$ 是一个 [title|E] 排名低于a [kingdom|E] 以及以上a [county|E].\n\n这 [holder|E] 一个公国有 [de_jure|E] 对其组成县的权利，并且可以计数为 [vassals|E].\n\n公国可能处于休眠状态并且没有现任持有人。此类标题可以由 [ruler|E] 谁控制着至少一半的县。 $cc_mechanic_unlanded_desc_4$"
 game_concept_kingdom_desc:0 "一个 $game_concept_kingdom$ 是一个 [title|E] 排名低于 [empire|E] 以及以上a [duchy|E].\n\n这 [holder|E] 一个王国有 [de_jure|E] 对其组成领土的权利，并可以让公爵作为 [vassals|E].\n\n王国可能处于休眠状态并且没有当前的持有者。此类标题可以由 [ruler|E] 谁控制着境内至少一半的县。$cc_mechanic_unlanded_desc_5$"
 game_concept_empire_desc:1 "$game_concept_empires$ 是排名最高的 [titles|E].\n\n这 [holder|E] 一个帝国有 [de_jure|E] 对其组成领土的权利，并可以让国王作为 [vassals|E].\n\n帝国可以处于休眠状态并且没有当前的持有者。此类标题可以由 [ruler|E] 谁控制的多于 80其中县的百分比。 $cc_mechanic_unlanded_desc_6$"
 game_concept_title_tier_desc:2 "相当于产权的土地 [rank|E]， 这 $game_concept_title_tier$ 确定 a 的位置 [title|E] 在游戏的层次结构中。\n\n所有标题都有一个等级，它决定了可能的最高等级 [vassals|E] 认为 [holder|E] 可以有。\n\n[empire|E] > [kingdom|E] > [duchy|E] > [county|E] > [barony|E]. $cc_unlanded_all_desc$"
 bodyguard_employer_custom_effect_description:2 "有一定几率阻止刺杀 [GetScheme('murder').GetTypeName] [schemes|E]#!\n降低您死亡或被俘的风险 [battles|E] 你们都在战斗#! $cc_court_position_bodyguard_desc$"
 champion_employer_custom_effect_description:2 "可以在某些方面取代你的位置 [single_combat_duel_plural|E]\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'champion_employer_custom_effect_description_TOTO_DLC', 'champion_employer_custom_effect_description_NO_TOTO_DLC' )] $cc_court_position_champion_desc$"
 trait_wounded_1_desc:0 "该角色已受伤，但经过一段时间后可能会痊愈。 $cc_trait_h_wounded$"
 trait_wounded_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] 受了伤，但假以时日，也许会痊愈。 $cc_trait_h_wounded$"
 trait_one_eyed_desc:0 "这个角色只有一只眼睛。 $cc_trait_h_one_eyed$"
 trait_one_eyed_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] 只有一只眼睛。 $cc_trait_h_one_eyed$"
 trait_disfigured_desc:0 "这个角色的容貌极其丑陋。 $cc_trait_h_disfigured$"
 trait_disfigured_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] 被严重毁容了。 $cc_trait_h_disfigured$"
 trait_one_legged_desc:0 "这个角色只有一条腿。 $cc_trait_h_one_legged$"
 trait_one_legged_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] 只有一条腿。 $cc_trait_h_one_legged$"
 trait_wounded_2_desc:0 "这个角色已经受了重伤，康复之路可能很漫长。 $cc_trait_h_wounded_2$"
 trait_wounded_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] 受了重伤，康复之路可能很漫长。 $cc_trait_h_wounded_2$"
 trait_wounded_3_desc:0 "这个性格已经被打破了，正在执着于生命。 $cc_trait_h_wounded_3$"
 trait_wounded_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] 已经破碎，却又执着于生命。 $cc_trait_h_wounded_3$"
 trait_maimed_desc:1 "这个角色已经严重残废了。 $cc_trait_h_maimed$"
 trait_maimed_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] 已严重致残。 $cc_trait_h_maimed$"


 leading_own_troops_modifier:0 "[cc_advantage_leading|E]"
