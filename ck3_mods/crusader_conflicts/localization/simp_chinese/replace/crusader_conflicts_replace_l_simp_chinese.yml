 trait_aggressive_attacker_character_desc:0 "$cc_trait_aggressive_attacker$ 什么都不会满足 [ROOT.GetCharacter.GetFirstNameNoTooltip] 但血 [ROOT.GetCharacter.GetHerHis] 敌人。"
 trait_flexible_leader_character_desc:0 "$cc_trait_flexible_leader$[ROOT.GetCharacter.GetFirstNameNoTooltip] 知道如何减少守军从防御工事、地形、河流和海峡渡口获得的优势。"
 trait_forder_character_desc:1 "$cc_trait_forder$[ROOT.GetCharacter.GetFirstNameNoTooltip] 主场靠近水源，在战斗中跨直道或河流攻击时不会受到优势惩罚。"
 trait_holy_warrior_character_desc:0 "$cc_trait_holy_warrior$燃烧着正义的热情， [ROOT.GetCharacter.GetFirstNameNoTooltip] 不打败所有异教徒就不会休息。"
 trait_unyielding_defender_character_desc:0 "$cc_trait_unyielding_defender$[ROOT.GetCharacter.GetFirstNameNoTooltip] 最重要的是知道一件事：敌人已经到了最远的地方。"
 trait_forest_fighter_character_desc:0 "$cc_trait_forest_fighter$有些人将森林视为障碍， [ROOT.GetCharacter.GetFirstNameNoTooltip] 看到机会。"
 trait_open_terrain_expert_character_desc:0 "$cc_trait_open_terrain_expert$开阔的田野和广阔的空间 [ROOT.GetCharacter.GetFirstNameNoTooltip] 他们有宾至如归的感觉，他们很快就能在战斗中利用这一点。"
 trait_rough_terrain_expert_character_desc:0 "$cc_trait_rough_terrain_expert$对于那些能够利用它并在战斗中占据上风的人来说，困难的地形可以成为一个强大的工具。"
 trait_desert_warrior_character_desc:0 "$cc_trait_desert_warrior$沙漠的严酷阳光和酷暑并不是他们的敌人 [ROOT.GetCharacter.GetFirstNameNoTooltip]."
 trait_jungle_stalker_character_desc:0 "$cc_trait_jungle_stalker$任何丛林的茂密森林都是 [ROOT.GetCharacter.GetFirstNameNoTooltip]."
 trait_winter_soldier_character_desc:0 "$cc_trait_winter_soldier$[ROOT.GetCharacter.GetFirstNameNoTooltip] 被严寒所塑造，并知道如何将其转化为 [ROOT.GetCharacter.GetHerHis] 优势。"
 trait_logistician_character_desc:0 "$cc_trait_logistician$如果有一件事 [ROOT.GetCharacter.GetFirstNameNoTooltip] 知道，这就是如何使供应品持久且持久良好。"
 trait_aggressive_attacker_desc:0 "$cc_trait_aggressive_attacker$除了敌人的鲜血之外，没有什么能让侵略性的攻击者感到满足。"
 trait_flexible_leader_desc:0 "$cc_trait_flexible_leader$该角色知道如何减少防御军从防御工事、地形、河流和海峡交叉口获得的优势。"
 trait_forder_desc:1 "$cc_trait_forder$该角色在靠近水域的地方，在战斗中跨直道或河流攻击时不会受到优势惩罚。"
 trait_holy_warrior_desc:0 "$cc_trait_holy_warrior$圣斗士燃烧着正义的热情，不打败所有异教徒就不会休息。"
 trait_unyielding_defender_desc:0 "$cc_trait_unyielding_defender$一个不屈的防御者最重要的是知道一件事：这是敌人所能到达的最远的地方。"
 trait_forest_fighter_desc:0 "$cc_trait_forest_fighter$有些人将森林视为障碍，而这个角色却看到了机遇。"
 trait_open_terrain_expert_desc:1 "$cc_trait_open_terrain_expert$开阔的田野和广阔的空间让这个角色感到宾至如归，他们很快就能在战斗中利用这一点。"
 trait_rough_terrain_expert_desc:0 "$cc_trait_rough_terrain_expert$对于那些能够利用它并在战斗中占据上风的人来说，困难的地形可以成为一个强大的工具。"
 trait_desert_warrior_desc:0 "$cc_trait_desert_warrior$沙漠的严酷阳光和酷暑对于这个角色来说并不是敌人。"
 trait_jungle_stalker_desc:0 "$cc_trait_jungle_stalker$任何丛林的茂密森林都是这个角色的盟友。"
 trait_winter_soldier_desc:0 "$cc_trait_winter_soldier$这个性格是由严寒塑造的，并且知道如何将其转化为优势。"
 trait_logistician_desc:0 "$cc_trait_logistician$如果说物流师知道一件事，那就是如何使供应持续且持续良好。"
