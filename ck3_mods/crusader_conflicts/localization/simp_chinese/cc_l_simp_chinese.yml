	cc_op_about_desc_um: "#high 十字军冲突#! 阅读有关您的战斗的详细信息 #high 十字军之王 3#! 角色参与并将其转换为 #high 全面战争：阿提拉之战#! 您可以直接控制。征召兵、武装人员和骑士在《全面战争：阿提拉》中转换为同等单位。有关如何转换单位的详细信息，请参阅 #clickable 文化队伍#! 选项卡。\n\n#i Steam 版本的十字军之王 3, 全面战争：阿提拉，阿提拉 DLC - 查理曼时代\n订阅十字军之王的十字军冲突模组 3 以及《全面战争：阿提拉》\nCrusader Conflicts mod 独立应用程序 #!\n\n#i #high 全面战争：阿提拉 mod - 1212 AD（模型包 1-8)#! #!- 对于其他文化单位#!\n\n#X 1212 AD 脚本模块 - 不要订阅该特定部分 1212 广告模式#!"
	cc_op_help_hsub_um: "帮助常见问题：\n\n\n\n\n\n\n有疑问吗？需要帮助吗？"
	cc_op_help_desc_um: "#high 阿提拉的战斗进行得很糟糕/滞后！#! - 降低《阿提拉》中的图形选项，降低 #clickable 战斗规模#! 选项。还要确保十字军之王 3 完全暂停在后台。\n#high 阿提拉战斗单位编号不匹配 #clickable 单位尺寸 #!选项！#! - 查看 Attila 图形选项，将“单位大小”设置为“ULTRA”。低于 ULTRA 将导致单位更小。\n#high 阿提拉在尝试加载时崩溃了！#! - 检查您是否没有使用 1212 AD 脚本模组。\n#high 单击“开始战斗”按钮没有任何反应！#! - 检查您是否正在启动 CK3 通过 CrusaderConflicts.exe 单击中心标志图标，不要手动启动 CK3 来自蒸汽。\n#high 为什么有些战斗我无法掌控！#! - 手动战斗仅在玩家角色亲自指挥军队时可用。\n\n#high 不和谐- #! https://discord.gg/eFZTprHh3j"
