	#
	### Event/Alert Window button texts ###
	ccalert.1.title: "十字军冲突通知|“生活质量”预测试|三月 2024"
	ccalert.1.desc: "#high 模组更新为v0.9.11 “生活质量！”，如果您还没有更新您的十字军冲突启动器，请立即更新，以避免出现错误。\n\n十字军冲突发射器是 #high 分离 #! 来自 Steam 创意工坊 CK3 模组。 Steam会自动更新CK3 mod 文件，但 Steam 可以 #high 不是 #! 自动更新 CrusaderConflicts.exe 启动器。你需要打开CK3 至少一次，然后进入 CW 启动器并更新，如果不打开它，启动器将不会检测到任何更新！。\n\n#X 如果您不下载更新的启动器，您的阿提拉战斗将会崩溃。你已被警告过。"
 	ccalert.1.a: "我现在就更新十字军冲突启动器！"
