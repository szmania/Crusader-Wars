	### Troops by Culture conversions for both default attila and with 1212 AD HEADERS ### 
	cc_op_page2_desc: "#clickable 按文化划分的部队（默认）"
	cc_op_page3_desc: "#clickable 部队文化 1212 广告（可选）"
