	### Battle Scale tab texts ###
	cc_op_tab2_desc: "整体调整 [battle|E] 大小，用于管理性能与手动战斗的范围。\n\n#high 仅影响《全面战争：阿提拉》中控制的手动战斗。对普通十字军之王没有影响 3 战斗。#!"
	cc_op_scale_head: "总体战斗规模"
	cc_op_scale_desc: "十字军之王的整体规模 3 [army|E] 全面战争：阿提拉战役总计。用于帮助提高低端机器的手动战斗性能。\n\n当设置为 50% 此选项将转换十字军之王 3 与总共战斗 40,000 [soldiers|E] 全面战争：阿提拉之战 20,000。所有单位类型都将同等缩放。\n\n#high 默认值为 100% #!\n#i 减少以提高战斗力#!"
	cc_op_automax_head: "自动缩放超出最大战斗限制"
	cc_op_automax_desc: "启用后，会出现一个 [battle|E] 超过了 #high 最大战斗限制#! 的 [soldiers|E] 将自动缩小到设置的限制 #high 最大战斗限制#!。用于帮助管理可能导致《全面战争：阿提拉》崩溃的大规模最终游戏战斗。\n\n#high 默认值为启用 #!\n#X 禁用此选项可能会导致崩溃"
	cc_op_max_head: "最大战斗限制"
	cc_op_max_desc: "启用自动缩放时 - a [battle|E] 超过这个数量的 [soldiers|E] 将缩小至此限制。用于帮助管理大型的最终游戏战斗。\n\n当设置为 20,000 此选项将转换十字军之王 3 与战斗 40,000 [soldiers|E] 全面战争：阿提拉之战 20,000 士兵。所有单位类型都将同等缩放。\n\N#high 《全面战争：阿提拉》必须设置为“ULTRA”单位大小才能让战斗使用该精确值。#! 如果单位规模设置为低于“ULTRA”，则战斗中每个单位的人数可能会减少。\n\n#high 默认值为 40,000#!\n#i 减少以提高战斗力#!"
	#
	### Unit Size tab texts ###
	cc_op_tab3_desc: "在十字军冲突中所有的战斗 [soldiers|E] 参与的军队由可以控制的单个单位代表。下列 [regiments|E] 类型可以调整其单位大小。\n\n#high 非默认选项会影响战斗平衡，这可能会使战斗变得更容易或更困难。"
	cc_op_unit1_head: "征费单位规模"
	cc_op_unit1_desc: "[levies|E] 在战斗中由多种单位代表。在十字军冲突中，大多数文化都会将征召的士兵部署为 65% 轻矛单位， 10% 光程单位，以及 25% 中型步兵单位。某些文化存在差异。\n\N#high 《全面战争：阿提拉》必须设置为“ULTRA”单位大小才能让战斗使用该精确值。#! 如果单位规模设置为低于“ULTRA”，则战斗中每个单位的人数可能会减少。\n\n#high 默认值为 200 #!"
	cc_op_unit2_head: "近战武装人员单位规模"
	cc_op_unit2_desc: "近战 [men_at_arms|E] 与征召兵相比，团是拥有改进的装甲、武器和训练的士兵。这些部队以使用剑、斧头、长矛或长矛等近战武器进行战斗的单位为代表。\n\n[regiment|E] 的类型 [spearmen|E], [skirmishers|E]， 和 [heavy_infantry|E] 在战斗中使用这个单位尺寸。\n\N#high 《全面战争：阿提拉》必须设置为“ULTRA”单位大小才能让战斗使用该精确值。#! 如果单位规模设置为低于“ULTRA”，则战斗中每个单位的人数可能会减少。\n\n#high 默认值为 200 #!"
	cc_op_unit3_head: "远程武装部队规模"
	cc_op_unit3_desc: "远程 [men_at_arms|E] 与征召兵相比，团是拥有改进的装甲、武器和训练的士兵。这些部队以使用弓、弩、投石索或标枪等远程武器进行战斗的部队为代表。\n\n[regiment|E] 的类型 [archers|E] 在战斗中使用这个单位尺寸。\n\N#high 《全面战争：阿提拉》必须设置为“ULTRA”单位大小才能让战斗使用该精确值。#! 如果单位规模设置为低于“ULTRA”，则战斗中每个单位的人数可能会减少。\n\n#high 默认值为 200 #!"
	cc_op_unit4_head: "骑兵部队规模"
	cc_op_unit4_desc: "骑兵 [men_at_arms|E] 团是拥有马或骆驼等坐骑的士兵，与征召兵相比，他们拥有改进的盔甲、武器和训练。这些部队由使用远程和近战武器的坐骑作战的部队代表。\n\n[regiment|E] 的类型 [light_cavalry|E] 和 [heavy_cavalry|E] 在战斗中使用这个单位尺寸。\n\n#high 默认值为 100 #!"
	cc_op_unit5_head: "loc_Siege 士兵单位规模"
	cc_op_unit5_desc: "loc_关于攻城武器如何分割的描述。可能永远不需要这个\n\n#high 默认值为 100 #!"
	#
	### Prefs & Battle Rules tab texts ###
	cc_op_tab4_desc: "允许不同类型的陆军指挥官直接控制阿蒂拉的特定选项\n\n#high 强烈建议首次使用该模组的用户使用默认值。 #!"
	cc_op_control1_head: "直接战斗控制"
	cc_op_control1_desc: "这 [commander|E] 决定哪些战斗可以由阿提拉直接控制。\n\n仅玩家角色提供了风险与奖励的平衡，并且适合原版 CK3 角色扮演体验。\n球员和元帅也将允许您 [marshal|E] 承担直接战斗控制权。\n所有王朝将允许您的任何成员 [dynasty|E] 承担直接战斗控制权。\n所有角色将允许您命名的任何角色 [commander|E] 承担直接战斗控制权。\n\n#high 默认值为仅限玩家角色 #!\n\n#X 非默认选项将大大降低你的十字军之王的难度 3 活动"
	cc_op_unitnames_head: "直接战斗单位名称"
	cc_op_unitnames_desc: "你想要疯狂的单位名称还是像 CK 那样标准化3 概括男性武装人员的名字？\n\n#high 默认值是美味的单位名称 #!\n\n#X 如果您使用的是 CK，请使用有趣的单位名称3 大修，例如 AGOT，或调整《十字军之王》中武装人员名称的模组 3"
	
