	#
	### About Mod tab texts ###
	cc_op_tab1_desc: "Crusader Conflicts Mod 选项目前仅适用于 #high 英语#! 本土化。"
	cc_op_page1_desc: "#clickable 模组详情"
	cc_op_about_head: "关于模组"
	cc_op_about_hsub: "运作原理：\n\n\n\n#i 必需的：#!\n\n\n\n#i #high 单位映射器：#! #!\n\n\n#X 不支持：#!"
	cc_op_about_desc: "#high 十字军冲突#! 阅读有关您的战斗的详细信息 #high 十字军之王 3#! 角色参与并将其转换为 #high 全面战争：阿提拉之战#! 您可以直接控制。征召兵、武装人员和骑士在《全面战争：阿提拉》中转换为同等单位。有关如何转换单位的详细信息，请参阅 #clickable 文化队伍#! 选项卡。\n\n#i Crusader Conflicts mod 独立应用程序\nSteam 版本的十字军之王 3, 全面战争：阿提拉，阿提拉 DLC - 查理曼时代#!\n\n#i #high 这就是模组如何知道在阿提拉上使用哪些单位的方式。每个都有必需的 mods/DLC，您需要在加载单位映射器时启用它们。它们的结构基本上是将文化和遗产名称分配给 mods/dlc 的一组单位。#!\n\n#X 1212 AD 脚本模块 - 不要订阅该特定部分 1212 广告模式\n文化大军包 - CK3 模组#!"
	cc_op_help_head: "帮助和社区"
	cc_op_help_hsub: "帮助常见问题：\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n有疑问吗？需要帮助吗？"
	cc_op_help_desc: "#high 阿提拉的战斗进行得很糟糕/滞后！#! - 降低《阿提拉》中的图形选项，降低 #clickable 战斗规模#! 选项。以上战斗 20k/40k 会结巴。\n#high 阿提拉战斗单位编号不匹配 #clickable 单位尺寸 #!选项！#! - 查看 Attila 图形选项，将“单位大小”设置为“ULTRA”。低于 ULTRA 将导致单位更小。\n#high 阿提拉在尝试加载时崩溃了！#! - 您要么没有为加载的单位映射器启用正确的模组，要么加载的单位映射器的单位键不正确，它出现在战斗中。\n#high 单击“开始战斗”按钮没有任何反应！#! - 单击中心标志图标，检查 Crusader Conflicts Launcher 是否已启动并正在运行。\n#high 为什么有些战斗我无法掌控！#! - 你必须去 #clickable 偏好设置#! ，然后选择想要的可以战斗的角色。这是您在每次战斗后和 ck 时需要设置的唯一选项3 开始。\n#high 战斗结果不准确！#! - 赢得一场战斗后，没有必要去追击军队，他们的伤亡不会被计算在内。\n#high 我找不到 CrusaderConflicts.pack！#! - CrusaderConflicts.pack 每场战斗都会重制，你不需要订阅任何东西，它应该是你的 mod 列表的底部。\n#high 战斗后加载太慢！#! - 为此，我们建议不时删除 CrusaderWars_Battle 保存的内容。\n#high 阿提拉单位不是来自我的文化！#! - 单位的文化是基于指挥官文化的，所以如果你的指挥官不是你的文化，那么单位将是他的文化。\n\n#high 不和谐- https://discord.gg/eFZTprHh3j"
	cc_op_thank_head: "致谢"
	cc_op_thank_hsub: "来自十字军冲突开发者.."
	cc_op_thank_desc: "我们祝贺每一位ck3 还有全面战争模组制作者，让我们有机会将他们的模组与我们的模组一起使用，并拥有绝对历史准确的单位！我们正在让改装行业变得更好！我们还要感谢社区和我们的 patreon 支持者，感谢您对我们项目的信任，我们非常爱您！"
