l_german:
 game_concept_prowess_skill_desc:3 "$game_concept_prowess$ ist eine sekundäre [skill|E] Das spiegelt die Fähigkeit des Charakters im persönlichen Kampf wider.\n\nEine hohe Fähigkeit bedeutet, dass sie mit größerer Wahrscheinlichkeit überleben und sowohl als auch [knights|E] in [battles|E] und [single_combat_duel_plural|E].\n\nJeder Punkt der Fähigkeiten gibt einem Ritter:\n$BULLET_WITH_TAB$[damage|E]: #V [GetDefine('NCombat', 'KNIGHT_DAMAGE_PER_PROWESS')]#!\n$BULLET_WITH_TAB$[toughness|E]: #V [GetDefine('NCombat', 'KNIGHT_TOUGHNESS_PER_PROWESS')]#!\n\n$PROWESS_MUSCLE_INFO$ $cc_prowess_all_desc$"
 game_concept_knight_desc:4 "A $game_concept_knight$ is a [vassal|E] or [courtier|E] die direkt in deinem [army|E].\n\nWährend [battles|E], $game_concept_knights$ Verwenden Sie Ihre [prowess_skill|E] effektiver zu kämpfen. Eine hohe $game_concept_prowess$ bedeutet, dass sie in der Lage sein werden, dem Feind mehr Schaden zuzufügen, und mit größerer Wahrscheinlichkeit überleben oder sogar aussteigen werden. $game_concept_battle$ unversehrt.\n$cc_prowess_knight_desc$ \n\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_knight_desc_TOTO_DLC', 'game_concept_knight_desc_NO_TOTO_DLC' )][SelectLocalization( HasDlcFeature( 'accolades' ), 'game_concept_knight_desc_ACCOLADE_DLC', '' )]#weak Ritter können unter verschiedenen Namen bekannt sein, abhängig von [culture] or [faith]Zum Beispiel: $knight_champion_no_tooltip_plural$, $knight_faris_no_tooltip_plural$ or $knight_baghatur_no_tooltip_plural$.\n\nRitter repräsentieren sowohl den Charakter als auch ihr Gefolge von Truppen.#!"
 game_concept_martial_skill_desc:2 "$game_concept_martial$ [skill|E] zeigt an, wie gut ein Charakter beim Wetten ist [war|E] und führend [armies|E] in [battle|E].\n\nEine hohe Martial Skill ist wichtig für [army_commanders|E]da sie ihre [advantage|E] in [battle|E].\n\nDie entsprechenden [lifestyle|E] ist [martial_lifestyle|E]. $cc_martial_all_desc$"
 martial_effect_desc:0 "Erhöhungen [advantage|E] beim Kommandieren von Armeen im Kampf $cc_martial_commander_desc$"
 game_concept_unlanded_desc:0 "$game_concept_unlanded$ Charaktere haben keine [holdings|E] In ihrer [domain|E]kann aber theoretisch noch [rulers|E] von einer Art. Dies kann beispielsweise der Fall sein für [heads_of_faith|E] und die Großmeister der [holy_orders|E]. $cc_mechanic_unlanded_desc_1$"
 game_concept_barony_desc:0 "$game_concept_baronies$ sind die niedrigsten Ranglisten [titles|E] und haben den kleinsten Footprint auf der Karte, organisiert in größere [counties|E].\n\nBaronie Titel müssen immer eine [holder|E] Wenn sie eine [holding|E]. $cc_mechanic_unlanded_desc_2$"
 game_concept_county_desc:0 "A $game_concept_county$ is a [title|E] Rangfolge unter a [duchy|E] und oberhalb a [barony|E].\n\nDer Titel beinhaltet die [county_capital|E] in der Grafschaft sowie [de_jure|E] Rechte an allen Baronies in der Grafschaft.\n\nCounties haben immer [holders|E] Weil die Hauptstädte der Grafschaften nicht zerstört werden können. $cc_mechanic_unlanded_desc_3$"
 game_concept_duchy_desc:0 "A $game_concept_duchy$ is a [title|E] Rangfolge unter a [kingdom|E] und oberhalb a [county|E].\n\nDie [holder|E] Ein Herzogtum hat [de_jure|E] Rechte an seinen konstituierenden Counties und können Counts als [vassals|E].\n\nDuchies können ruhen und haben keinen aktuellen Holder. Solche Titel können von einem [ruler|E] der mindestens die Hälfte seiner Grafschaften kontrolliert. $cc_mechanic_unlanded_desc_4$"
 game_concept_kingdom_desc:0 "A $game_concept_kingdom$ is a [title|E] Rangfolge unter einem [empire|E] und oberhalb a [duchy|E].\n\nDie [holder|E] Ein Königreich hat [de_jure|E] Rechte auf sein konstituierendes Territorium und können Herzoge als [vassals|E].\n\nKönigreiche können ruhen und haben keinen aktuellen Holder. Solche Titel können von einem [ruler|E] Wer kontrolliert mindestens die Hälfte der Grafschaften innerhalb.$cc_mechanic_unlanded_desc_5$"
 game_concept_empire_desc:1 "$game_concept_empires$ Die höchste Rangliste [titles|E].\n\nDie [holder|E] Ein Imperium hat [de_jure|E] Rechte auf sein konstituierendes Territorium und können Könige als [vassals|E].\n\nImperien können ruhen und haben keinen aktuellen Holder. Solche Titel können von einem [ruler|E] die mehr als 80% der Counties innerhalb kontrolliert. $cc_mechanic_unlanded_desc_6$"
 game_concept_title_tier_desc:2 "Das Landäquivalent des Titels [rank|E], $game_concept_title_tier$ bestimmt die Position eines [title|E] Innerhalb der Hierarchie des Spiels.\n\nAlle Titel haben eine Stufe, die die höchstmögliche Stufe von [vassals|E] dass die [holder|E] können.\n\n[empire|E] > [kingdom|E] > [duchy|E] > [county|E] > [barony|E]. $cc_unlanded_all_desc$"
 bodyguard_employer_custom_effect_description:2 "Hat eine Chance, einen Mord zu verhindern [GetScheme('murder').GetTypeName] [schemes|E]#!\nReduziert ihr risiko zu sterben oder gefangen zu werden. [battles|E] Ihr kämpft beide in#! $cc_court_position_bodyguard_desc$"
 champion_employer_custom_effect_description:2 "Kann deinen Platz in einigen [single_combat_duel_plural|E]\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'champion_employer_custom_effect_description_TOTO_DLC', 'champion_employer_custom_effect_description_NO_TOTO_DLC' )] $cc_court_position_champion_desc$"
 trait_wounded_1_desc:0 "Dieser Charakter wurde verwundet, wird aber wahrscheinlich mit der Zeit gut heilen. $cc_trait_h_wounded$"
 trait_wounded_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] wurde verletzt, wird aber wahrscheinlich mit der gegebenen Zeit gut heilen. $cc_trait_h_wounded$"
 trait_one_eyed_desc:0 "Dieser Charakter hat nur ein Auge. $cc_trait_h_one_eyed$"
 trait_one_eyed_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] Es hat nur ein Auge. $cc_trait_h_one_eyed$"
 trait_disfigured_desc:0 "Dieser Charakter ist scheußlich entstellt. $cc_trait_h_disfigured$"
 trait_disfigured_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ist entstellt. $cc_trait_h_disfigured$"
 trait_one_legged_desc:0 "Dieser Charakter hat nur ein Bein. $cc_trait_h_one_legged$"
 trait_one_legged_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] Es hat nur ein Bein. $cc_trait_h_one_legged$"
 trait_wounded_2_desc:0 "Dieser Charakter wurde schwer verletzt, und der Weg zur Genesung könnte lang sein. $cc_trait_h_wounded_2$"
 trait_wounded_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] wurde schwer verletzt, und der Weg zur Genesung könnte lang sein. $cc_trait_h_wounded_2$"
 trait_wounded_3_desc:0 "Dieser Charakter ist gebrochen und klammert sich an das Leben. $cc_trait_h_wounded_3$"
 trait_wounded_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ist zerbrochen und klammert sich an das Leben. $cc_trait_h_wounded_3$"
 trait_maimed_desc:1 "Dieser Charakter wurde ernsthaft verstümmelt. $cc_trait_h_maimed$"
 trait_maimed_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] Er wurde ernsthaft verstümmelt. $cc_trait_h_maimed$"


