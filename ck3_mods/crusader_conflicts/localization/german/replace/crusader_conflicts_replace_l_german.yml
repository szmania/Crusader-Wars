 trait_aggressive_attacker_character_desc:0 "$cc_trait_aggressive_attacker$ Nichts wird satt [ROOT.GetCharacter.GetFirstNameNoTooltip] Aber das Blut von [ROOT.GetCharacter.GetHerHis] Feinde."
 trait_flexible_leader_character_desc:0 "$cc_trait_flexible_leader$[ROOT.GetCharacter.GetFirstNameNoTooltip] weiß, wie man den Vorteil, den verteidigende Armeen von Befestigungen, Gelände, Flüssen und Straßenübergängen erhalten, reduzieren kann."
 trait_forder_character_desc:1 "$cc_trait_forder$[ROOT.GetCharacter.GetFirstNameNoTooltip] ist zu Hause in der Nähe von Wasser und wird keine Vorteil Strafe in Schlachten beim Angriff über Geraden oder Flüsse erleiden."
 trait_holy_warrior_character_desc:0 "$cc_trait_holy_warrior$Verbrennen mit rechtschaffenem Eifer, [ROOT.GetCharacter.GetFirstNameNoTooltip] wird nicht ruhen, bis alle Heiden besiegt sind."
 trait_unyielding_defender_character_desc:0 "$cc_trait_unyielding_defender$[ROOT.GetCharacter.GetFirstNameNoTooltip] Eines weiß man vor allem: Das ist so weit, wie der Feind geht."
 trait_forest_fighter_character_desc:0 "$cc_trait_forest_fighter$Wo manche Wälder als Hindernisse sehen, [ROOT.GetCharacter.GetFirstNameNoTooltip] sieht Chancen."
 trait_open_terrain_expert_character_desc:0 "$cc_trait_open_terrain_expert$Offene Felder und weite Räume sind, wo [ROOT.GetCharacter.GetFirstNameNoTooltip] fühlt sich zu Hause, und sie sind schnell, um dies im Kampf zu nutzen."
 trait_rough_terrain_expert_character_desc:0 "$cc_trait_rough_terrain_expert$Schwieriges Gelände kann ein mächtiges Werkzeug für diejenigen sein, die es nutzen und im Kampf die Oberhand gewinnen können."
 trait_desert_warrior_character_desc:0 "$cc_trait_desert_warrior$Die bestrafende Sonne und die schlagende Hitze der Wüste sind kein Feind [ROOT.GetCharacter.GetFirstNameNoTooltip]."
 trait_jungle_stalker_character_desc:0 "$cc_trait_jungle_stalker$Der üppige Wald jedes Dschungels ist ein Verbündeter [ROOT.GetCharacter.GetFirstNameNoTooltip]."
 trait_winter_soldier_character_desc:0 "$cc_trait_winter_soldier$[ROOT.GetCharacter.GetFirstNameNoTooltip] wird durch die bittere Kälte geformt und weiß, wie man es an [ROOT.GetCharacter.GetHerHis] Vorteil."
 trait_logistician_character_desc:0 "$cc_trait_logistician$Wenn es eine Sache gibt [ROOT.GetCharacter.GetFirstNameNoTooltip] weiß, es ist, wie man Vorräte hält - und gut hält."
 trait_aggressive_attacker_desc:0 "$cc_trait_aggressive_attacker$Nichts wird einen aggressiven angreifer außer dem blut ihrer feinde sättigen."
 trait_flexible_leader_desc:0 "$cc_trait_flexible_leader$Dieser Charakter weiß, wie man den Vorteil, den verteidigende Armeen von Befestigungen, Gelände, Flüssen und Straßenübergängen erhalten, reduziert."
 trait_forder_desc:1 "$cc_trait_forder$Dieser Charakter ist in der Nähe des Wassers zu Hause und erleidet keine Vorteilsstrafe in Schlachten, wenn er über Geraden oder Flüsse angreift."
 trait_holy_warrior_desc:0 "$cc_trait_holy_warrior$Der Heilige Krieger, der vor rechtschaffener Inbrunst brennt, wird nicht ruhen, bis alle Heiden besiegt sind."
 trait_unyielding_defender_desc:0 "$cc_trait_unyielding_defender$Ein unnachgiebiger Verteidiger weiß vor allem eines: Das ist so weit wie der Feind geht."
 trait_forest_fighter_desc:0 "$cc_trait_forest_fighter$Wo manche Wälder als Hindernisse sehen, sieht dieser Charakter Chancen."
 trait_open_terrain_expert_desc:1 "$cc_trait_open_terrain_expert$Offene Felder und weite Räume sind, wo sich dieser Charakter zu Hause fühlt, und sie sind schnell, um dies im Kampf zu nutzen."
 trait_rough_terrain_expert_desc:0 "$cc_trait_rough_terrain_expert$Schwieriges Gelände kann ein mächtiges Werkzeug für diejenigen sein, die es nutzen und im Kampf die Oberhand gewinnen können."
 trait_desert_warrior_desc:0 "$cc_trait_desert_warrior$Die bestrafende Sonne und die schlagende Hitze der Wüste sind kein Feind dieses Charakters."
 trait_jungle_stalker_desc:0 "$cc_trait_jungle_stalker$Der üppige Wald jedes Dschungels ist ein Verbündeter dieses Charakters."
 trait_winter_soldier_desc:0 "$cc_trait_winter_soldier$Dieser Charakter wird von der bitteren Kälte geformt und weiß, wie man ihn zu ihrem Vorteil macht."
 trait_logistician_desc:0 "$cc_trait_logistician$Wenn es eine Sache gibt, die der Logistiker weiß, dann ist es, wie man Vorräte hält - und gut hält."
