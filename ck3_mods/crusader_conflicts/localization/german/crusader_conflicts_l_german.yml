l_german:
 game_concept_crusader_conflicts:0 "Kreuzfahrerkonflikte"
 game_concept_crusader_conflicts_desc:0 "$game_concept_crusader_conflicts$ ist ein Mod, mit dem du deine Cursader Kings III-Schlachten in Attila: Total War spielen kannst. Klicken Sie auf die Swords-Taste im Battle-Interface, um die Schlacht in Attila: Total War zu beginnen."
 game_concept_crusader_conflicts_2:0 "CC"
 game_concept_cc_soldiers:0 "[crusader_conflicts_2|E] Soldaten"
 game_concept_cc_soldiers_desc:0 "Die Soldaten der Kreuzfahrerkonflikte sind die Anzahl der Soldaten, die einer Einheit in Attila: Total War hinzugefügt werden."
 game_concept_cc_experience:0 "[crusader_conflicts_2|E] Flache Erfahrung"
 game_concept_cc_experience_desc:0 "Crusader Conflicts Flat Experience ist die Erfahrung, die der Einheitserfahrung in Attila hinzugefügt wird: Total War."
 game_concept_cc_experience_modifier:0 "[crusader_conflicts_2|E] Erfahrungsmodifikator"
 game_concept_cc_experience_modifier_desc:0 "Der Crusader Conflicts Experience Modifier multipliziert die Erfahrung einer Units Experience in Attila: Total War."
 game_concept_cc_general_unit:0 "Generaleinheit"
 game_concept_cc_general_unit_desc:0 "Die Einheit des Generals ist die Einheit, die Ihren Kommandanten in Ihrer Armee in Attila: Total War begleiten wird."
 game_concept_cc_knight_unit:0 "Rittereinheit"
