	cc_op_about_hsub_um: "Wie es funktioniert:\n\n\n\n#i Vorgeschrieben:#!\n\n\n\n#i #high Fakultativ:#! #!\n\n#X Nicht unterstützt:#!"
	cc_op_about_desc_um: "#high Kreuzfahrerkonflikte#! Lesen Sie in Details über die Schlacht Sie #high Kreuzritterkönige 3#! Der Charakter ist involviert und wandelt das in eine #high Total War: Attila Schlacht#! die Sie direkt kontrollieren können. Levies, Men-at-Arms und Knights werden in Total War: Attila in gleichwertige Einheiten umgewandelt. Für detaillierte Informationen, wie die Einheiten umgewandelt werden, siehe die #clickable Troop durch Kultur#! Laschen.\n\n#i Steam-Versionen von Crusader Kings 3, Total War: Attila, Attila DLC - Age of Charlemagne\nAbonniert auf Crusader Conflicts mod für BEIDE Crusader Kings 3 und Total War: Attila\nCrusader Conflicts mod standalone Anwendung #!\n\n#i #high Total War: Attila mod - 1212 AD (Modellpacks 1-8)#! #!- für zusätzliche kulturelle Einheiten#!\n\n#X 1212 AD Scripts Modul - abonnieren Sie nicht diesen bestimmten Teil des 1212 AD Mods#!"
	cc_op_help_hsub_um: "Hilfe FAQ:\n\n\n\n\n\n\nHaben Sie Fragen? Brauchen Sie Hilfe?"
	cc_op_help_desc_um: "#high Attila Schlachten laufen schlecht/lags!#! Senken Sie Ihre Grafikoptionen in Attila, senken Sie die #clickable Battle Scale#! Optionen. Stellen Sie außerdem sicher, dass Crusader Kings 3 vollständig im Hintergrund ausgesetzt ist.\n#high Attila Schlachten Einheitsnummern stimmen nicht überein #clickable Größe der Einheit #!Optionen!#! - Überprüfen Attila Grafikoption für UNIT SIZE ist auf ULTRA eingestellt. Niedriger als ULTRA führt zu kleineren Einheiten.\n#high Attila stürzt beim Versuch zu laden!#! - Überprüfen Sie, ob Sie den 1212 AD Scripts Mod NICHT verwenden.\n#high Ein Klick auf den Play Battle Button tut nichts!#! - Überprüfen Sie, ob Sie CK3 über die CrusaderConflicts starten. Wenn Sie auf das Center Flag-Symbol klicken, starten Sie CK3 nicht manuell von Steam.\n#high Warum kann ich einige Schlachten nicht kontrollieren!#! Manuelle Schlachten sind nur verfügbar, wenn der Spielercharakter die Armee persönlich kommandiert.\n\n#high Dissonanz - #! https://discord.gg/eFZTprHh3j"
	cc_op_thank_hsub_um: "1212-AD-Mod-Team"
	cc_op_thank_desc_um: "Um einen wahnsinnig expansiven mittelalterlichen Mod für Attila zu machen, damit wir relevantere Einheiten verwenden können!"
