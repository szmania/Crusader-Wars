	#
	### Event/Alert Window button texts ###
	ccalert.1.title: "Kreuzfahrerkonflikte Benachrichtigung | \"Lebensqualität\" Pre-Beta | März 2024"
	ccalert.1.desc: "#high Der Mod aktualisiert auf v0.9.11 \"Qaulity of Life!\", aktualisieren Sie Ihren Crusader Conflicts Launcher jetzt, wenn Sie dies nicht getan haben, um Fehler zu vermeiden.\n\nDer Crusader Conflict Launcher ist #high getrennt #! aus dem Steam Workshop CK3 mod. Steam aktualisiert automatisch die CK3-Moddatei, Steam jedoch #high NICHT #! Aktualisieren Sie den CrusaderConflicts.exe Launcher automatisch. Sie müssen CK3 mindestens einmal öffnen und dann den CC Launcher gehen und aktualisieren, wenn Sie es nicht öffnen, wird der Launcher kein Update erkennen!\n\n#X Wenn Sie den aktualisierten Launcher nicht herunterladen, werden Ihre Attila-Schlachten abstürzen. Sie wurden gewarnt."
 	ccalert.1.a: "Ich werde Crusader Conflicts Launcher jetzt aktualisieren!"
