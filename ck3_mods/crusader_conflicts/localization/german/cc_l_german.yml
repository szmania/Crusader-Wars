	### About Mod tab texts ###
	cc_op_tab1_desc: "Crusader Conflicts Mod Optionen derzeit nur verfügbar in #high Englisch#! Lokalisierung."
	cc_op_page1_desc: "#clickable Mod-Details"
	cc_op_about_head: "Über Mod"
	cc_op_about_hsub: "Wie es funktioniert:\n\n\n\n#i Vorgeschrieben:#!\n\n\n\n#i #high Unit Mapper:#! #!\n\n\n#X Nicht unterstützt:#!"
	cc_op_about_desc: "#high Kreuzfahrerkonflikte#! Lesen Sie in Details über die Schlacht Sie #high Kreuzritterkönige 3#! Der Charakter ist involviert und wandelt das in eine #high Total War: Attila Schlacht#! die Sie direkt kontrollieren können. Levies, Men-at-Arms und Knights werden in Total War: Attila in gleichwertige Einheiten umgewandelt. Für detaillierte Informationen, wie die Einheiten umgewandelt werden, siehe die #clickable Troop durch Kultur#! Laschen.\n\n#i Crusader Conflicts mod standalone Anwendung\nSteam-Versionen von Crusader Kings 3, Total War: Attila, Attila DLC - Age of Charlemagne#!\n\n#i #high Auf diese Weise weiß der Mod, welche Einheiten auf Attila verwendet werden sollen. Jeder hat Mods / DLCs benötigt, die Sie aktivieren müssen, wenn der Unit Mapper geladen wird. Ihre Struktur besteht im Wesentlichen darin, Kulturen und Erbenamen einer Gruppe von Einheiten der Mods/DLCs zuzuweisen.#!\n\n#X 1212 AD Scripts Modul - abonnieren Sie nicht diesen bestimmten Teil des 1212 AD Mods\nCultural Armies Pack - CK3 mod#!"
	cc_op_help_head: "Hilfe & Community"
	cc_op_help_hsub: "Hilfe FAQ:\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nHaben Sie Fragen? Brauchen Sie Hilfe?"
	cc_op_help_desc: "#high Attila battles run poorly/lags!#! - Lower your graphics options in Attila, lower the #clickable Battle Scale#! options. Battles above 20k/40k will stutter.\n#high Attila battles unit numbers don't match #clickable Unit Size #!options!#! - Review Attila graphics option for UNIT SIZE is set to ULTRA. Lower than ULTRA will result in smaller units.\n#high Attila crashes when trying to load!#! - You either didn't enabled the correct mods for the loaded unit mapper, or, the loaded unit mapper has a unit key incorrect, that it's present on the battle.\n#high Clicking the Play Battle Button does nothing!#! - Review that Crusader Conflicts Launcher is up and running, by clicking the center flag icon.\n#high Why can't I control some battles!#! - You have to go to #clickable Preferences#! , and choose the desired characters that can fight. This is the only option that you need to set after every battle and when ck3 starts.\n#high Inaccurate battle results!#! - After you win a battle, there is no point of running down troops, their casualities will not count.\n#high I can't find CrusaderConflicts.pack!#! - CrusaderConflicts.pack gets remade every battle, you don't need to subscribe to anything, it should be a the bottom of your mod list.\n#high After battle loading is too slow!#! - For this we recommend to delete CrusaderConflicts_Battle save from time to time.\n#high Attila units are not from my culture!#! - The culture of the units is based on the commander culture, so if you have a commander that is not from your culture, the units will be of his culture.\n\n#high Discord - https://discord.gg/eFZTprHh3j"
	cc_op_thank_head: "Bestätigungen"
	cc_op_thank_hsub: "Aus den Kreuzfahrerkonflikten Devs.."
	cc_op_thank_desc: "Wir gratulieren jedem ck3 und totalen Kriegsmodder, dass er uns die Möglichkeit gegeben hat, ihre Mods mit unseren zu verwenden und absolute historisch korrekte Einheiten zu haben! Wir verändern die Modding-Industrie zum Besseren! Wir möchten uns auch bei der Community und unseren Patreon-Unterstützern bedanken, danke, dass Sie an unser Projekt glauben, wir lieben Sie so sehr!"
	#
	### Troops by Culture conversions for both default attila and with 1212 AD HEADERS ### 
	cc_op_page2_desc: "#clickable Truppen nach Kultur (Standard)"
	cc_op_page3_desc: "#clickable Truppen nach Kultur mit 1212 AD (optional)"
	#
	### Battle Scale tab texts ###
	cc_op_tab2_desc: "Anpassungen für insgesamt [battle|E] Größe, verwendet, um die Leistung gegenüber dem Umfang manueller Schlachten zu verwalten.\n\n#high Beeinflusst nur manuelle Schlachten, die in Total War: Attila kontrolliert werden. Keine Auswirkungen auf normale Kreuzritterkönige 3 Schlachten.#!"
	cc_op_scale_head: "Insgesamt Battle Size Scale"
	cc_op_scale_desc: "Skalierung von Crusader Kings 3 [army|E] Total War: Attila Schlachten. Wird verwendet, um die Leistung auf unteren Maschinen für die manuellen Schlachten zu erhöhen.\n\nWenn diese Option auf 50% eingestellt ist, wird sie eine Schlacht von Crusader Kings 3 mit insgesamt 40.000 umwandeln. [soldiers|E] In einen Totalen Krieg: Attila Schlacht von 20.000. Alle Einheitentypen werden gleichermaßen skaliert.\n\n#high Standardwert ist 100% #!\n#i Verringern, um die Kampfleistung zu verbessern#!"
	cc_op_automax_head: "Auto-Skala jenseits des maximalen Kampflimits"
	cc_op_automax_desc: "Wenn aktiviert, a [battle|E] Das übertrifft die #high Maximales Battle Limit#! of [soldiers|E] wird automatisch auf das in #high Maximales Battle Limit#!Wird verwendet, um massive, große Endspielschlachten zu bewältigen, die Total War: Attila zum Absturz bringen würden.\n\n#high Standardwert ist aktiviert #!\n#X Deaktivieren dieser Option kann zu Abstürzen führen"
	cc_op_max_head: "Maximales Battle Limit"
	cc_op_max_desc: "Wenn Auto Scale aktiviert ist - a [battle|E] die diese Menge von [soldiers|E] wird bis zu diesem Limit verkleinert. Wird verwendet, um große, ende spielschlachten zu verwalten.\n\nWenn diese Option auf 20.000 eingestellt ist, konvertiert sie eine Schlacht der Kreuzritterkönige 3 mit 40.000 [soldiers|E] Total War: Attila Schlacht von 20.000 Soldaten. Alle Einheitentypen werden gleichermaßen skaliert.\n\N#high Total War: Attila muss auf ULTRA Einheitsgröße eingestellt sein, damit Schlachten genau diesen Wert verwenden.#! Wenn die Einheitsgröße unter ULTRA liegt, kann Ihre Anzahl von Männern pro Einheit im Kampf reduziert werden.\n\n#high Standardwert ist 40.000#!\n#i Verringern, um die Kampfleistung zu verbessern#!"
	#
	### Unit Size tab texts ###
	cc_op_tab3_desc: "In Crusader Conflicts Schlachten alle [soldiers|E] von teilnehmenden Armeen werden durch einzelne Einheiten vertreten, die kontrolliert werden können. Folgende: [regiments|E] Typen können ihre Einheitsgröße angepasst haben.\n\n#high Nicht standardmäßige Optionen wirken sich auf das Gleichgewicht aus, was Schlachten einfacher oder schwieriger machen kann."
	cc_op_unit1_head: "Stückgröße der Abgaben"
	cc_op_unit1_desc: "[levies|E] werden im Kampf durch eine Mischung von Einheiten dargestellt. In Kreuzfahrerkonflikten werden die meisten Kulturen ihre Abgaben als 65% leichte Speereinheiten, 10% leichte Einheiten und 25% mittlere Infanterieeinheiten erheben. Bestimmte Kulturen haben Unterschiede.\n\N#high Total War: Attila muss auf ULTRA Einheitsgröße eingestellt sein, damit Schlachten genau diesen Wert verwenden.#! Wenn die Einheitsgröße unter ULTRA liegt, kann Ihre Anzahl von Männern pro Einheit im Kampf reduziert werden.\n\n#high Standardwert ist 200 #!"
	cc_op_unit2_head: "Melee Men-at-Arms Einheitsgröße"
	cc_op_unit2_desc: "Melee [men_at_arms|E] Regimenter sind Soldaten mit verbesserter Rüstung, Waffen und Ausbildung im Vergleich zu Abgaben. Diese Truppen werden durch Einheiten dargestellt, die mit Nahkampfwaffen wie Schwertern, Äxten, Speeren oder Hechten kämpfen.\n\n[regiment|E] Arten von [spearmen|E], [skirmishers|E], und [heavy_infantry|E] Verwenden Sie diese Einheitsgröße im Kampf.\n\N#high Total War: Attila muss auf ULTRA Einheitsgröße eingestellt sein, damit Schlachten genau diesen Wert verwenden.#! Wenn die Einheitsgröße unter ULTRA liegt, kann Ihre Anzahl von Männern pro Einheit im Kampf reduziert werden.\n\n#high Standardwert ist 200 #!"
	cc_op_unit3_head: "Ranged Men-at-Arms Einheit Größe"
	cc_op_unit3_desc: "Range [men_at_arms|E] Regimenter sind Soldaten mit verbesserter Rüstung, Waffen und Ausbildung im Vergleich zu Abgaben. Diese Truppen werden durch Einheiten dargestellt, die mit Fernkampfwaffen wie Bögen, Armbrüsten, Schlingen oder Javelins kämpfen.\n\n[regiment|E] Arten von [archers|E] Verwenden Sie diese Einheitsgröße im Kampf.\n\N#high Total War: Attila muss auf ULTRA Einheitsgröße eingestellt sein, damit Schlachten genau diesen Wert verwenden.#! Wenn die Einheitsgröße unter ULTRA liegt, kann Ihre Anzahl von Männern pro Einheit im Kampf reduziert werden.\n\n#high Standardwert ist 200 #!"
	cc_op_unit4_head: "Kavallerie Men-at-Arms Einheit Größe"
	cc_op_unit4_desc: "Kavallerie [men_at_arms|E] Regimenter sind Soldaten mit Reittieren wie Pferden oder Kamelen, verbesserter Rüstung, Waffen und Ausbildung im Vergleich zu Abgaben. Diese Truppen werden durch Einheiten dargestellt, die von Reittieren aus mit Fernkampf- und Nahkampfwaffen kämpfen.\n\n[regiment|E] Arten von [light_cavalry|E] und [heavy_cavalry|E] Verwenden Sie diese Einheitsgröße im Kampf.\n\n#high Standardwert ist 100 #!"
	cc_op_unit5_head: "loc Siege Men-at-Arms Einheitsgröße"
	cc_op_unit5_desc: "loc Beschreibung darüber, wie Belagerungswaffen aufgeteilt werden. Vielleicht braucht das nie\n\n#high Standardwert ist 100 #!"
	#
	### Prefs & Battle Rules tab texts ###
	cc_op_tab4_desc: "Spezifische Optionen, um verschiedenen Arten von Armeekommandanten die direkte Kontrolle in Atilla zu ermöglichen\n\n#high Standardwerte werden für erstmalige Benutzer des Mods dringend empfohlen. #!"
	cc_op_control1_head: "Direkte Schlachtkontrolle"
	cc_op_control1_desc: "Die [commander|E] bestimmt, welche Schlachten in Attila direkt kontrolliert werden können.\n\nSpielercharakter Bietet nur eine balance zwischen risiko und belohnung und passt zum vanilla ck3-rollenspielerlebnis.\nSpieler & Marshal erlaubt Ihnen auch [marshal|E] direkte Kampfkontrolle zu übernehmen.\nAll Dynasty wird jedem Mitglied Ihrer [dynasty|E] direkte Kampfkontrolle zu übernehmen.\nAlle Charaktere erlauben jeden Charakter, den Sie als [commander|E] direkte Kampfkontrolle zu übernehmen.\n\n#high Standardwert ist Player Character Only #!\n\n#X Nicht standardmäßige Optionen reduzieren die Schwierigkeit Ihrer Crusader Kings 3-Kampagne erheblich"
	cc_op_unitnames_head: "Direct Battle Unit Namen"
	cc_op_unitnames_desc: "Wollen Sie, dass Einheitsnamen verrückt oder standardisiert sind, wie die CK3 Männer bei Waffennamen generalisieren?\n\n#high Standardwert ist Flavorful Unit Names #!\n\n#X Verwenden Sie Flavorful Unit Names, wenn Sie eine CK3-Überholung wie AGOT oder einen Mod verwenden, der die Men At Arms-Namen in Crusader Kings 3 anpasst"
	
	#
