	cc_op_tab5_desc: "\"détails sur la cartographie unitaire, à la fois par défaut et la compatibilité CK3 mod\"."
	cc_op_tab5_default: "#clickable Les troupes de la culture (défauts)"
	cc_op_tab5_compatmods: "#clickable Les troupes par culture (Modifications compatibles)"
	cc_op_tab5_custom: "#clickable Les troupes par culture (sur mesure)"
	cc_op_about_hsub_um: "Comment ça marche :\n\n\n\n#i Requis :#!\n\n\n\n#i #high Facultatif:#! #!\n\n#X Non soutenu :#!"
	cc_op_about_desc_um: "#high Conflits croisés#! lit dans les détails sur la bataille vous #high Rois croisés 3#! caractère est impliqué et convertit cela en un #high Total Guerre: bataille d'Attila#! que vous pouvez contrôler directement. Les Lévis, les hommes d'armes et les chevaliers sont convertis en unités équivalentes dans Total War: Attila. Pour des informations détaillées sur la façon dont les unités sont converties, voir #clickable Troop par culture#! les onglets.\n\n#i Version à vapeur des Rois croisés 3, Guerre totale : Attila, Attila DLC - Age de Charlemagne\nS'abonner au mod Conflits croisés pour les deux Rois croisés 3 ET Total Guerre: Attila\nCrusader Conflits mod application autonome #!\n\n#i #high Total War: Attila mod - 1212 AD (modèle packs 1-8)#! #!- pour les unités culturelles supplémentaires#!\n\n#X 1212 AD Scripts module - ne pas s'abonner à cette partie particulière du 1212 AD mod#!"
	cc_op_help_hsub_um: "Aide FAQ :\n\n\n\n\n\n\nVous avez des questions ? Besoin d'aide ?"
	cc_op_help_desc_um: "#high Les batailles d'Attila se déroulent mal et mal !#! - Baissez vos options graphiques dans Attila, #clickable Échelle de bataille#! options. Assurez-vous également que les Rois croisés 3 sont complètement suspendus en arrière-plan.\n#high Les numéros des unités de combat d'Attila ne correspondent pas #clickable Taille unitaire #!Les options !#! - Examen Attila option graphique pour UNIT SIZE est défini à ULTRA. Moins que l'ULTRA se traduira par des unités plus petites.\n#high Attila s'écrase en essayant de charger !#! - Passez en revue que vous n'utilisez PAS le 1212 AD Scripts mod.\n#high Cliquer sur le bouton Play Battle ne fait rien !#! - Passez en revue que vous lancez CK3 via les CrusaderConflitts. Exe en cliquant sur l'icône du drapeau central, ne lancez pas manuellement CK3 de Steam.\n#high Pourquoi je ne peux pas contrôler certaines batailles !#! - Les batailles manuelles ne sont disponibles que lorsque le joueur commande personnellement l'armée.\n\n#high Discorde #! https://discord.gg/eFZTprHh3j"
	cc_op_thank_hsub_um: "1212 AD Mod Équipe"
	cc_op_thank_desc_um: "Pour faire un mod médiéval incroyablement expansif pour Attila afin que nous puissions utiliser des unités plus pertinentes!"
