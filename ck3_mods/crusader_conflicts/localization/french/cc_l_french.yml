	### About Mod tab texts ###
	cc_op_tab1_desc: "Conflits croisés Mod Options actuellement disponibles seulement en #high changements climatiques#! localisation."
	cc_op_page1_desc: "#clickable Mod Détails"
	cc_op_about_head: "À propos de Mod"
	cc_op_about_hsub: "Comment ça marche :\n\n\n\n#i Requis :#!\n\n\n\n#i #high Cartes unitaires:#! #!\n\n\n#X Non soutenu :#!"
	cc_op_about_desc: "#high Conflits croisés#! lit dans les détails sur la bataille vous #high Rois croisés 3#! caractère est impliqué et convertit cela en un #high Total Guerre: bataille d'Attila#! que vous pouvez contrôler directement. Les Lévis, les hommes d'armes et les chevaliers sont convertis en unités équivalentes dans Total War: Attila. Pour des informations détaillées sur la façon dont les unités sont converties, voir #clickable Troop par culture#! les onglets.\n\n#i Crusader Conflits mod application autonome\nVersion à vapeur des Rois croisés 3, Guerre totale : Attila, Attila DLC - Age de Charlemagne#!\n\n#i #high C'est ainsi que le mod sait quelles unités utiliser sur Attila. Chacun d'eux a besoin de mods/DLC, que vous devez activer lorsque le mapper unitaire est chargé. Leur structure consiste essentiellement à attribuer des noms de cultures et de patrimoines à un groupe d'unités des mods/dlc.#!\n\n#X 1212 AD Scripts module - ne pas s'abonner à cette partie particulière du 1212 AD mod\nPack Armies Culturelles - CK3 mod#!"
	cc_op_help_head: "Aide & Communauté"
	cc_op_help_hsub: "Aide FAQ :\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nVous avez des questions ? Besoin d'aide ?"
	cc_op_help_desc: "#high Attila battles run poorly/lags!#! - Lower your graphics options in Attila, lower the #clickable Battle Scale#! options. Battles above 20k/40k will stutter.\n#high Attila battles unit numbers don't match #clickable Unit Size #!options!#! - Review Attila graphics option for UNIT SIZE is set to ULTRA. Lower than ULTRA will result in smaller units.\n#high Attila crashes when trying to load!#! - You either didn't enabled the correct mods for the loaded unit mapper, or, the loaded unit mapper has a unit key incorrect, that it's present on the battle.\n#high Clicking the Play Battle Button does nothing!#! - Review that Crusader Conflicts Launcher is up and running, by clicking the center flag icon.\n#high Why can't I control some battles!#! - You have to go to #clickable Preferences#! , and choose the desired characters that can fight. This is the only option that you need to set after every battle and when ck3 starts.\n#high Inaccurate battle results!#! - After you win a battle, there is no point of running down troops, their casualities will not count.\n#high I can't find CrusaderConflicts.pack!#! - CrusaderConflicts.pack gets remade every battle, you don't need to subscribe to anything, it should be a the bottom of your mod list.\n#high After battle loading is too slow!#! - For this we recommend to delete CrusaderConflicts_Battle save from time to time.\n#high Attila units are not from my culture!#! - The culture of the units is based on the commander culture, so if you have a commander that is not from your culture, the units will be of his culture.\n\n#high Discord - https://discord.gg/eFZTprHh3j"
	cc_op_thank_head: "Remerciements"
	cc_op_thank_hsub: "Des conflits croisés Devs.."
	cc_op_thank_desc: "Nous félicitons tous les modders de guerre, pour nous avoir donné la possibilité d'utiliser leurs mods avec les nôtres et d'avoir des unités absolues historiquement précises ! Nous changeons l'industrie de la mouture pour le mieux! Nous tenons également à remercier la communauté et nos partisans du patréon, merci de croire en notre projet, nous vous aimons tellement!."
	#
	### Troops by Culture conversions for both default attila and with 1212 AD HEADERS ### 
	cc_op_page2_desc: "#clickable Les troupes de la culture (par défaut)"
	cc_op_page3_desc: "#clickable Troupes par culture avec 1212 AD (facultatif)"
	#
	### Battle Scale tab texts ###
	cc_op_tab2_desc: "Ajustements globaux [battle|E] taille, utilisé pour gérer la performance par rapport à la portée des batailles manuelles.\n\n#high Seulement impacts batailles manuelles contrôlées dans Total War: Attila. Pas d'impact sur les batailles normales des Rois croisés.#!"
	cc_op_scale_head: "Taille globale de la bataille"
	cc_op_scale_desc: "Échelle globale des Rois croisés 3 [army|E] total à Total War: Attila batailles. Utilisé pour aider à augmenter les performances sur les machines inférieures pour les batailles manuelles.\n\nQuand elle est fixée à 50%, cette option convertira une bataille des Rois croisés 3 avec un total de 40 000 [soldiers|E] dans une guerre totale: Attila bataille de 20 000. Tous les types d'unités seront mis à l'échelle égale.\n\n#high La valeur par défaut est 100% #!\n#i Diminution pour améliorer les performances de combat#!"
	cc_op_automax_head: "Échelle automatique au-delà de la limite maximale de combat"
	cc_op_automax_desc: "Si activé, [battle|E] qui dépasse #high Limite maximale de combat#! of [soldiers|E] sera automatiquement réduit à la limite fixée dans #high Limite maximale de combat#!. Utilisé pour aider à gérer des batailles massives, grandes, de fin de jeu qui s'écraseraient Total War: Attila.\n\n#high La valeur par défaut est activée #!\n#X Désactiver cette option peut causer des accidents"
	cc_op_max_head: "Limite maximale de combat"
	cc_op_max_desc: "Lorsque l'échelle automatique est activée - un [battle|E] qui dépassent ce montant de [soldiers|E] sera réduit à cette limite. Utilisé pour aider à gérer de grandes batailles de fin de jeu.\n\nQuand elle sera fixée à 20 000 cette option convertira une bataille des Rois croisés 3 avec 40 000 [soldiers|E] jusqu'à une guerre totale: Attila bataille de 20 000 soldats. Tous les types d'unités seront mis à l'échelle égale.\n\N#high Total War: Attila doit être réglé à la taille de l'unité ULTRA pour que les batailles utilisent cette valeur exacte.#! Si la taille de l'unité est inférieure à ULTRA, votre nombre d'hommes par unité peut être réduit au combat.\n\n#high La valeur par défaut est de 40 000#!\n#i Diminution pour améliorer les performances de combat#!"
	#
	### Unit Size tab texts ###
	cc_op_tab3_desc: "Dans les conflits croisés [soldiers|E] des armées participantes sont représentées par des unités individuelles pouvant être contrôlées. Voici [regiments|E] Les types peuvent avoir leur taille unitaire ajustée.\n\n#high Les options non par défaut affecteront l'équilibre de la bataille, ce qui peut rendre les batailles plus faciles ou plus difficiles."
	cc_op_unit1_head: "Taille de l'unité de prélèvement"
	cc_op_unit1_desc: "[levies|E] sont représentés au combat par un mélange d'unités. Dans les conflits croisés, la plupart des cultures implanteront leurs prélèvements sous forme d'unités de lance légère de 65 %, d'unités de 10 % et d'unités d'infanterie moyenne de 25 %. Certaines cultures ont des différences.\n\N#high Total War: Attila doit être réglé à la taille de l'unité ULTRA pour que les batailles utilisent cette valeur exacte.#! Si la taille de l'unité est inférieure à ULTRA, votre nombre d'hommes par unité peut être réduit au combat.\n\n#high La valeur par défaut est 200 #!"
	cc_op_unit2_head: "Taille de l'unité pour hommes aux armes"
	cc_op_unit2_desc: "Mélanie [men_at_arms|E] régiments sont des soldats avec des armures, des armes et de l'entraînement améliorés par rapport aux prélèvements. Ces troupes sont représentées par des unités qui se battent à l'aide d'armes comme des épées, des haches, des lances ou des piques.\n\n[regiment|E] types de [spearmen|E], [skirmishers|E]et [heavy_infantry|E] Utilisez cette taille d'unité au combat.\n\N#high Total War: Attila doit être réglé à la taille de l'unité ULTRA pour que les batailles utilisent cette valeur exacte.#! Si la taille de l'unité est inférieure à ULTRA, votre nombre d'hommes par unité peut être réduit au combat.\n\n#high La valeur par défaut est 200 #!"
	cc_op_unit3_head: "Taille de l'unité pour hommes aux armes"
	cc_op_unit3_desc: "Étendu [men_at_arms|E] régiments sont des soldats avec des armures, des armes et de l'entraînement améliorés par rapport aux prélèvements. Ces troupes sont représentées par des unités qui combattent à l'aide d'armes variées telles que arcs, arbalètes, élingues ou javelines.\n\n[regiment|E] types de [archers|E] Utilisez cette taille d'unité au combat.\n\N#high Total War: Attila doit être réglé à la taille de l'unité ULTRA pour que les batailles utilisent cette valeur exacte.#! Si la taille de l'unité est inférieure à ULTRA, votre nombre d'hommes par unité peut être réduit au combat.\n\n#high La valeur par défaut est 200 #!"
	cc_op_unit4_head: "Taille de l'unité"
	cc_op_unit4_desc: "Cavalerie [men_at_arms|E] Les régiments sont des soldats avec des montures telles que des chevaux ou des chameaux, des armures améliorées, des armes et des entraînements par rapport aux prélèvements. Ces troupes sont représentées par des unités qui combattent à partir de montures utilisant à la fois des armes variées et des armes de mêlée.\n\n[regiment|E] types de [light_cavalry|E] et [heavy_cavalry|E] Utilisez cette taille d'unité au combat.\n\n#high La valeur par défaut est 100 #!"
	cc_op_unit5_head: "Taille de l'unité"
	cc_op_unit5_desc: "loc Description sur la façon dont les armes de siège sont divisées. n'en aura peut-être jamais besoin\n\n#high La valeur par défaut est 100 #!"
	#
	### Prefs & Battle Rules tab texts ###
	cc_op_tab4_desc: "Options spécifiques permettant à différents types de commandants de l'Armée d'assumer le contrôle direct à Atilla\n\n#high Les valeurs par défaut sont fortement recommandées pour les premiers utilisateurs du mod. #!"
	cc_op_control1_head: "Contrôle direct de la bataille"
	cc_op_control1_desc: "Les [commander|E] détermine quelles batailles peuvent être directement contrôlées à Attila.\n\nCaractère du joueur Seulement offre un équilibre de risque vs récompense et s'adapte à l'expérience de jeu de rôle CK3 vanille.\nLe joueur & Marshal permettra également votre [marshal|E] d'assumer le contrôle direct de la bataille.\nToute Dynastie permettra à tout membre de votre [dynasty|E] d'assumer le contrôle direct de la bataille.\nTous les caractères permettront tout caractère que vous appelez comme [commander|E] d'assumer le contrôle direct de la bataille.\n\n#high La valeur par défaut est le caractère du joueur seulement #!\n\n#X Les options non par défaut réduiront considérablement la difficulté de votre campagne Crusader Kings 3"
	cc_op_unitnames_head: "Noms des unités de combat directe"
	cc_op_unitnames_desc: "Voulez-vous que les noms d'unités soient fous ou normalisés comme les CK3 généraliser les hommes aux noms d'armes?\n\n#high La valeur par défaut est le nom de l'unité parfumée #!\n\n#X Utilisez des noms d'unités parfumés si vous utilisez une révision CK3 comme AGOT, ou un mod qui ajuste les noms d'hommes aux armoiries dans Crusader Kings 3"
	
	#
