	#
	### Event/Alert Window button texts ###
	ccalert.1.title: "Notification des conflits croisés \"Qualité de vie\" Pré-Bêta"
	ccalert.1.desc: "#high Le mod mis à jour à v0.9.11 \"Quaulité de la vie!\", mettre à jour votre Crusader Conflicts Launcher maintenant si vous n'avez pas, pour éviter les bugs.\n\nLe lanceur Crusader Conflicts est #high séparé #! de l'atelier de vapeur CK3 mod. Steam mettra automatiquement à jour le fichier CK3 mod, mais Steam le fait #high PAS #! mettre automatiquement à jour le lanceur CrusaderConflitts.exe. Vous devez ouvrir CK3 au moins une fois, puis aller au CC Launcher et mettre à jour, si vous ne l'ouvrez pas, le lanceur ne détectera aucune mise à jour!.\n\n#X Si vous ne téléchargez pas le lanceur mis à jour, vos batailles d'Attila s'écraseront. Vous avez été prévenu."
 	ccalert.1.a: "Je vais mettre à jour Crusader Conflicts Launcher maintenant!"
