# ===========================================================================
# Crusader Conflicts sync: missing keys copied verbatim from localization\english
# (English fallback values; translators may replace the values in place later).
# ===========================================================================
 trait_aggressive_attacker_character_desc:0 "$cc_trait_aggressive_attacker$Rien ne peut rassasier [ROOT.GetCharacter.GetFirstNameNoTooltip] si ce n'est le sang de [ROOT.GetCharacter.GetHerHis] ennemis."
 trait_flexible_leader_character_desc:0 "$cc_trait_flexible_leader$[ROOT.GetCharacter.GetFirstNameNoTooltip] sait réduire l'avantage que procurent fortifications, terrains, rivières et passages à gué aux armées défensives."
 trait_forder_character_desc:1 "$cc_trait_forder$[ROOT.GetCharacter.GetFirstNameNoTooltip] est à l'aise près de l'eau et ne subit aucun malus d'avantage en attaquant à travers des détroits ou des rivières."
 trait_holy_warrior_character_desc:0 "$cc_trait_holy_warrior$Brûlant d'un zèle fervent, [ROOT.GetCharacter.GetFirstNameNoTooltip] ne se reposera pas avant d'avoir vaincu tous les Impies."
 trait_unyielding_defender_character_desc:0 "$cc_trait_unyielding_defender$[ROOT.GetCharacter.GetFirstNameNoTooltip] sait une chose par-dessus tout : l'ennemi s'arrête ici."
 trait_forest_fighter_character_desc:0 "$cc_trait_forest_fighter$Où certains voient des forêts comme des obstacles, [ROOT.GetCharacter.GetFirstNameNoTooltip] y voit une opportunité."
 trait_open_terrain_expert_character_desc:0 "$cc_trait_open_terrain_expert$[ROOT.GetCharacter.GetFirstNameNoTooltip] se sent chez lui dans les champs ouverts et les vastes espaces, et sait en tirer profit à la bataille."
 trait_rough_terrain_expert_character_desc:0 "$cc_trait_rough_terrain_expert$[ROOT.GetCharacter.GetFirstNameNoTooltip] peut faire d'un terrain difficile un outil puissant pour prendre l'avantage à la bataille."
 trait_desert_warrior_character_desc:0 "$cc_trait_desert_warrior$Le soleil punissant et la chaleur écrasante du désert ne sont pas un ennemi pour [ROOT.GetCharacter.GetFirstNameNoTooltip]."
 trait_jungle_stalker_character_desc:0 "$cc_trait_jungle_stalker$La jungle luxuriante est une alliée de [ROOT.GetCharacter.GetFirstNameNoTooltip]."
 trait_winter_soldier_character_desc:0 "$cc_trait_winter_soldier$[ROOT.GetCharacter.GetFirstNameNoTooltip] est forgé par le froid amer et sait en faire son avantage."
 trait_logistician_character_desc:0 "$cc_trait_logistician$[ROOT.GetCharacter.GetFirstNameNoTooltip] sait comment faire durer les provisions — et bien."
 trait_aggressive_attacker_desc:0 "$cc_trait_aggressive_attacker$Rien ne peut rassasier un Agresseur agressif si ce n'est le sang de ses ennemis."
 trait_flexible_leader_desc:0 "$cc_trait_flexible_leader$Ce personnage sait réduire l'avantage que procurent fortifications, terrains, rivières et passages à gué aux armées défensives."
 trait_forder_desc:1 "$cc_trait_forder$Ce personnage est à l'aise près de l'eau et ne subit aucun malus d'avantage en attaquant à travers des détroits ou des rivières."
 trait_holy_warrior_desc:0 "$cc_trait_holy_warrior$Brûlant d'un zèle fervent, le Guerrier saint ne se reposera pas avant d'avoir vaincu tous les Impies."
 trait_unyielding_defender_desc:0 "$cc_trait_unyielding_defender$Un Défenseur inflexible sait une chose par-dessus tout : l'ennemi s'arrête ici."
 trait_forest_fighter_desc:0 "$cc_trait_forest_fighter$Où certains voient des forêts comme des obstacles, ce personnage y voit une opportunité."
 trait_open_terrain_expert_desc:1 "$cc_trait_open_terrain_expert$Les champs ouverts et les vastes espaces sont là où ce personnage se sent chez lui, et il en tire rapidement profit à la bataille."
 trait_rough_terrain_expert_desc:0 "$cc_trait_rough_terrain_expert$Un terrain difficile peut être un outil puissant pour ceux qui savent l'utiliser et prendre l'avantage à la bataille."
 trait_desert_warrior_desc:0 "$cc_trait_desert_warrior$Le soleil punissant et la chaleur écrasante du désert ne sont pas un ennemi pour ce personnage."
 trait_jungle_stalker_desc:0 "$cc_trait_jungle_stalker$La jungle luxuriante est une alliée de ce personnage."
 trait_winter_soldier_desc:0 "$cc_trait_winter_soldier$Ce personnage est forgé par le froid amer et sait en faire son avantage."
 trait_logistician_desc:0 "$cc_trait_logistician$Si l'on connaît une chose chez le Logisticien, c'est comment faire durer les provisions — et bien."
