l_french:
 game_concept_prowess_skill_desc:3 "$game_concept_prowess$ est un secondaire [skill|E] qui reflète l'aptitude du personnage au combat personnel.\n\nUne compétence élevée Prowess signifie qu'ils sont plus susceptibles de survivre et de bien fonctionner à la fois comme [knights|E] in [battles|E] et en [single_combat_duel_plural|E].\n\nChaque point de Prowess donne un Chevalier:\n$BULLET_WITH_TAB$[damage|E]: #V [GetDefine('NCombat', 'KNIGHT_DAMAGE_PER_PROWESS')]#!\n$BULLET_WITH_TAB$[toughness|E]: #V [GetDefine('NCombat', 'KNIGHT_TOUGHNESS_PER_PROWESS')]#!\n\n$PROWESS_MUSCLE_INFO$ $cc_prowess_all_desc$"
 game_concept_knight_desc:4 "A $game_concept_knight$ is a [vassal|E] or [courtier|E] qui se bat directement dans votre [army|E].\n\nPendant [battles|E], $game_concept_knights$ utiliser leurs [prowess_skill|E] pour lutter plus efficacement. Un haut $game_concept_prowess$ signifie qu'ils seront en mesure d'infliger plus de dommages à l'ennemi, et sont plus susceptibles de survivre ou même de sortir de $game_concept_battle$ C'est bon.\n$cc_prowess_knight_desc$ \n\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_knight_desc_TOTO_DLC', 'game_concept_knight_desc_NO_TOTO_DLC' )][SelectLocalization( HasDlcFeature( 'accolades' ), 'game_concept_knight_desc_ACCOLADE_DLC', '' )]#weak Les chevaliers peuvent être connus par différents noms selon [culture] or [faith]. Par exemple, $knight_champion_no_tooltip_plural$, $knight_faris_no_tooltip_plural$ or $knight_baghatur_no_tooltip_plural$.\n\nLes chevaliers représentent à la fois le caractère et la continuité des troupes.#!"
 game_concept_martial_skill_desc:2 "$game_concept_martial$ [skill|E] indique à quel point un personnage est bon à la conduite [war|E] et menant [armies|E] in [battle|E].\n\nUne compétence martiale élevée est importante pour [army_commanders|E], car il améliore leur [advantage|E] in [battle|E].\n\nLes [lifestyle|E] est le [martial_lifestyle|E]. $cc_martial_all_desc$"
 martial_effect_desc:0 "Augmentations [advantage|E] en commandant des armées au combat $cc_martial_commander_desc$"
 game_concept_unlanded_desc:0 "$game_concept_unlanded$ Les personnages n'ont pas [holdings|E] dans leur [domain|E], mais peut théoriquement encore être [rulers|E] En quelque sorte. Par exemple, cela peut être le cas pour [heads_of_faith|E] et les Grands Maîtres [holy_orders|E]. $cc_mechanic_unlanded_desc_1$"
 game_concept_barony_desc:0 "$game_concept_baronies$ sont les plus bas classés [titles|E] et ont la plus petite empreinte sur la carte, organisée en [counties|E].\n\nBaronie Les titres doivent toujours avoir une [holder|E] si elles contiennent [holding|E]. $cc_mechanic_unlanded_desc_2$"
 game_concept_county_desc:0 "A $game_concept_county$ is a [title|E] rang inférieur à a [duchy|E] et ci-dessus a [barony|E].\n\nLe titre comprend [county_capital|E] dans le comté, ainsi que [de_jure|E] les droits de tous les Baronies du comté.\n\nLes comtés ont toujours [holders|E] parce que les capitales de comté ne peuvent pas être détruites. $cc_mechanic_unlanded_desc_3$"
 game_concept_duchy_desc:0 "A $game_concept_duchy$ is a [title|E] rang inférieur à a [kingdom|E] et ci-dessus a [county|E].\n\nLes [holder|E] d'un Duché a [de_jure|E] les droits à ses comtés constitutifs et peut avoir des comtes comme [vassals|E].\n\nLes duches peuvent être dormantes et n'avoir aucun Holder actuel. Ces titres peuvent être créés par [ruler|E] qui contrôle au moins la moitié de ses comtés. $cc_mechanic_unlanded_desc_4$"
 game_concept_kingdom_desc:0 "A $game_concept_kingdom$ is a [title|E] rang inférieur à [empire|E] et ci-dessus a [duchy|E].\n\nLes [holder|E] d'un Royaume a [de_jure|E] les droits sur son territoire constitutif et peut avoir des ducs comme [vassals|E].\n\nLes royaumes peuvent être dormants et n'ont pas de Holder actuel. Ces titres peuvent être créés par [ruler|E] qui contrôle au moins la moitié des comtés à l'intérieur.$cc_mechanic_unlanded_desc_5$"
 game_concept_empire_desc:1 "$game_concept_empires$ sont les plus classés [titles|E].\n\nLes [holder|E] d'un empire a [de_jure|E] les droits sur son territoire constitutif et peut avoir des Rois comme [vassals|E].\n\nLes empires peuvent être dormants et n'ont pas de Holder actuel. Ces titres peuvent être créés par [ruler|E] qui contrôle plus de 80% des comtés à l'intérieur. $cc_mechanic_unlanded_desc_6$"
 game_concept_title_tier_desc:2 "L'équivalent foncier du titre [rank|E], les $game_concept_title_tier$ détermine la position d'un [title|E] dans la hiérarchie du jeu.\n\nTous les titres ont un niveau, qui détermine le niveau le plus élevé possible de [vassals|E] que les [holder|E] Peut-être.\n\n[empire|E] > [kingdom|E] > [duchy|E] > [county|E] > [barony|E]. $cc_unlanded_all_desc$"
 bodyguard_employer_custom_effect_description:2 "A une chance d'empêcher l'Assassinat [GetScheme('murder').GetTypeName] [schemes|E]#!\nRéduit votre risque de mourir ou d'être capturé dans [battles|E] Vous vous battez tous les deux#! $cc_court_position_bodyguard_desc$"
 champion_employer_custom_effect_description:2 "Peut prendre votre place dans certains [single_combat_duel_plural|E]\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'champion_employer_custom_effect_description_TOTO_DLC', 'champion_employer_custom_effect_description_NO_TOTO_DLC' )] $cc_court_position_champion_desc$"
 trait_wounded_1_desc:0 "Ce personnage a été blessé, mais il guérira probablement avec le temps. $cc_trait_h_wounded$"
 trait_wounded_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] a été blessé, mais guérira probablement bien à temps. $cc_trait_h_wounded$"
 trait_one_eyed_desc:0 "Ce personnage n'a qu'un œil. $cc_trait_h_one_eyed$"
 trait_one_eyed_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] Un seul œil. $cc_trait_h_one_eyed$"
 trait_disfigured_desc:0 "Ce personnage est hideusement défiguré. $cc_trait_h_disfigured$"
 trait_disfigured_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] est hideusement défiguré. $cc_trait_h_disfigured$"
 trait_one_legged_desc:0 "Ce personnage n'a qu'une jambe. $cc_trait_h_one_legged$"
 trait_one_legged_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] Une seule jambe. $cc_trait_h_one_legged$"
 trait_wounded_2_desc:0 "Ce personnage a été gravement blessé, et la route vers la récupération pourrait être longue. $cc_trait_h_wounded_2$"
 trait_wounded_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] a été gravement blessé, et la route vers la récupération pourrait être longue. $cc_trait_h_wounded_2$"
 trait_wounded_3_desc:0 "Ce personnage a été brisé et s'accroche à la vie. $cc_trait_h_wounded_3$"
 trait_wounded_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] a été brisé, et s'accroche à la vie. $cc_trait_h_wounded_3$"
 trait_maimed_desc:1 "Ce personnage a été sérieusement mutilé. $cc_trait_h_maimed$"
 trait_maimed_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] a été sérieusement mutilé. $cc_trait_h_maimed$"


