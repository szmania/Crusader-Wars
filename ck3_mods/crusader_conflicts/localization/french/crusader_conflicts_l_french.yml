l_french:
 game_concept_crusader_conflicts:0 "Conflits croisés"
 game_concept_crusader_conflicts_desc:0 "$game_concept_crusader_conflicts$ est un mod qui vous permet de jouer vos batailles Cursader Kings III à Attila:Total War. Cliquez sur le bouton Swords dans l'interface de combat pour lancer la bataille à Attila: Total War."
 game_concept_crusader_conflicts_2:0 "CC"
 game_concept_cc_soldiers:0 "[crusader_conflicts_2|E] Militaires"
 game_concept_cc_soldiers_desc:0 "Les conflits croisés sont le nombre de soldats qui sont ajoutés à une unité à Attila: Total War."
 game_concept_cc_experience:0 "[crusader_conflicts_2|E] Expérience plate"
 game_concept_cc_experience_desc:0 "Conflits croisés L'expérience plate est l'expérience qui s'ajoute à l'expérience de l'unité à Attila: Total War."
 game_concept_cc_experience_modifier:0 "[crusader_conflicts_2|E] Modificateur d'expérience"
 game_concept_cc_experience_modifier_desc:0 "Le modificateur d'expérience des conflits croisés multiplie l'expérience d'une unité à Attila: Total War."
 game_concept_cc_general_unit:0 "Unité générale"
 game_concept_cc_general_unit_desc:0 "L'unité du général est l'unité qui accompagnera votre commandant dans votre armée à Attila: Total War."
 game_concept_cc_knight_unit:0 "Unité Chevalier"
 game_concept_cc_knight_unit_desc:0 "L'Unité Chevalier est l'unité dont la force est déterminée par le nombre et la compétence de la [knights|E] dans l'armée."
