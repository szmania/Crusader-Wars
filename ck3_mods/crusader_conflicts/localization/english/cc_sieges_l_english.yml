cc_siege_assault_insufficient_troops_tooltip: "You do not have enough soldiers to assault this siege. Your army must outnumber the garrison."
cc_siege_fight_button: "Fight the siege yourself!\nSiege engines built — Rams: $cc_ram_count$ ($cc_ram_pct$%), Towers: $cc_tower_count$ ($cc_tower_pct$%), Ladders: $cc_ladder_count$ ($cc_ladder_pct$%)\nSiege progress: $cc_engines_total_pct$% (engines at 25% / 50% / 75%)."
cc_siege_engines_built_tooltip: "Siege engines built: rams, towers and ladders are constructed as the siege progresses (1 at 25% progress, 2 at 50%, 3 at 75%)."
cc_siege_fight_button_disabled: "Fight the siege yourself!\n#N The walls must be breached, you must have siege weapons, or the siege must have progressed enough to build siege engines in order to fight the siege yourself. Engine construction progress: $cc_engines_total_pct$% (first engine at 25%).#!"
cc_engines_total_pct: "[Siege.GetProgress|0]"
cc_ram_count: "[Select_CString( GreaterThan_float( Siege.GetProgress, '(float)75' ), '3', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)50' ), '2', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)25' ), '1', '0' ) ) )]"
cc_tower_count: "[Select_CString( GreaterThan_float( Siege.GetProgress, '(float)75' ), '3', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)50' ), '2', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)25' ), '1', '0' ) ) )]"
cc_ladder_count: "[Select_CString( GreaterThan_float( Siege.GetProgress, '(float)75' ), '3', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)50' ), '2', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)25' ), '1', '0' ) ) )]"
cc_ram_pct: "[Select_CString( GreaterThan_float( Siege.GetProgress, '(float)75' ), '75', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)50' ), '50', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)25' ), '25', '0' ) ) )]"
cc_tower_pct: "[Select_CString( GreaterThan_float( Siege.GetProgress, '(float)75' ), '75', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)50' ), '50', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)25' ), '25', '0' ) ) )]"
cc_ladder_pct: "[Select_CString( GreaterThan_float( Siege.GetProgress, '(float)75' ), '75', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)50' ), '50', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)25' ), '25', '0' ) ) )]"
cc_siege_options_button: "Crusader Conflicts Mod Options"
