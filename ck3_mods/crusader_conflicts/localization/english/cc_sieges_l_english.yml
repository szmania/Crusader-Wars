l_english:
#Extracting Data
attacker_heritage: "[GetPlayer.MakeScope.Var('attacker_army').Army.GetCommander.GetCulture.GetHeritage.GetName]"
attacker_culture: "[GetPlayer.MakeScope.Var('attacker_army').Army.GetCommander.GetCulture.GetName]"
attacker_martial: "[GetPlayer.MakeScope.Var('attacker_army').Army.GetCommander.GetCommanderAdvantageDesc]"
attacker_prowess: "[GetPlayer.MakeScope.Var('attacker_army').Army.GetCommander.GetProwess]"
garrison_num: "[GetPlayer.MakeScope.Var('attacker_army').GetProvince.GetHolding.GetCurrentGarrisonSize]"
garrison_culture: "[GetPlayer.MakeScope.Var('attacker_army').GetProvince.GetCulture.GetName]"
garrison_heritage: "[GetPlayer.MakeScope.Var('attacker_army').GetProvince.GetCulture.GetHeritage.GetName]"
defender_realm: "[GetPlayer.MakeScope.Var('attacker_army').GetProvince.GetHolding.GetHolder.GetPrimaryTitle.GetName]"
holding_level_loc: "[GetPlayer.MakeScope.Var('siege_var').GetProvince.GetHolding.GetPrimaryBuildingType.GetKey]"
cc_siege_assault_insufficient_troops_tooltip: "You do not have enough soldiers to assault this siege. Your army must outnumber the garrison."
cc_siege_fight_button: "#S Fight the siege yourself!#!\nSiege engines built — Rams: $cc_ram_count$ (next: $cc_engine_build_pct$% built), Towers: $cc_tower_count$ (next: $cc_engine_build_pct$% built), Ladders: $cc_ladder_count$ (next: $cc_engine_build_pct$% built)\nSiege progress: $cc_engines_total_pct$% — $cc_next_engine_info$"
cc_siege_engines_built_tooltip: "Siege engines built: rams, towers and ladders are constructed as the siege progresses (1 at 25% progress, 2 at 50%, 3 at 75%)."
cc_siege_fight_button_disabled: "#S Fight the siege yourself!#!\n#N The walls must be breached, you must have siege weapons, or the siege must have progressed enough to build siege engines in order to fight the siege yourself. Siege progress: $cc_engines_total_pct$% — first siege engine $cc_engine_build_pct$% built (completed at 25% siege progress).#!"
cc_engines_total_pct: "[Siege.GetProgress|0]"
cc_ram_count: "[Select_CString( GreaterThan_float( Siege.GetProgress, '(float)75' ), '3', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)50' ), '2', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)25' ), '1', '0' ) ) )]"
cc_tower_count: "[Select_CString( GreaterThan_float( Siege.GetProgress, '(float)75' ), '3', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)50' ), '2', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)25' ), '1', '0' ) ) )]"
cc_ladder_count: "[Select_CString( GreaterThan_float( Siege.GetProgress, '(float)75' ), '3', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)50' ), '2', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)25' ), '1', '0' ) ) )]"
cc_next_engine_info: "[Select_CString( GreaterThan_float( Siege.GetProgress, '(float)75' ), 'all siege engines are built', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)50' ), 'next engine at 75% siege progress', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)25' ), 'next engine at 50% siege progress', 'first engine at 25% siege progress' ) ) )]"
cc_engine_build_pct: "[Select_float( GreaterThan_float( Siege.GetProgress, '(float)75' ), '(float)100', Select_float( GreaterThan_float( Siege.GetProgress, '(float)50' ), Multiply_float( Subtract_float( Siege.GetProgress, '(float)50' ), '(float)4' ), Select_float( GreaterThan_float( Siege.GetProgress, '(float)25' ), Multiply_float( Subtract_float( Siege.GetProgress, '(float)25' ), '(float)4' ), Multiply_float( Siege.GetProgress, '(float)4' ) ) ) )|0]"
cc_siege_options_button: "Crusader Conflicts Mod Options"
cc_siege_wait_button: "Wait just a few more days to fight this siege..."
