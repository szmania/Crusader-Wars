l_japanese:
 game_concept_prowess_skill_desc:3 "$game_concept_prowess$ 二次的なものです [skill|E] それは個人的な戦闘におけるキャラクターの適性を反映します。\n\n果敢スキルが高いということは、生き残る可能性が高く、また、 [knights|E] で [battles|E] そしてで [single_combat_duel_plural|E].\n\n勇気の各ポイントがナイトに与えられます:\n$BULLET_WITH_TAB$[damage|E]: #V [GetDefine('NCombat', 'KNIGHT_DAMAGE_PER_PROWESS')]#!\n$BULLET_WITH_TAB$[toughness|E]: #V [GetDefine('NCombat', 'KNIGHT_TOUGHNESS_PER_PROWESS')]#!\n\n$PROWESS_MUSCLE_INFO$ $cc_prowess_all_desc$"
 game_concept_knight_desc:4 "あ $game_concept_knight$ です [vassal|E] または [courtier|E] それはあなたの中で直接戦う [army|E].\n\nその間 [battles|E], $game_concept_knights$ 彼らのを使用してください [prowess_skill|E] より効果的に戦うために。高い $game_concept_prowess$ つまり、敵により多くのダメージを与えることができ、生き残る可能性が高く、さらには脱出する可能性も高くなります。 $game_concept_battle$ 無傷。\n$cc_prowess_knight_desc$ \n\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_knight_desc_TOTO_DLC', 'game_concept_knight_desc_NO_TOTO_DLC' )][SelectLocalization( HasDlcFeature( 'accolades' ), 'game_concept_knight_desc_ACCOLADE_DLC', '' )]#weak 騎士は状況に応じてさまざまな名前で知られています [culture] または [faith]。例えば、 $knight_champion_no_tooltip_plural$, $knight_faris_no_tooltip_plural$ または $knight_baghatur_no_tooltip_plural$.\n\n騎士は登場人物とその従軍団の両方を表します。#!"
 game_concept_martial_skill_desc:2 "$game_concept_martial$ [skill|E] キャラクターがどれだけ上手に戦うかを示します [war|E] そして主導権を握る [armies|E] で [battle|E].\n\n高い武術スキルは重要です [army_commanders|E]、それは彼らを改善するので、 [advantage|E] で [battle|E].\n\n対応する [lifestyle|E] です [martial_lifestyle|E]. $cc_martial_all_desc$"
 martial_effect_desc:0 "増加します [advantage|E] 戦闘で軍隊を指揮するとき $cc_martial_commander_desc$"
 game_concept_unlanded_desc:0 "$game_concept_unlanded$ キャラクターには何もありません [holdings|E] 彼らの中で [domain|E]、しかし理論的にはまだ可能です [rulers|E] ある種の。たとえば、次のような場合が考えられます。 [heads_of_faith|E] そしてグランドマスター達は [holy_orders|E]. $cc_mechanic_unlanded_desc_1$"
 game_concept_barony_desc:0 "$game_concept_baronies$ 最下位ランクです [titles|E] マップ上での占有面積が最小となり、より大きなグループに編成されます。 [counties|E].\n\n男爵位の称号には常に [holder|E] が含まれている場合 [holding|E]. $cc_mechanic_unlanded_desc_2$"
 game_concept_county_desc:0 "あ $game_concept_county$ です [title|E] a以下のランキング [duchy|E] そしてそれ以上 [barony|E].\n\nタイトルに含まれるのは、 [county_capital|E] 県内だけでなく、 [de_jure|E] 郡内のすべての男爵領に権利を与える。\n\n郡は常に [holders|E] 郡の首都は破壊できないからです。 $cc_mechanic_unlanded_desc_3$"
 game_concept_duchy_desc:0 "あ $game_concept_duchy$ です [title|E] a以下のランキング [kingdom|E] そしてそれ以上 [county|E].\n\nの [holder|E] 公国の [de_jure|E] 構成する郡に対する権利があり、次のように郡を持つことができます。 [vassals|E].\n\n公国は休眠状態にあり、現在の所有者がいない可能性があります。このようなタイトルは、 [ruler|E] 郡の少なくとも半分を支配している者。 $cc_mechanic_unlanded_desc_4$"
 game_concept_kingdom_desc:0 "あ $game_concept_kingdom$ です [title|E] 順位以下 [empire|E] そしてそれ以上 [duchy|E].\n\nの [holder|E] 王国の [de_jure|E] 構成領土に対する権利があり、公爵を公爵とすることができる [vassals|E].\n\n王国は休止状態にあり、現在の所有者がいない可能性があります。このようなタイトルは、 [ruler|E] 郡内の少なくとも半分を支配している人物。$cc_mechanic_unlanded_desc_5$"
 game_concept_empire_desc:1 "$game_concept_empires$ 最高ランクです [titles|E].\n\nの [holder|E] 帝国の [de_jure|E] 構成領土に対する権利を持ち、国王を次の地位に置くことができる [vassals|E].\n\n帝国は休眠状態にあり、現在の所有者がいない場合があります。このようなタイトルは、 [ruler|E] 誰がそれ以上のものを管理するか 80該当する郡の %。 $cc_mechanic_unlanded_desc_6$"
 game_concept_title_tier_desc:2 "タイトルに相当する土地 [rank|E]、 $game_concept_title_tier$ の位置を決定します [title|E] ゲームの階層内で。\n\nすべてのタイトルには Tier があり、これによって最高の Tier が決定されます。 [vassals|E] それは [holder|E] 持つことができる。\n\n[empire|E] > [kingdom|E] > [duchy|E] > [county|E] > [barony|E]. $cc_unlanded_all_desc$"
 bodyguard_employer_custom_effect_description:2 "暗殺を防ぐチャンスがある [GetScheme('murder').GetTypeName] [schemes|E]#!\n死亡したり巻き込まれるリスクが軽減されます。 [battles|E] あなたたちは両方とも戦っています#! $cc_court_position_bodyguard_desc$"
 champion_employer_custom_effect_description:2 "いくつかの場所であなたの代わりになることができます [single_combat_duel_plural|E]\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'champion_employer_custom_effect_description_TOTO_DLC', 'champion_employer_custom_effect_description_NO_TOTO_DLC' )] $cc_court_position_champion_desc$"
 trait_wounded_1_desc:0 "このキャラクターは負傷していますが、時間が経てばおそらくうまく回復するでしょう。 $cc_trait_h_wounded$"
 trait_wounded_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] 怪我をしているが、時間が経てばきっと治るだろう。 $cc_trait_h_wounded$"
 trait_one_eyed_desc:0 "このキャラクターには片目しかありません。 $cc_trait_h_one_eyed$"
 trait_one_eyed_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] 目は一つしかありません。 $cc_trait_h_one_eyed$"
 trait_disfigured_desc:0 "このキャラクターはひどく傷ついています。 $cc_trait_h_disfigured$"
 trait_disfigured_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ひどく傷ついています。 $cc_trait_h_disfigured$"
 trait_one_legged_desc:0 "このキャラクターには片足しかありません。 $cc_trait_h_one_legged$"
 trait_one_legged_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] 足が1本しかありません。 $cc_trait_h_one_legged$"
 trait_wounded_2_desc:0 "このキャラクターは重傷を負っており、回復までの道のりは長いものになる可能性があります。 $cc_trait_h_wounded_2$"
 trait_wounded_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] 重傷を負っており、回復までの道のりは長くなる可能性がある。 $cc_trait_h_wounded_2$"
 trait_wounded_3_desc:0 "この性格は壊れていて、人生にしがみついています。 $cc_trait_h_wounded_3$"
 trait_wounded_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] 壊れて、命にしがみついている。 $cc_trait_h_wounded_3$"
 trait_maimed_desc:1 "このキャラクターは重傷を負っています。 $cc_trait_h_maimed$"
 trait_maimed_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] 重度の障害を受けています。 $cc_trait_h_maimed$"


