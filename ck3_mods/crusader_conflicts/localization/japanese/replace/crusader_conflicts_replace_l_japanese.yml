 trait_aggressive_attacker_character_desc:0 "$cc_trait_aggressive_attacker$ 何も満たされない [ROOT.GetCharacter.GetFirstNameNoTooltip] しかし、の血 [ROOT.GetCharacter.GetHerHis] 敵。"
 trait_flexible_leader_character_desc:0 "$cc_trait_flexible_leader$[ROOT.GetCharacter.GetFirstNameNoTooltip] 防衛軍が要塞、地形、川、海峡横断から得られるアドバンテージを減らす方法を知っています。"
 trait_forder_character_desc:1 "$cc_trait_forder$[ROOT.GetCharacter.GetFirstNameNoTooltip] 水の近くに本拠地があり、直線や川を越えて攻撃する場合、戦闘でアドバンテージのペナルティを受けません。"
 trait_holy_warrior_character_desc:0 "$cc_trait_holy_warrior$正義の熱意に燃えて、 [ROOT.GetCharacter.GetFirstNameNoTooltip] すべての異教徒が敗北するまで休むことはない。"
 trait_unyielding_defender_character_desc:0 "$cc_trait_unyielding_defender$[ROOT.GetCharacter.GetFirstNameNoTooltip] 何よりも知っていることは 1 つあります。それは敵がどこまでも続くということです。"
 trait_forest_fighter_character_desc:0 "$cc_trait_forest_fighter$森林を障害物とみなす人もいますが、 [ROOT.GetCharacter.GetFirstNameNoTooltip] チャンスを見出す。"
 trait_open_terrain_expert_character_desc:0 "$cc_trait_open_terrain_expert$開けた野原と広大な空間がそこにあります [ROOT.GetCharacter.GetFirstNameNoTooltip] 彼らはくつろいでおり、戦闘ではそれをすぐに利用します。"
 trait_rough_terrain_expert_character_desc:0 "$cc_trait_rough_terrain_expert$困難な地形は、それを利用して戦闘で優位に立つことができる人にとっては強力なツールとなります。"
 trait_desert_warrior_character_desc:0 "$cc_trait_desert_warrior$厳しい太陽と砂漠の灼熱は敵ではありません。 [ROOT.GetCharacter.GetFirstNameNoTooltip]."
 trait_jungle_stalker_character_desc:0 "$cc_trait_jungle_stalker$ジャングルの緑豊かな森林は、 [ROOT.GetCharacter.GetFirstNameNoTooltip]."
 trait_winter_soldier_character_desc:0 "$cc_trait_winter_soldier$[ROOT.GetCharacter.GetFirstNameNoTooltip] 厳しい寒さで鍛えられ、それを変える方法を知っている [ROOT.GetCharacter.GetHerHis] アドバンテージ。"
 trait_logistician_character_desc:0 "$cc_trait_logistician$一つあるとすれば [ROOT.GetCharacter.GetFirstNameNoTooltip] わかっていますが、それは物資を長持ちさせる方法、そして長持ちさせる方法です。"
 
 
 trait_aggressive_attacker_desc:0 "$cc_trait_aggressive_attacker$攻撃的な攻撃者を満足させるものは敵の血以外にありません。"
 trait_flexible_leader_desc:0 "$cc_trait_flexible_leader$このキャラクターは、防御軍が要塞、地形、川、海峡横断によって得られるアドバンテージを減らす方法を知っています。"
 trait_forder_desc:1 "$cc_trait_forder$このキャラクターは水の近くに住んでおり、直線や川を越えて攻撃する場合、戦闘でアドバンテージペナルティを受けません。"
 trait_holy_warrior_desc:0 "$cc_trait_holy_warrior$正義の熱意に燃える聖戦士は、異教徒をすべて倒すまで休むことはない。"
 trait_unyielding_defender_desc:0 "$cc_trait_unyielding_defender$不屈の守備者は、何よりも一つのことを知っています。それは、敵がどこまでも続くということです。"
 trait_forest_fighter_desc:0 "$cc_trait_forest_fighter$森を障害物と見る人もいますが、このキャラクターはチャンスだと考えています。"
 trait_open_terrain_expert_desc:1 "$cc_trait_open_terrain_expert$オープンフィールドと広大な空間はこのキャラクターがくつろ​​げる場所であり、戦闘ではこれをすぐに利用します。"
 trait_rough_terrain_expert_desc:0 "$cc_trait_rough_terrain_expert$困難な地形は、それを利用して戦闘で優位に立つことができる人にとっては強力なツールとなります。"
 trait_desert_warrior_desc:0 "$cc_trait_desert_warrior$厳しい太陽と砂漠の灼熱はこのキャラクターにとって敵ではありません。"
 trait_jungle_stalker_desc:0 "$cc_trait_jungle_stalker$ジャングルの緑豊かな森は、このキャラクターの味方です。"
 trait_winter_soldier_desc:0 "$cc_trait_winter_soldier$この性格は厳しい寒さによって形成されており、それを有利に変える方法を知っています。"
 trait_logistician_desc:0 "$cc_trait_logistician$物流担当者が知っていることが 1 つあるとすれば、それは、供給品を長持ちさせる方法、そして長持ちさせる方法です。"
 
