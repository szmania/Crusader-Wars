	#
	### Event/Alert Window button texts ###
	ccalert.1.title: "Crusader Conflicts の通知|「クオリティ オブ ライフ」プレベータ|3 月 2024"
	ccalert.1.desc: "#high MODはvに更新されました0.9.11 「Qaulity of Life!」、バグを避けるためにまだCrusader Conflicts Launcherを更新していない場合は今すぐ更新してください。\n\nCrusader Conflicts ランチャーは #high 別 #! SteamワークショップCKより3 モジュール。 Steam は CK を自動的に更新します3 mod ファイルですが、Steam では可能です #high ない #! CrusaderConflicts.exe ランチャーを自動的に更新します。 CKを開く必要があります3 少なくとも 1 回は、CC ランチャーにアクセスして更新します。開かないと、ランチャーは更新を検出しません。\n\n#X 更新されたランチャーをダウンロードしないと、Attila の戦闘がクラッシュします。あなたは警告を受けました。"
 	ccalert.1.a: "今からCrusader Conflicts Launcherをアップデートします！"
