	### Battle Scale tab texts ###
	cc_op_tab2_desc: "全体的な調整 [battle|E] サイズ。手動戦闘のパフォーマンスと範囲を管理するために使用されます。\n\n#high Total War: Attila で制御される手動戦闘にのみ影響します。通常のクルセイダーキングには影響なし 3 戦い。#!"
	cc_op_scale_head: "全体的な戦闘規模のスケール"
	cc_op_scale_desc: "Crusader Kings の全体的なスケーリング 3 [army|E] Total War: Attila の戦いの合計。手動戦闘のローエンド マシンのパフォーマンスを向上させるために使用されます。\n\nに設定すると 50% このオプションは Crusader Kings を変換します 3 合計で戦う 40,000 [soldiers|E] 総力戦へ: アッティラの戦い 20,000。すべての単位タイプは均等にスケールされます。\n\n#high デフォルト値は 100% #!\n#i 減少して戦闘パフォーマンスが向上します#!"
	cc_op_automax_head: "最大戦闘制限を超える自動スケール"
	cc_op_automax_desc: "有効にすると、 [battle|E] を超えるもの #high 最大戦闘制限#! の [soldiers|E] で設定された制限まで自動的にスケールダウンされます。 #high 最大戦闘制限#!。 Total War: Attila をクラッシュさせる大規模で大規模なエンドゲームの戦いを管理するために使用されます。\n\n#high デフォルト値は有効です #!\n#X このオプションを無効にするとクラッシュが発生する可能性があります"
	cc_op_max_head: "最大戦闘制限"
	cc_op_max_desc: "オートスケールが有効な場合 - a [battle|E] この量を超えるものは [soldiers|E] この制限までスケールダウンされます。大規模なエンドゲーム戦闘の管理に使用されます。\n\nに設定すると 20,000 このオプションはCrusader Kingsを変換します 3 との戦い 40,000 [soldiers|E] 総力戦へ: アッティラの戦い 20,000 兵士たち。すべての単位タイプは均等にスケールされます。\n\N#high Total War: 戦闘でこの正確な値を使用するには、Attila を ULTRA ユニット サイズに設定する必要があります。#! ユニットのサイズが ULTRA 未満に設定されている場合、戦闘中のユニットあたりの人数が減少する可能性があります。\n\n#high デフォルト値は 40,000#!\n#i 減少して戦闘パフォーマンスが向上します#!"
	#
	### Unit Size tab texts ###
	cc_op_tab3_desc: "Crusader Conflicts の戦いではすべて [soldiers|E] 参加する軍隊は、制御可能な個別のユニットによって代表されます。次の [regiments|E] タイプはユニット サイズを調整できます。\n\n#high デフォルト以外のオプションは戦闘バランスに影響を与え、戦闘が簡単になったり難しくなったりする可能性があります。"
	cc_op_unit1_head: "賦課金単位のサイズ"
	cc_op_unit1_desc: "[levies|E] 戦闘ではユニットの組み合わせによって表現されます。十字軍紛争の戦いでは、ほとんどの文化が徴収金を次のように徴収します。 65% 光槍ユニット、 10% 光遠距離ユニット、および 25% 中歩兵ユニット。特定の文化には違いがあります。\n\N#high Total War: 戦闘でこの正確な値を使用するには、Attila を ULTRA ユニット サイズに設定する必要があります。#! ユニットのサイズが ULTRA 未満に設定されている場合、戦闘中のユニットあたりの人数が減少する可能性があります。\n\n#high デフォルト値は 200 #!"
	cc_op_unit2_head: "近接戦闘兵のユニットサイズ"
	cc_op_unit2_desc: "近接攻撃 [men_at_arms|E] 連隊は、賦課金と比較して改良された装甲、武器、訓練を受けた兵士です。これらの軍隊は、剣、斧、槍、パイクなどの近接武器を使用して戦うユニットによって表されます。\n\n[regiment|E] の種類 [spearmen|E], [skirmishers|E]、 そして [heavy_infantry|E] 戦闘ではこのユニットサイズを使用します。\n\N#high Total War: 戦闘でこの正確な値を使用するには、Attila を ULTRA ユニット サイズに設定する必要があります。#! ユニットのサイズが ULTRA 未満に設定されている場合、戦闘中のユニットあたりの人数が減少する可能性があります。\n\n#high デフォルト値は 200 #!"
	cc_op_unit3_head: "遠隔武装兵のユニットサイズ"
	cc_op_unit3_desc: "遠距離攻撃 [men_at_arms|E] 連隊は、賦課金と比較して改良された装甲、武器、訓練を受けた兵士です。これらの軍隊は、弓、クロスボウ、スリング、ジャベリンなどの遠距離武器を使用して戦うユニットによって代表されます。\n\n[regiment|E] の種類 [archers|E] 戦闘ではこのユニットサイズを使用します。\n\N#high Total War: 戦闘でこの正確な値を使用するには、Attila を ULTRA ユニット サイズに設定する必要があります。#! ユニットのサイズが ULTRA 未満に設定されている場合、戦闘中のユニットあたりの人数が減少する可能性があります。\n\n#high デフォルト値は 200 #!"
	cc_op_unit4_head: "騎兵兵のユニットサイズ"
	cc_op_unit4_desc: "騎兵 [men_at_arms|E] 連隊は、馬やラクダなどの乗り物を持ち、賦課金と比較して改良された鎧、武器、訓練を受けた兵士です。これらの軍隊は、遠隔武器と近接武器の両方を使用して騎馬から戦うユニットによって代表されます。\n\n[regiment|E] の種類 [light_cavalry|E] そして [heavy_cavalry|E] 戦闘ではこのユニットサイズを使用します。\n\n#high デフォルト値は 100 #!"
	cc_op_unit5_head: "loc_Siege Men-at-Arms ユニット サイズ"
	cc_op_unit5_desc: "loc_攻城兵器の分割方法に関する説明。これは決して必要ないかもしれません\n\n#high デフォルト値は 100 #!"
	#
	### Prefs & Battle Rules tab texts ###
	cc_op_tab4_desc: "さまざまなタイプの陸軍司令官がアティラで直接制御できるようにするための特定のオプション\n\n#high MOD を初めて使用するユーザーにはデフォルト値を強くお勧めします。 #!"
	cc_op_control1_head: "ダイレクトバトルコントロール"
	cc_op_control1_desc: "の [commander|E] アッティラでどの戦闘を直接制御できるかを決定します。\n\nプレイヤー キャラクターのみがリスクと報酬のバランスを提供し、バニラ CK に適合します3 ロールプレイ体験。\nプレイヤーとマーシャルも許可します [marshal|E] 直接の戦闘制御を引き継ぎます。\nすべての王朝では、あなたのメンバーであれば誰でも許可されます [dynasty|E] 直接の戦闘制御を引き継ぎます。\nすべてのキャラクター では、任意の名前を付けたキャラクターを許可します [commander|E] 直接の戦闘制御を引き継ぎます。\n\n#high デフォルト値はプレイヤーキャラクターのみです #!\n\n#X デフォルト以外のオプションを使用すると、Crusader Kings の難易度が大幅に低下します。 3 キャンペーン"
	cc_op_unitnames_head: "直接戦闘ユニット名"
	cc_op_unitnames_desc: "ユニット名をクレイジーにするか、CKのように統一しますか?3 男性の武器名を一般化しますか？\n\n#high デフォルト値は「Flavorful Unit Names」です #!\n\n#X CK を使用している場合は、風味豊かなユニット名を使用してください3 AGOT などのオーバーホール、または Crusader Kings の Men At Arms の名前を調整する MOD 3"
	
