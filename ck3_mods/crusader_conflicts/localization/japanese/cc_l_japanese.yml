	### About Mod tab texts ###
	cc_op_tab1_desc: "Crusader Conflicts Mod オプションは現在以下でのみ利用可能です #high 英語#! ローカリゼーション。"
	cc_op_page1_desc: "#clickable MODの詳細"
	cc_op_about_head: "MODについて"
	cc_op_about_hsub: "仕組み:\n\n\n\n#i 必須：#!\n\n\n\n#i #high ユニットマッパー:#! #!\n\n\n#X サポートされていない:#!"
	cc_op_about_desc: "#high 十字軍の紛争#! あなたの戦いについて詳しく読みます #high クルセイダーキングス 3#! キャラクターが関与し、それを #high トータルウォー: アッティラの戦い#! 直接制御できること。賦課金、Men-at-Arms、Knight は Total War: Attila で同等のユニットに変換されます。単位の変換方法の詳細については、「 #clickable 文化別部隊#! タブ。\n\n#i Crusader Conflicts MOD スタンドアロン アプリケーション\nCrusader Kings の Steam バージョン 3、Total War: Attila、Attila DLC - Age of Charlemagne#!\n\n#i #high これは、MOD がどのユニットを Attila で使用するかを知る方法です。それぞれに必要な MOD/DLC があり、ユニット マッパーがロードされるときに有効にする必要があります。それらの構造は基本的に、MOD/DLC のユニットのグループに文化と遺産の名前を割り当てることです。#!\n\n#X 1212 AD スクリプト モジュール - のこの特定の部分をサブスクライブしないでください。 1212 広告モッド\n文化軍パック - CK3 モッド#!"
	cc_op_help_head: "ヘルプとコミュニティ"
	cc_op_help_hsub: "ヘルプ FAQ:\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nご質問がありますか?助けが必要ですか?"
	cc_op_help_desc: "#high アッティラの戦いはうまくいかない/遅れます!#! - Attila のグラフィック オプションを下げ、 #clickable バトルスケール#! オプション。上空の戦い 20k/40kは吃音するだろう。\n#high アッティラ戦の部隊番号が一致しません #clickable ユニットサイズ #!オプション！#! - UNIT SIZE の Attila グラフィックス オプションが ULTRA に設定されていることを確認します。 ULTRA より低いと単位が小さくなります。\n#high ロードしようとすると Attila がクラッシュします。#! - ロードされたユニット マッパーの正しい MOD が有効になっていないか、ロードされたユニット マッパーのユニット キーが正しくなく、戦闘に存在します。\n#high 「バトルをプレイ」ボタンをクリックしても何も起こりません。#! - 中央の旗のアイコンをクリックして、Crusader Conflicts Launcher が起動して実行中であることを確認します。\n#high 一部の戦闘を制御できないのはなぜですか!#! - 行かなければなりません #clickable 設定#! を選択し、戦える希望のキャラクターを選択します。これは、毎回の戦闘後とCK時に設定する必要がある唯一のオプションです。3 が始まります。\n#high 戦闘結果が不正確です！#! - 戦闘に勝利した後は、軍隊を消耗させる意味はありません。彼らの死傷者はカウントされません。\n#high CrusaderConflicts.pack が見つかりません。#! - CrusaderConflicts.pack は戦闘ごとに作り直されます。何も購読する必要はありません。MOD リストの一番下に置く必要があります。\n#high 戦闘後のロードが遅すぎる！#! - このため、CrusaderWars_Battle セーブデータを時々削除することをお勧めします。\n#high アッティラの単位は私の文化ではありません。#! - 部隊の文化は指揮官の文化に基づいているため、同じ文化圏に属さない指揮官がいる場合、部隊はその指揮官の文化のものになります。\n\n#high 不協和音 - https://discord.gg/eFZTprHh3j"
	cc_op_thank_head: "謝辞"
	cc_op_thank_hsub: "Crusader Conflicts 開発者より"
	cc_op_thank_desc: "すべてのCKをおめでとうございます3 そしてTotal War MOD制作者、彼らのMODを私たちのMODと一緒に使用する機会を与えてくれて、絶対的に歴史的に正確なユニットを作ってくれました！私たちは改造業界をより良い方向に変えています!また、コミュニティとパトロンのサポーターにも感謝したいと思います。私たちのプロジェクトを信じてくれてありがとう、私たちはあなたをとても愛しています!."
