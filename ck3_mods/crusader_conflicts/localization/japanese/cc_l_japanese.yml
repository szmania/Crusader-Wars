	### Troops by Culture conversions for both default attila and with 1212 AD HEADERS ### 
	cc_op_page2_desc: "#clickable 文化別の軍隊 (デフォルト)"
	cc_op_page3_desc: "#clickable 文化ごとの軍隊 1212 AD (オプション)"
