# ===========================================================================
# Crusader Conflicts sync: missing keys copied verbatim from localization\english
# (English fallback values; translators may replace the values in place later).
# ===========================================================================
 trait_aggressive_attacker_character_desc:0 "$cc_trait_aggressive_attacker$ Ничто не насытит [ROOT.GetCharacter.GetFirstNameNoTooltip] но кровь [ROOT.GetCharacter.GetHerHis] враги."
 trait_flexible_leader_character_desc:0 "$cc_trait_flexible_leader$[ROOT.GetCharacter.GetFirstNameNoTooltip] знает, как уменьшить преимущества, получаемые обороняющимися армиями от укреплений, местности, рек и переправ через проливы."
 trait_forder_character_desc:1 "$cc_trait_forder$[ROOT.GetCharacter.GetFirstNameNoTooltip] находится как дома у воды и не получит штрафа за преимущество в боях при атаке через проливы или реки."
 trait_holy_warrior_character_desc:0 "$cc_trait_holy_warrior$Пылая праведным пылом, [ROOT.GetCharacter.GetFirstNameNoTooltip] не успокоится, пока все язычники не будут побеждены."
 trait_unyielding_defender_character_desc:0 "$cc_trait_unyielding_defender$[ROOT.GetCharacter.GetFirstNameNoTooltip] знает одно превыше всего: это то, до чего может дойти враг."
 trait_forest_fighter_character_desc:0 "$cc_trait_forest_fighter$Там, где некоторые считают леса препятствиями, [ROOT.GetCharacter.GetFirstNameNoTooltip] видит возможность."
 trait_open_terrain_expert_character_desc:0 "$cc_trait_open_terrain_expert$Открытые поля и обширные пространства – вот где [ROOT.GetCharacter.GetFirstNameNoTooltip] чувствуют себя как дома и охотно пользуются этим в бою."
 trait_rough_terrain_expert_character_desc:0 "$cc_trait_rough_terrain_expert$Сложная местность может стать мощным инструментом для тех, кто способен использовать ее и одержать верх в бою."
 trait_desert_warrior_character_desc:0 "$cc_trait_desert_warrior$Карающее солнце и палящая жара пустыни не являются врагами [ROOT.GetCharacter.GetFirstNameNoTooltip]."
 trait_jungle_stalker_character_desc:0 "$cc_trait_jungle_stalker$Пышный лес любых джунглей – союзник [ROOT.GetCharacter.GetFirstNameNoTooltip]."
 trait_winter_soldier_character_desc:0 "$cc_trait_winter_soldier$[ROOT.GetCharacter.GetFirstNameNoTooltip] сформирован горьким холодом и знает, как превратить его в [ROOT.GetCharacter.GetHerHis] преимущество."
 trait_logistician_character_desc:0 "$cc_trait_logistician$Если есть одна вещь [ROOT.GetCharacter.GetFirstNameNoTooltip] знает, это то, как сделать так, чтобы запасы прослужили долго и долго."
 trait_aggressive_attacker_desc:0 "$cc_trait_aggressive_attacker$Ничто не насытит агрессивного атакующего, кроме крови его врагов."
 trait_flexible_leader_desc:0 "$cc_trait_flexible_leader$Этот персонаж знает, как уменьшить преимущество, получаемое обороняющимися армиями от укреплений, местности, рек и переправ через проливы."
 trait_forder_desc:1 "$cc_trait_forder$Этот персонаж чувствует себя как дома рядом с водой и не получит штрафа за преимущество в битвах при атаке через проливы или реки."
 trait_holy_warrior_desc:0 "$cc_trait_holy_warrior$Пылая праведным рвением, Святой Воин не успокоится, пока не будут побеждены все язычники."
 trait_unyielding_defender_desc:0 "$cc_trait_unyielding_defender$Непреклонный защитник превыше всего знает одно: враг не зайдет так далеко."
 trait_forest_fighter_desc:0 "$cc_trait_forest_fighter$Там, где некоторые видят в лесу препятствия, этот персонаж видит возможности."
 trait_open_terrain_expert_desc:1 "$cc_trait_open_terrain_expert$Открытые поля и обширные просторы — вот где этот персонаж чувствует себя как дома, и он быстро этим пользуется в бою."
 trait_rough_terrain_expert_desc:0 "$cc_trait_rough_terrain_expert$Сложная местность может стать мощным инструментом для тех, кто способен использовать ее и одержать верх в бою."
 trait_desert_warrior_desc:0 "$cc_trait_desert_warrior$Палящее солнце и палящая жара пустыни не являются врагами этого персонажа."
 trait_jungle_stalker_desc:0 "$cc_trait_jungle_stalker$Пышный лес любых джунглей – союзник этого персонажа."
 trait_winter_soldier_desc:0 "$cc_trait_winter_soldier$Этот характер сформирован сильным холодом и знает, как обратить его в свою пользу."
 trait_logistician_desc:0 "$cc_trait_logistician$Если есть что-то, что знает логист, так это то, как сделать так, чтобы запасы прослужили долго и долго."
