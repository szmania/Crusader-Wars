l_russian:
 game_concept_prowess_skill_desc:3 "$game_concept_prowess$ является второстепенным [skill|E] это отражает способности персонажа к личному бою.\n\nВысокий навык доблести означает, что у них больше шансов выжить и добиться хороших результатов как в [knights|E] в [battles|E] и в [single_combat_duel_plural|E].\n\nКаждое очко доблести дает Рыцарю:\n$BULLET_WITH_TAB$[damage|E]: #V [GetDefine('NCombat', 'KNIGHT_DAMAGE_PER_PROWESS')]#!\n$BULLET_WITH_TAB$[toughness|E]: #V [GetDefine('NCombat', 'KNIGHT_TOUGHNESS_PER_PROWESS')]#!\n\n$PROWESS_MUSCLE_INFO$ $cc_prowess_all_desc$"
 game_concept_knight_desc:4 "А $game_concept_knight$ это [vassal|E] или [courtier|E] который сражается прямо в вашем [army|E].\n\nВ течение [battles|E], $game_concept_knights$ использовать свои [prowess_skill|E] чтобы бороться более эффективно. Высокий $game_concept_prowess$ означает, что они смогут нанести противнику больший урон и с большей вероятностью выживут или даже выйдут из $game_concept_battle$ невредимый.\n$cc_prowess_knight_desc$ \n\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'game_concept_knight_desc_TOTO_DLC', 'game_concept_knight_desc_NO_TOTO_DLC' )][SelectLocalization( HasDlcFeature( 'accolades' ), 'game_concept_knight_desc_ACCOLADE_DLC', '' )]#weak Рыцари могут быть известны под разными именами в зависимости от [culture] или [faith]. Например, $knight_champion_no_tooltip_plural$, $knight_faris_no_tooltip_plural$ или $knight_baghatur_no_tooltip_plural$.\n\nРыцари представляют как персонажа, так и его свиту.#!"
 game_concept_martial_skill_desc:2 "$game_concept_martial$ [skill|E] показывает, насколько хорош персонаж в ведении боевых действий. [war|E] и ведущий [armies|E] в [battle|E].\n\nВысокое боевое мастерство важно для [army_commanders|E], поскольку это улучшает их [advantage|E] в [battle|E].\n\nСоответствующий [lifestyle|E] это [martial_lifestyle|E]. $cc_martial_all_desc$"
 martial_effect_desc:0 "Увеличивает [advantage|E] при командовании армиями в бою $cc_martial_commander_desc$"
 game_concept_unlanded_desc:0 "$game_concept_unlanded$ У персонажей нет [holdings|E] в их [domain|E], но теоретически все еще может быть [rulers|E] своего рода. Например, это может иметь место для [heads_of_faith|E] и великие магистры [holy_orders|E]. $cc_mechanic_unlanded_desc_1$"
 game_concept_barony_desc:0 "$game_concept_baronies$ имеют самый низкий рейтинг [titles|E] и иметь наименьший размер на карте, организованный в более крупные [counties|E].\n\nТитулы баронства всегда должны иметь [holder|E] если они содержат [holding|E]. $cc_mechanic_unlanded_desc_2$"
 game_concept_county_desc:0 "А $game_concept_county$ это [title|E] рейтинг ниже [duchy|E] и выше [barony|E].\n\nНазвание включает в себя [county_capital|E] в округе, а также [de_jure|E] права на все баронства в графстве.\n\nВ округах всегда есть [holders|E] потому что столицы графств не могут быть разрушены. $cc_mechanic_unlanded_desc_3$"
 game_concept_duchy_desc:0 "А $game_concept_duchy$ это [title|E] рейтинг ниже [kingdom|E] и выше [county|E].\n\n [holder|E] герцогства имеет [de_jure|E] права на входящие в его состав округа и может иметь графства в качестве [vassals|E].\n\nГерцогства могут бездействовать и не иметь текущего владельца. Такие заголовки могут быть созданы [ruler|E] который контролирует не менее половины своих графств. $cc_mechanic_unlanded_desc_4$"
 game_concept_kingdom_desc:0 "А $game_concept_kingdom$ это [title|E] рейтинг ниже [empire|E] и выше [duchy|E].\n\n [holder|E] Королевства имеет [de_jure|E] права на составную территорию и может иметь герцогов в качестве [vassals|E].\n\nКоролевства могут бездействовать и не иметь текущего владельца. Такие заголовки могут быть созданы [ruler|E] который контролирует как минимум половину графств внутри.$cc_mechanic_unlanded_desc_5$"
 game_concept_empire_desc:1 "$game_concept_empires$ имеют самый высокий рейтинг [titles|E].\n\n [holder|E] империи имеет [de_jure|E] права на составную территорию и может иметь королей в качестве [vassals|E].\n\nИмперии могут бездействовать и не иметь текущего владельца. Такие заголовки могут быть созданы [ruler|E] кто контролирует больше, чем 80% округов внутри. $cc_mechanic_unlanded_desc_6$"
 game_concept_title_tier_desc:2 "Земельный эквивалент титула [rank|E], $game_concept_title_tier$ определяет положение А. [title|E] в иерархии игры.\n\nВсе титулы имеют уровень, который определяет максимально возможный уровень. [vassals|E] что [holder|E] может иметь.\n\n[empire|E] > [kingdom|E] > [duchy|E] > [county|E] > [barony|E]. $cc_unlanded_all_desc$"
 bodyguard_employer_custom_effect_description:2 "Имеет шанс предотвратить убийство [GetScheme('murder').GetTypeName] [schemes|E]#!\nСнижает риск умереть или попасть в плен. [battles|E] вы оба ругаетесь#! $cc_court_position_bodyguard_desc$"
 champion_employer_custom_effect_description:2 "Может занять твое место в каком-нибудь [single_combat_duel_plural|E]\n[SelectLocalization( HasDlcFeature( 'tours_and_tournaments' ), 'champion_employer_custom_effect_description_TOTO_DLC', 'champion_employer_custom_effect_description_NO_TOTO_DLC' )] $cc_court_position_champion_desc$"
 trait_wounded_1_desc:0 "Этот персонаж был ранен, но, вероятно, со временем он выздоровеет. $cc_trait_h_wounded$"
 trait_wounded_1_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] был ранен, но, вероятно, со временем выздоровеет. $cc_trait_h_wounded$"
 trait_one_eyed_desc:0 "У этого персонажа только один глаз. $cc_trait_h_one_eyed$"
 trait_one_eyed_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] имеет только один глаз. $cc_trait_h_one_eyed$"
 trait_disfigured_desc:0 "Этот персонаж ужасно изуродован. $cc_trait_h_disfigured$"
 trait_disfigured_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] ужасно изуродован. $cc_trait_h_disfigured$"
 trait_one_legged_desc:0 "У этого персонажа только одна нога. $cc_trait_h_one_legged$"
 trait_one_legged_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] имеет только одну ногу. $cc_trait_h_one_legged$"
 trait_wounded_2_desc:0 "Этот персонаж получил серьёзную травму, и путь к выздоровлению может оказаться долгим. $cc_trait_h_wounded_2$"
 trait_wounded_2_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] получил серьёзную травму, и путь к выздоровлению может оказаться долгим. $cc_trait_h_wounded_2$"
 trait_wounded_3_desc:0 "Этот персонаж сломлен и цепляется за жизнь. $cc_trait_h_wounded_3$"
 trait_wounded_3_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] сломан и цепляется за жизнь. $cc_trait_h_wounded_3$"
 trait_maimed_desc:1 "Этот персонаж серьезно искалечен. $cc_trait_h_maimed$"
 trait_maimed_character_desc:0 "[ROOT.GetCharacter.GetFirstNameNoTooltip] был серьёзно искалечен. $cc_trait_h_maimed$"


