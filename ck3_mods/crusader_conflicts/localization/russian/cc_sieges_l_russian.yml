l_russian:

	#Extracting Data

	attacker_heritage: "[GetPlayer.MakeScope.Var('attacker_army').Army.GetCommander.GetCulture.GetHeritage.GetName]"
	attacker_culture: "[GetPlayer.MakeScope.Var('attacker_army').Army.GetCommander.GetCulture.GetName]"
	attacker_martial: "[GetPlayer.MakeScope.Var('attacker_army').Army.GetCommander.GetCommanderAdvantageDesc]"
	attacker_prowess: "[GetPlayer.MakeScope.Var('attacker_army').Army.GetCommander.GetProwess]"

	garrison_num: "[GetPlayer.MakeScope.Var('attacker_army').Province.GetHolding.GetCurrentGarrisonSize]"
	garrison_culture: "[GetPlayer.MakeScope.Var('attacker_army').Province.GetCulture.GetName]"
	garrison_heritage: "[GetPlayer.MakeScope.Var('attacker_army').Province.GetCulture.GetHeritage.GetName]"

	defender_realm: "[GetPlayer.MakeScope.Var('attacker_army').Province.GetHolding.GetHolder.GetPrimaryTitle.GetName]"
      
      
    holding_level_loc: "[GetPlayer.MakeScope.Var('siege_var').GetProvince.GetHolding.GetPrimaryBuildingType.GetKey]"
  
    cc_siege_fight_button: "#S Сразитесь в этой осаде сами!#!\nПостроено осадных орудий — Тараны: $cc_ram_count$ (следующее: $cc_engine_build_pct$% построено), Башни: $cc_tower_count$ (следующее: $cc_engine_build_pct$% построено), Лестницы: $cc_ladder_count$ (следующее: $cc_engine_build_pct$% построено)\nПрогресс осады: $cc_engines_total_pct$% — $cc_next_engine_info$"
    cc_siege_engines_built_tooltip: "Построено осадных орудий: тараны, башни и лестницы строятся по мере осады (1 при 25% прогресса, 2 при 50%, 3 при 75%)."
    cc_siege_fight_button_disabled: "#S Сразитесь в этой осаде сами!#!\n#N Стены должны быть пробиты, у вас должны быть осадные орудия, или осада должна продвинуться достаточно для их постройки, чтобы сразиться в этой осаде самим. Прогресс осады: $cc_engines_total_pct$% — первое осадное орудие построено на $cc_engine_build_pct$% (завершено при 25% прогресса осады).#!"
    cc_engines_total_pct: "[Siege.GetProgress|0]"
    cc_ram_count: "[Select_CString( GreaterThan_float( Siege.GetProgress, '(float)75' ), '3', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)50' ), '2', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)25' ), '1', '0' ) ) )]"
    cc_tower_count: "[Select_CString( GreaterThan_float( Siege.GetProgress, '(float)75' ), '3', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)50' ), '2', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)25' ), '1', '0' ) ) )]"
    cc_ladder_count: "[Select_CString( GreaterThan_float( Siege.GetProgress, '(float)75' ), '3', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)50' ), '2', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)25' ), '1', '0' ) ) )]"
    cc_next_engine_info: "[Select_CString( GreaterThan_float( Siege.GetProgress, '(float)75' ), 'все осадные орудия построены', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)50' ), 'следующее орудие при 75% прогресса осады', Select_CString( GreaterThan_float( Siege.GetProgress, '(float)25' ), 'следующее орудие при 50% прогресса осады', 'первое орудие при 25% прогресса осады' ) ) )]"
    cc_engine_build_pct: "[Select_float( GreaterThan_float( Siege.GetProgress, '(float)75' ), '(float)100', Select_float( GreaterThan_float( Siege.GetProgress, '(float)50' ), Multiply_float( Subtract_float( Siege.GetProgress, '(float)50' ), '(float)4' ), Select_float( GreaterThan_float( Siege.GetProgress, '(float)25' ), Multiply_float( Subtract_float( Siege.GetProgress, '(float)25' ), '(float)4' ), Multiply_float( Siege.GetProgress, '(float)4' ) ) ) )|0]"
    cc_siege_assault_insufficient_troops_tooltip: "У вас недостаточно солдат для штурма этой осады. Ваша армия должна превосходить гарнизон по численности."
    cc_siege_options_button: "Параметры мода Crusader Conflicts"
    cc_siege_wait_button: "Подождите ещё несколько дней, чтобы сразиться в этой осаде..."
