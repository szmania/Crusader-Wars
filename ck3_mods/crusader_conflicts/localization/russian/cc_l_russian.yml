	### About Mod tab texts ###
	cc_op_tab1_desc: "Параметры мода Crusader Conflicts в настоящее время доступны только в #high Английский#! локализация."
	cc_op_page1_desc: "#clickable Подробности мода"
	cc_op_about_head: "О моде"
	cc_op_about_hsub: "Как это работает:\n\n\n\n#i Необходимый:#!\n\n\n\n#i #high Картографы единиц:#! #!\n\n\n#X Не поддерживается:#!"
	cc_op_about_desc: "#high Конфликты крестоносцев#! подробно читает о битве, которую вы #high Короли крестоносцев 3#! персонаж участвует и превращает это в #high Total War: Битва Аттилы#! которым вы можете напрямую управлять. Рекруты, воины и рыцари преобразованы в эквивалентные отряды в Total War: Attila. Подробную информацию о том, как конвертировать единицы, см. #clickable Отряд по культуре#! вкладки.\n\n#i Автономное приложение мода Crusader Conflics\nSteam-версии Crusader Kings 3, Total War: Attila, Attila DLC - Age of Charlemagne#!\n\n#i #high Таким образом мод узнает, какие юниты использовать на Аттиле. У каждого из них есть необходимые моды/DLC, которые вам необходимо включить при загрузке картографа юнитов. Их структура в основном заключается в присвоении названий культур и наследия группе единиц модов/DLC.#!\n\n#X 1212 Модуль AD Scripts — не подписывайтесь на эту конкретную часть 1212 мод AD\nПакет «Культурные армии» — CK3 мод#!"
	cc_op_help_head: "Помощь и сообщество"
	cc_op_help_hsub: "Помощь Часто задаваемые вопросы:\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\nЕсть вопросы? Нужна помощь?"
	cc_op_help_desc: "#high Бои Аттилы идут плохо/лагает!#! - Уменьшите параметры графики в Аттиле, уменьшите #clickable Боевая шкала#! параметры. Битвы выше 20к/40К будет заикаться.\n#high Номера отрядов в битве при Аттиле не совпадают #clickable Размер устройства #!параметры!#! - Параметр просмотра графики Attila для UNIT SIZE установлен на ULTRA. Ниже, чем ULTRA, блоки будут меньшего размера.\n#high Аттила вылетает при попытке загрузки!#! - Вы либо не включили правильные моды для загруженного картографа юнитов, либо у загруженного картографа юнитов неправильный ключ юнита, который присутствует в битве.\n#high Нажатие кнопки «Играть в бой» ничего не дает!#! - Убедитесь, что программа запуска Crusader Conflicts запущена и работает, щелкнув центральный значок флажка.\n#high Почему я не могу контролировать некоторые сражения!#! - Тебе нужно пойти в #clickable Предпочтения#! , и выберите нужных персонажей, которые смогут сражаться. Это единственная опция, которую нужно выставлять после каждого боя и при ск.3 начинается.\n#high Неточные результаты боя!#! - После победы в битве нет смысла гонять войска, их потери не учитываются.\n#high Я не могу найти CrusaderConflicts.pack!#! - CrusaderConflicts.pack переделывается в каждом бою, вам не нужно ни на что подписываться, он должен находиться в самом низу вашего списка модов.\n#high После боя загрузка идет слишком медленно!#! - Для этого рекомендуем время от времени удалять сохранения CrusaderWars_Battle.\n#high Юниты Аттилы не из моей культуры!#! - Культура юнитов основана на культуре командира, поэтому, если у вас есть командир не вашей культуры, юниты будут принадлежать его культуре.\n\n#high Раздор - https://discord.gg/eFZTprHh3j"
	cc_op_thank_head: "Благодарности"
	cc_op_thank_hsub: "От разработчиков Crusader Conflicts.."
	cc_op_thank_desc: "Мы поздравляем каждый ск3 и моддеру Total War, за предоставленную нам возможность использовать их моды с нашими и за наличие абсолютно исторически точных юнитов! Мы меняем моддинг-индустрию к лучшему! Мы также хотим поблагодарить сообщество и наших сторонников на патреоне, спасибо за веру в наш проект, мы вас очень любим!."
	#
	### Troops by Culture conversions for both default attila and with 1212 AD HEADERS ### 
	cc_op_page2_desc: "#clickable Войска по культуре (по умолчанию)"
	cc_op_page3_desc: "#clickable Войска по культуре с 1212 AD (необязательно)"
	#
	### Battle Scale tab texts ###
	cc_op_tab2_desc: "Корректировки в целом [battle|E] размер, используемый для управления производительностью и объемом ручных сражений.\n\n#high Влияет только на ручные сражения, управляемые в Total War: Attila. Никакого влияния на обычных королей-крестоносцев. 3 сражения.#!"
	cc_op_scale_head: "Общая шкала размера боя"
	cc_op_scale_desc: "Общий масштаб Crusader Kings 3 [army|E] итоги битв Total War: Attila. Используется для повышения производительности на машинах более низкого уровня в ручных боях.\n\nЕсли установлено значение 50% этот вариант конвертирует Crusader Kings 3 бой с общим количеством 40,000 [soldiers|E] в битву Total War: Attila 20,000. Все типы юнитов будут масштабироваться одинаково.\n\n#high Значение по умолчанию: 100% #!\n#i Уменьшение для улучшения боевых характеристик#!"
	cc_op_automax_head: "Автоматическое масштабирование за пределы максимального боевого лимита"
	cc_op_automax_desc: "При включении [battle|E] что превышает #high Максимальный лимит боя#! из [soldiers|E] будет автоматически уменьшено до предела, установленного в #high Максимальный лимит боя#!. Используется для управления масштабными, масштабными битвами в конце игры, которые могут привести к сбою Total War: Attila.\n\n#high Значение по умолчанию включено. #!\n#X Отключение этой опции может привести к сбоям"
	cc_op_max_head: "Максимальный лимит боя"
	cc_op_max_desc: "Когда автоматическое масштабирование включено - [battle|E] которые превышают это количество [soldiers|E] будет уменьшено до этого предела. Используется для управления большими сражениями в конце игры.\n\nЕсли установлено значение 20,000 эта опция преобразует Crusader Kings 3 битва с 40,000 [soldiers|E] вплоть до битвы Total War: Attila 20,000 солдаты. Все типы юнитов будут масштабироваться одинаково.\n\N#high Для Total War: Attila необходимо установить размер отряда ULTRA, чтобы в сражениях использовалось именно это значение.#! Если размер отряда установлен ниже ULTRA, количество людей в отряде может быть уменьшено в бою.\n\n#high Значение по умолчанию: 40,000#!\n#i Уменьшение для улучшения боевых характеристик#!"
	#
	### Unit Size tab texts ###
	cc_op_tab3_desc: "В Crusader Conflicts сражаются все [soldiers|E] из участвующих армий представлены отдельные отряды, которыми можно управлять. Следующее [regiments|E] Типы могут регулировать размер своего устройства.\n\n#high Параметры, отличные от стандартных, повлияют на баланс боя, что может сделать сражения проще или сложнее."
	cc_op_unit1_head: "Размер единицы сбора"
	cc_op_unit1_desc: "[levies|E] представлены в бою смесью отрядов. В битвах «Конфликтов крестоносцев» большинство культур выставляют свои рекруты в качестве 65% легких копейщиков, 10% единиц легкого дальнего боя, и 25% единиц средней пехоты. Некоторые культуры имеют различия.\n\N#high Для Total War: Attila необходимо установить размер отряда ULTRA, чтобы в сражениях использовалось именно это значение.#! Если размер отряда установлен ниже ULTRA, количество людей в отряде может быть уменьшено в бою.\n\n#high Значение по умолчанию: 200 #!"
	cc_op_unit2_head: "Размер отряда бойцов ближнего боя"
	cc_op_unit2_desc: "ближний бой [men_at_arms|E] полки - это солдаты с улучшенной броней, вооружением и подготовкой по сравнению с рекрутами. Эти войска представлены отрядами, которые сражаются с использованием оружия ближнего боя, такого как мечи, топоры, копья или пики.\n\n[regiment|E] типы [spearmen|E], [skirmishers|E], и [heavy_infantry|E] используйте этот размер отряда в бою.\n\N#high Для Total War: Attila необходимо установить размер отряда ULTRA, чтобы в сражениях использовалось именно это значение.#! Если размер отряда установлен ниже ULTRA, количество людей в отряде может быть уменьшено в бою.\n\n#high Значение по умолчанию: 200 #!"
	cc_op_unit3_head: "Размер отряда дальнего боя"
	cc_op_unit3_desc: "Дальний бой [men_at_arms|E] полки - это солдаты с улучшенной броней, вооружением и подготовкой по сравнению с рекрутами. Эти войска представлены отрядами, которые сражаются с использованием оружия дальнего боя, такого как луки, арбалеты, пращи или дротики.\n\n[regiment|E] типы [archers|E] используйте этот размер отряда в бою.\n\N#high Для Total War: Attila необходимо установить размер отряда ULTRA, чтобы в сражениях использовалось именно это значение.#! Если размер отряда установлен ниже ULTRA, количество людей в отряде может быть уменьшено в бою.\n\n#high Значение по умолчанию: 200 #!"
	cc_op_unit4_head: "Размер отряда кавалерийских воинов"
	cc_op_unit4_desc: "Кавалерия [men_at_arms|E] полки - это солдаты с ездовыми животными, такими как лошади или верблюды, с улучшенной броней, оружием и подготовкой по сравнению с рекрутами. Эти войска представлены отрядами, которые сражаются верхом, используя как оружие дальнего, так и ближнего боя.\n\n[regiment|E] типы [light_cavalry|E] и [heavy_cavalry|E] используйте этот размер отряда в бою.\n\n#high Значение по умолчанию: 100 #!"
	cc_op_unit5_head: "loc_Siege Размер отряда воинов"
	cc_op_unit5_desc: "loc_Description о том, как делятся осадные орудия. возможно, это никогда не понадобится\n\n#high Значение по умолчанию: 100 #!"
	#
	### Prefs & Battle Rules tab texts ###
	cc_op_tab4_desc: "Конкретные варианты, позволяющие различным типам командующих армиями взять на себя прямой контроль над Атиллой.\n\n#high Значения по умолчанию настоятельно рекомендуются для начинающих пользователей мода. #!"
	cc_op_control1_head: "Прямое управление боем"
	cc_op_control1_desc: " [commander|E] определяет, какими сражениями можно напрямую управлять в Аттиле.\n\nТолько персонаж игрока предлагает баланс риска и вознаграждения и подходит для ванильного CK.3 опыт ролевой игры.\nИгрок и Маршал также позволят вашему [marshal|E] взять на себя непосредственное управление боем.\nAll Dynasty позволит любому члену вашей [dynasty|E] взять на себя непосредственное управление боем.\nВсе персонажи позволят любому персонажу, которого вы называете [commander|E] взять на себя непосредственное управление боем.\n\n#high Значение по умолчанию — «Только персонаж игрока». #!\n\n#X Параметры, отличные от стандартных, значительно снизят сложность ваших Crusader Kings. 3 кампания"
	cc_op_unitnames_head: "Названия прямых боевых единиц"
	cc_op_unitnames_desc: "Вы хотите, чтобы названия юнитов были сумасшедшими или стандартизированными, как CK?3 обобщить имена воинов?\n\n#high Значение по умолчанию — «Вкусные имена юнитов». #!\n\n#X Используйте красивые названия юнитов, если вы используете CK.3 капитальный ремонт, такой как AGOT, или мод, изменяющий имена Men At Arms в Crusader Kings. 3"
	
