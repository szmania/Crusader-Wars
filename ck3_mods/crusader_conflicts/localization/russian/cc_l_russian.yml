	cc_op_tab5_desc: "подробности о сопоставлении юнитов, как по умолчанию, так и CK3 совместимость модов ".
	cc_op_tab5_default: "#clickable Войска по культуре (по умолчанию)"
	cc_op_tab5_compatmods: "#clickable Войска по культуре (Совместимые моды)"
	cc_op_tab5_custom: "#clickable Войска по культуре (настроить)"
	cc_op_about_hsub_um: "Как это работает:\n\n\n\n#i Необходимый:#!\n\n\n\n#i #high Необязательный:#! #!\n\n#X Не поддерживается:#!"
	cc_op_about_desc_um: "#high Конфликты крестоносцев#! подробно читает о битве, которую вы #high Короли крестоносцев 3#! персонаж участвует и превращает это в #high Total War: Битва Аттилы#! которым вы можете напрямую управлять. Рекруты, воины и рыцари преобразованы в эквивалентные отряды в Total War: Attila. Подробную информацию о том, как конвертировать единицы, см. #clickable Отряд по культуре#! вкладки.\n\n#i Steam-версии Crusader Kings 3, Total War: Attila, Attila DLC - Age of Charlemagne\nПодписан мод Crusader Conflics для ОБОИХ Crusader Kings. 3 И Total War: Attila\nАвтономное приложение мода Crusader Conflics #!\n\n#i #high Total War: Attila мод - 1212 AD (пакеты моделей 1-8)#! #!- для дополнительных культурных единиц#!\n\n#X 1212 Модуль AD Scripts — не подписывайтесь на эту конкретную часть 1212 мод AD#!"
	cc_op_help_hsub_um: "Помощь Часто задаваемые вопросы:\n\n\n\n\n\n\nЕсть вопросы? Нужна помощь?"
	cc_op_help_desc_um: "#high Бои Аттилы идут плохо/лагает!#! - Уменьшите параметры графики в Аттиле, уменьшите #clickable Боевая шкала#! параметры. Также убедитесь, что Crusader Kings 3 полностью приостанавливается в фоновом режиме.\n#high Номера отрядов в битве при Аттиле не совпадают #clickable Размер устройства #!параметры!#! - Параметр просмотра графики Attila для UNIT SIZE установлен на ULTRA. Ниже, чем ULTRA, блоки будут меньшего размера.\n#high Аттила вылетает при попытке загрузки!#! - Проверьте, что вы НЕ используете 1212 Мод AD Scripts.\n#high Нажатие кнопки «Играть в бой» ничего не дает!#! - Проверьте, что вы запускаете CK.3 через CrusaderConflicts.exe, щелкнув значок центрального флага, не запускайте CK вручную.3 из Steam.\n#high Почему я не могу контролировать некоторые сражения!#! - Ручные бои доступны только в том случае, если персонаж игрока лично командует армией.\n\n#high Раздор - #! https://discord.gg/eFZTprHh3j"
	cc_op_thank_hsub_um: "1212 Команда модов AD"
	cc_op_thank_desc_um: "За создание безумно обширного средневекового мода для Аттилы, чтобы мы могли использовать более подходящие юниты!"
