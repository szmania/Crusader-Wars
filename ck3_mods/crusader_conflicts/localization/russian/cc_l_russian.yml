	#
	### Event/Alert Window button texts ###
	ccalert.1.title: "Уведомление о конфликтах Crusader|Предварительная бета-версия «Качество жизни»|Март 2024"
	ccalert.1.desc: "#high Мод обновлен до версии v.0.9.11 «Качество жизни!», обновите программу запуска Crusader Conflicts прямо сейчас, если вы еще этого не сделали, чтобы избежать ошибок.\n\nЛаунчер Crusader Conflicts #high отдельный #! из Мастерской Steam CK3 мод. Steam автоматически обновит CK3 файл мода, но Steam делает #high НЕТ #! автоматически обновить программу запуска CrusaderConflicts.exe. Вам нужно открыть СК3 хотя бы один раз, а затем зайдите в CW Launcher и обновите его. Если вы не откроете его, программа запуска не обнаружит никаких обновлений!.\n\n#X Если вы не загрузите обновленный лаунчер, ваши битвы Аттилы вылетят. Вы были предупреждены."
 	ccalert.1.a: "Я обновлю лаунчер Crusader Conflicts прямо сейчас!"
